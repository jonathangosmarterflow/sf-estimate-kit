<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estimate Funnel Kit - Studio</title>
<style>
:root{
  --brand:#1d4ed8;
  --ink:#0f172a; --ink2:#475569; --ink3:#64748b;
  --line:#e2e8f0; --line2:#cbd5e1;
  --bg:#f1f5f9; --card:#fff;
  --ok:#047857; --okbg:#ecfdf5; --okline:#a7f3d0;
  --warn:#b45309; --warnbg:#fffbeb; --warnline:#fde68a;
  --bad:#b91c1c; --badbg:#fef2f2; --badline:#fecaca;
  --r:14px;
  --sh:0 1px 2px rgba(15,23,42,.05), 0 10px 26px rgba(15,23,42,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}

/* ---- top bar ---- */
.top{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topin{max-width:1500px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brandmark{font-weight:800;letter-spacing:-.02em;font-size:16px;display:flex;align-items:center;gap:9px}
.dot{width:10px;height:10px;border-radius:3px;background:var(--brand);display:inline-block}
.bizchip{font-size:13px;font-weight:700;color:var(--ink2);background:#f1f5f9;border-radius:999px;padding:5px 12px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topsp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.saved{font-size:12px;font-weight:700;color:var(--ink3);white-space:nowrap;opacity:.6;transition:opacity .2s ease,color .2s ease}
.saved.flash{opacity:1;color:var(--ok)}
.saved.off{opacity:1;color:var(--warn)}

/* ---- tabs ---- */
.tabs{max-width:1500px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.tab{
  appearance:none;background:none;border:0;border-bottom:3px solid transparent;
  padding:12px 15px;font-size:14.5px;font-weight:700;color:var(--ink3);cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:8px;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tab .n{
  width:21px;height:21px;border-radius:50%;background:#e2e8f0;color:var(--ink2);
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;
}
.tab[aria-selected="true"] .n{background:var(--brand);color:#fff}

/* ---- layout ---- */
.shell{max-width:1500px;margin:0 auto;padding:20px 18px 60px;display:flex;gap:22px;align-items:flex-start}
.main{flex:1;min-width:0}
.side{width:380px;flex:0 0 380px;position:sticky;top:96px}
@media (max-width:1180px){ .shell{display:block} .side{width:auto;position:static;margin-top:24px} }

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:18px;letter-spacing:-.02em}
.card h3{margin:20px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.lead{margin:0 0 16px;color:var(--ink2);font-size:14.5px}

/* ---- buttons ---- */
.b{
  appearance:none;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:9px 14px;
  font-size:14px;font-weight:700;cursor:pointer;transition:background .12s,border-color .12s,transform .06s;
}
.b:hover{background:#f8fafc;border-color:#94a3b8}
.b:active{transform:translateY(1px)}
.b.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.b.pri:hover{filter:brightness(1.07);background:var(--brand)}
.b.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.b.danger{color:var(--bad);border-color:var(--badline)}
.b.danger:hover{background:var(--badbg)}
.b[disabled]{opacity:.42;cursor:not-allowed}
.b.wide{width:100%;text-align:center;display:block}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* ---- forms ---- */
.f{display:block;margin-bottom:14px}
.f > span{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.f .hint{font-weight:500;color:var(--ink3);font-size:12.5px;margin-top:4px;display:block}
.i{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;font-size:14.5px}
.i:focus{outline:2px solid rgba(29,78,216,.28);outline-offset:1px;border-color:var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:680px){ .grid2{grid-template-columns:1fr} }

/* ---- niche grid ---- */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ncard{
  border:1.5px solid var(--line);border-radius:12px;padding:14px;background:#fff;cursor:pointer;text-align:left;
  transition:border-color .12s,box-shadow .12s,transform .06s;
}
.ncard:hover{border-color:var(--brand);box-shadow:0 6px 18px rgba(29,78,216,.10)}
.ncard:active{transform:translateY(1px)}
.ncard.on{border-color:var(--brand);background:#f5f8ff}
.ncard .nt{font-weight:800;font-size:15px;margin-bottom:3px}
.ncard .nd{font-size:12.5px;color:var(--ink3)}
.ncard .nr{font-size:13px;font-weight:700;color:var(--brand);margin-top:7px}

/* ---- service / question rows ---- */
.srow{
  border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;
}
.srow.example{border-color:var(--warnline);background:var(--warnbg)}
.srow.confirmed{border-color:var(--okline);background:var(--okbg)}
.sgrid{display:grid;grid-template-columns:2fr 1fr 1fr 78px 78px auto;gap:8px;align-items:end}
@media (max-width:900px){ .sgrid{grid-template-columns:1fr 1fr} }
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;
  border-radius:999px;padding:3px 9px;letter-spacing:.02em;
}
.badge.ex{background:#fef3c7;color:#92400e}
.badge.re{background:#d1fae5;color:#065f46}
.badge.low{background:#fef3c7;color:#92400e}
.badge.ok{background:#d1fae5;color:#065f46}
.tiny{font-size:12.5px;color:var(--ink3)}
.qcard{border:1px solid var(--line);border-left:4px solid #8b5cf6;border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
.qcard.urg{border-left-color:#f59e0b}
.optrow{display:grid;grid-template-columns:1fr 120px 100px auto;gap:8px;align-items:center;margin-bottom:7px}
@media (max-width:760px){ .optrow{grid-template-columns:1fr 1fr} }
.applies{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.applies label{font-size:12.5px;background:#f1f5f9;border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.applies label.on{background:#e0e7ff;color:#3730a3;font-weight:700}

/* ---- knobs ---- */
.knob{padding:14px 0;border-bottom:1px solid var(--line)}
.knob:last-child{border-bottom:0}
.knobhead{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
.knobhead .kn{font-weight:800;font-size:15px}
.knobhead .kv{margin-left:auto;font-weight:800;font-size:19px;color:var(--brand);font-variant-numeric:tabular-nums}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;cursor:pointer;display:block;
}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--brand) var(--pct,50%),#e2e8f0 var(--pct,50%))}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--brand);
  margin-top:-9px;box-shadow:0 2px 8px rgba(15,23,42,.22);
}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:#e2e8f0}
input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--brand)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--brand);box-shadow:0 2px 8px rgba(15,23,42,.22)}
.kmath{font-size:13.5px;color:var(--ink2);background:#f8fafc;border-radius:9px;padding:9px 12px;margin-top:2px}
/* the star of the show */
.hero-knob{border:2px solid var(--brand);background:linear-gradient(180deg,#f7faff,#fff);border-radius:16px;padding:18px 18px 14px;margin:0 0 6px}
.hero-knob .kn{font-size:20px;letter-spacing:-.02em}
.hero-knob .kv{font-size:42px;line-height:1}
.hero-knob input[type=range]{height:46px}
.hero-knob input[type=range]::-webkit-slider-runnable-track{height:14px}
.hero-knob input[type=range]::-webkit-slider-thumb{width:38px;height:38px;border-width:4px;margin-top:-12px}
.hero-knob input[type=range]::-moz-range-track{height:14px}
.hero-knob input[type=range]::-moz-range-thumb{width:34px;height:34px;border-width:4px}
.hero-knob .kmath{font-size:15.5px;background:#eef4ff;color:#1e3a8a;font-weight:600;padding:11px 14px}
.hero-knob .ends{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink3);margin-top:-4px}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
@media (max-width:760px){ .minis{grid-template-columns:1fr} }

/* ---- live preview cards ---- */
.samples{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){ .samples{grid-template-columns:1fr} }
.sample{
  border:1px solid var(--line);border-radius:14px;padding:16px 14px;background:#fff;text-align:center;
  box-shadow:var(--sh);position:relative;overflow:hidden;
}
.sample .sl{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
.sample .sv{
  font-size:clamp(24px,3.9vw,38px);font-weight:800;letter-spacing:-.03em;color:var(--brand);
  font-variant-numeric:tabular-nums;margin:8px 0 3px;line-height:1.08;
  /* two lines tall whatever the number, so all three cards line up on camera */
  min-height:2.16em;display:flex;align-items:center;justify-content:center;text-align:center;
}
.sample .sg{font-size:13.5px;color:var(--ink3);height:19px;font-variant-numeric:tabular-nums;font-weight:600}
.sample .sg b{color:#94a3b8;font-weight:700;text-decoration:line-through}
.sample .sw{font-size:12px;color:var(--ink3);margin-top:6px}
.sample.pulse{animation:pl .32s ease}
@keyframes pl{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}

/* ---- notices ---- */
.note{border-radius:11px;padding:12px 14px;font-size:14px;margin:10px 0;border:1px solid}
.note.ok{background:var(--okbg);border-color:var(--okline);color:#065f46}
.note.warn{background:var(--warnbg);border-color:var(--warnline);color:#92400e}
.note.bad{background:var(--badbg);border-color:var(--badline);color:#991b1b}
.note.info{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
.note ul{margin:7px 0 0;padding-left:20px}
.note li{margin:4px 0}
.ta{width:100%;min-height:150px;padding:12px;border:1px solid var(--line2);border-radius:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.5;resize:vertical;background:#fff}

/* ---- checklist ---- */
.check{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check .mk{width:23px;height:23px;border-radius:50%;flex:0 0 23px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;background:#64748b}
.check.done .mk{background:var(--ok)}
.check.opt .mk{background:#64748b}
/* a blocking check that is not done yet is RED, because the words under it say
 * "fix the red checks above". Text and colour have to agree. */
.check.todo{background:var(--badbg);border:1px solid var(--badline);border-radius:10px;padding:11px 12px;margin:6px 0}
.check.todo .mk{background:var(--bad)}
.check.todo .ct b{color:#7f1d1d}
.check.todo .ct span{color:#991b1b}
.check .ct{flex:1}
.check .ct b{display:block;font-size:14.5px}
.check .ct span{font-size:13px;color:var(--ink3)}

/* ---- preview panel ---- */
.pvhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pvhead b{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.pvframe{width:100%;height:560px;border:1px solid var(--line);border-radius:14px;background:#fff;display:block}
.pvframe.phone{max-width:340px;margin:0 auto;height:620px;border-radius:22px}

table.tt{width:100%;border-collapse:collapse;font-size:13.5px}
table.tt th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);padding:6px 8px;border-bottom:1px solid var(--line)}
table.tt td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
code.k{background:#f1f5f9;border-radius:5px;padding:1px 5px;font-size:12.5px}
.check.amber{background:var(--warnbg);border:1px solid var(--warnline);border-radius:10px;padding:11px 12px;margin:6px 0}
.check.amber .mk{background:var(--warn)}
/* where leads go */
.leadopts{display:grid;gap:10px;margin:4px 0 14px}
.leadopt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;background:#fff}
.leadopt:hover{border-color:#94a3b8}
.leadopt.on{border-color:var(--brand);background:#f5f8ff}
.leadopt input{margin-top:3px;width:18px;height:18px;flex:0 0 18px}
.leadopt b{display:block;font-size:14.5px}
.leadopt span{font-size:13px;color:var(--ink3)}
ol.steps{font-size:14.5px;color:var(--ink2);padding-left:20px;margin:0 0 12px}
ol.steps li{margin:5px 0}
/* live link */
.qrbox{margin:14px 0 6px;text-align:center}
.qrbox canvas{width:100%;max-width:420px;height:auto;image-rendering:pixelated;border:1px solid var(--line);border-radius:10px;background:#fff}
.sfoot{max-width:1500px;margin:0 auto;padding:0 18px 30px;font-size:12.5px;color:var(--ink3)}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<div class="top">
  <div class="topin">
    <span class="brandmark"><span class="dot"></span>Estimate Funnel Kit</span>
    <span class="bizchip" id="bizchip">Your business</span>
    <span class="topsp">
      <span class="saved" id="savedchip" aria-live="polite" title="Your work is kept in this browser on this computer. Export my work gives you a file you can move anywhere.">Saved on this computer</span>
      <button class="b sm" id="btn-export">Export my work</button>
      <button class="b sm" id="btn-import">Import a file</button>
      <button class="b sm" id="btn-fresh">Start fresh</button>
      <input type="file" id="file-import" accept=".json,.html,.txt" class="hide">
    </span>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
</div>

<div class="shell">
  <div class="main" id="main"></div>
  <div class="side">
    <div class="card" style="padding:16px">
      <div class="pvhead"><b>Live preview</b>
        <button class="b sm" id="pv-refresh" style="margin-left:auto">Refresh</button>
        <button class="b sm" id="pv-size">Phone</button>
      </div>
      <iframe class="pvframe phone" id="pvframe" title="Funnel preview"></iframe>
      <div class="tiny" style="margin-top:8px">This is exactly what a customer sees.</div>
    </div>
  </div>
</div>

<div id="selftest" class="sr" aria-live="polite"></div>

<div class="sfoot">Estimate Funnel Kit v1.2. Everything here runs in this browser. Nothing leaves this computer unless you press a button that says it sends.</div>

<script>/* Estimate Funnel Kit - engine.js - v1.2
 * Pure functions. No dependencies. Runs in node and in the browser.
 * Nothing in here ever throws. If something is wrong you get plain English back.
 * Attaches to globalThis.EFK and also exports for node.
 */
(function (root) {
  'use strict';

  var VERSION = '1.2.1';

  /* The one email relay the kit supports (option "Email me each lead"). Facts
   * checked 2026-09-30: JSON POST from a browser, CORS open to any origin
   * including file:// and a null origin iframe, free plan 250 submissions a month.
   * It is a constant on purpose: a config can never point the relay elsewhere. */
  var RELAY_URL = 'https://api.web3forms.com/submit';
  var LEAD_MODES = ['webhook', 'email', 'none'];
  var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  /* ------------------------------------------------------------------ *
   * 0. Small helpers
   * ------------------------------------------------------------------ */

  function isObj(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }
  function isArr(v) { return Array.isArray(v); }
  function isStr(v) { return typeof v === 'string'; }
  function isFiniteNum(v) { return typeof v === 'number' && isFinite(v); }

  function clamp(n, lo, hi) {
    if (!isFiniteNum(n)) return lo;
    if (n < lo) return lo;
    if (n > hi) return hi;
    return n;
  }

  /* Turn almost anything into a number. Handles "$1,200", "1 200 USD",
   * "from 450", "12.5 hrs", "40%", true/false, null. Returns null if hopeless. */
  function toNum(v) {
    if (isFiniteNum(v)) return v;
    if (typeof v === 'boolean') return v ? 1 : 0;
    if (v === null || v === undefined) return null;
    if (typeof v === 'object') return null;
    var s = String(v);
    s = s.replace(/[\u2212\u2013\u2014]/g, '-');           // unicode minus / dashes
    s = s.replace(/[^0-9eE+\-.,]/g, ' ');                   // drop currency words + symbols
    s = s.replace(/(\d)[ ,](?=\d{3}\b)/g, '$1');            // 1,200 and 1 200 -> 1200
    var m = s.match(/-?\d*\.?\d+(?:[eE][+-]?\d+)?/);
    if (!m) return null;
    var n = parseFloat(m[0]);
    return isFinite(n) ? n : null;
  }

  /* Pull every number out of a string, e.g. "150 to 650" -> [150, 650] */
  function allNums(v) {
    if (isFiniteNum(v)) return [v];
    if (!isStr(v)) return [];
    var s = String(v).replace(/(\d)[ ,](?=\d{3}\b)/g, '$1');
    var out = [], m, re = /-?\d*\.?\d+/g;
    while ((m = re.exec(s)) !== null) {
      var n = parseFloat(m[0]);
      if (isFinite(n)) out.push(n);
      if (out.length > 8) break;
    }
    return out;
  }

  function slugify(v, fallback) {
    var s = (v === null || v === undefined) ? '' : String(v);
    s = s.toLowerCase()
      .replace(/['\u2019]/g, '')
      .replace(/&/g, ' and ')
      .replace(/[^a-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '')
      .slice(0, 48);
    return s || (fallback || 'item');
  }

  function titleCase(s) {
    s = String(s || '').replace(/[_-]+/g, ' ').trim();
    if (!s) return '';
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function deepClone(v, seen) {
    seen = seen || [];
    if (v === null || typeof v !== 'object') return v;
    for (var i = 0; i < seen.length; i++) if (seen[i] === v) return null; // cycle guard
    seen = seen.concat([v]);
    if (isArr(v)) {
      var a = [];
      for (var j = 0; j < v.length; j++) a.push(deepClone(v[j], seen));
      return a;
    }
    var o = {};
    for (var k in v) if (Object.prototype.hasOwnProperty.call(v, k)) o[k] = deepClone(v[k], seen);
    return o;
  }

  function median(list) {
    if (!list || !list.length) return null;
    var a = list.slice().sort(function (x, y) { return x - y; });
    var mid = Math.floor(a.length / 2);
    return a.length % 2 ? a[mid] : (a[mid - 1] + a[mid]) / 2;
  }

  function uniqPush(arr, msg) {
    if (!msg) return;
    for (var i = 0; i < arr.length; i++) if (arr[i] === msg) return;
    arr.push(msg);
  }

  /* ------------------------------------------------------------------ *
   * 1. Lenient JSON reader (the Config Doctor's front door)
   * ------------------------------------------------------------------ */

  var QUOTE_PAIRS = { '"': '"', "'": "'", '`': '`', '\u201c': '\u201d', '\u2018': '\u2019', '\u201d': '\u201d', '\u2019': '\u2019' };

  function isQuote(ch) { return Object.prototype.hasOwnProperty.call(QUOTE_PAIRS, ch); }

  /* Find the first balanced {...} in arbitrary text, ignoring braces that live
   * inside strings or comments. Returns the substring, or '' if there is no '{'. */
  function firstBalanced(text) {
    var s = String(text || '');
    var start = -1, depth = 0, i = 0, n = s.length;
    while (i < n) {
      var ch = s[i];
      if (start === -1) {
        if (ch === '{') { start = i; depth = 1; i++; continue; }
        i++; continue;
      }
      if (isQuote(ch)) {
        var close = QUOTE_PAIRS[ch];
        i++;
        while (i < n) {
          if (s[i] === '\\') { i += 2; continue; }
          if (s[i] === close) { i++; break; }
          i++;
        }
