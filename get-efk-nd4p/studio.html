rt this page\u003c/a>\u003c/div>';\n}\n\n/* What a visitor sees when a live link is damaged, too big, too old or hostile. */\nfunction broken(){\n  root.innerHTML = '\u003cdiv class=\"panic\" id=\"broken\">\u003ch2>This link is broken or out of date.\u003c/h2>'\n    + '\u003cp style=\"margin:0;font-size:15px;color:#4b5563\">Ask the business for a fresh link.\u003c/p>\u003c/div>'\n    + kitFooterHtml();\n  try { document.title = 'Link not available'; } catch(e){}\n  postHeight();\n}\n\nvar RAW = '';\ntry { RAW = RUNNER ? '' : (document.getElementById('FUNNEL_CONFIG').textContent || ''); } catch(e){ RAW = ''; }\n\nif (typeof EFK === 'undefined') {\n  panic('This page is missing its pricing engine.', [\n    'Download funnel.html again from the Publish tab in your studio.',\n    'Do not copy only part of the file. It has to be the whole file.'\n  ]);\n  return;\n}\n\nvar DX = { ok:false, errors:[], config:null };\nvar CFG = null;\n\n/* ------------------------------------------------------------------ *\n * State\n * ------------------------------------------------------------------ */\nvar LOADED_AT = Date.now();\nvar MIN_SECONDS = 4;\nvar answers = { services: [], q: {} };\nvar contact = { name:'', email:'', phone:'' };\nvar stepIndex = 0;\n/* '' (not sent), 'sending', 'sent', 'failed' or 'unknown'. Only 'sent' ever\n * tells the visitor their details went anywhere. */\nvar sendState = '';\nvar botFlag = false;\nvar SELFTEST = false, PREVIEW_RESULT = false;\ntry {\n  SELFTEST = /[?&]selftest=1/.test(location.search);\n  PREVIEW_RESULT = /[?&]preview=result/.test(location.search);\n} catch(e){}\n/* the studio's side preview asks for the result screen this way, because an\n * iframe built from srcdoc cannot carry a query string. Never from a live link. */\ntry { if (!RUNNER && /\"preview_result\"\\s*:\\s*true/.test(RAW)) PREVIEW_RESULT = true; } catch(e){}\n\n/* v1.2.1: utm_ values come from the page query (a hosted file, or a live link written\n * LINK?utm_source=booked#v1...) and from a query written after a live link's settings\n * (LINK#v1...?utm_source=booked). EFK.linkUtm reads both. */\nvar UTM = { utm_source:'', utm_medium:'', utm_campaign:'' };\ntry { UTM = EFK.linkUtm(location.search, location.hash); } catch(e){}\n\nfunction applyBrand(){\n  try {\n    var col = CFG.business.brand_color;\n    if (!/^#[0-9a-fA-F]{6}$/.test(col)) return;\n    document.documentElement.style.setProperty('--brand', col);\n    var hex = col.replace('#','');\n    var r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);\n    if (isFinite(r)&&isFinite(g)&&isFinite(b)) {\n      document.documentElement.style.setProperty('--brand-soft','rgba('+r+','+g+','+b+',.10)');\n      document.documentElement.style.setProperty('--brand-line','rgba('+r+','+g+','+b+',.30)');\n    }\n  } catch(e){}\n  try { document.title = (CFG.business.name || 'Instant estimate') + ' - instant estimate'; } catch(e){}\n}\n\nfunction mode(){ return EFK.leadMode(CFG); }\nfunction bizName(){ return (CFG && CFG.business && CFG.business.name) || 'the business'; }\n\n/* ------------------------------------------------------------------ *\n * Step plan\n * ------------------------------------------------------------------ */\nfunction buildSteps(){\n  var steps = [{ kind:'services' }];\n  var qs = EFK.applicableQuestions(CFG, answers.services);\n  for (var i=0;i\u003cqs.length;i++) steps.push({ kind:'question', q: qs[i] });\n  if (CFG.toggles.contact_before_result && mode() !== 'none') steps.push({ kind:'contact' });\n  steps.push({ kind:'result' });\n  return steps;\n}\n\nfunction currentSteps(){ return buildSteps(); }\n\n/* ------------------------------------------------------------------ *\n * Render\n * ------------------------------------------------------------------ */\nfunction header(){\n  var b = CFG.business;\n  var logo = safeHref(b.logo_url);\n  var left = logo\n    ? '\u003cimg class=\"logo\" id=\"bizlogo\" src=\"'+esc(logo)+'\" alt=\"'+esc(b.name)+'\">'\n      + '\u003cspan class=\"bizname\" id=\"bizfallback\" style=\"display:none\">'+esc(b.name)+'\u003c/span>'\n    : '\u003cspan class=\"bizname\">'+esc(b.name)+'\u003c/span>';\n  var right = b.service_area ? '\u003cspan class=\"tag\">'+esc(b.service_area)+'\u003c/span>' : (b.tagline ? '\u003cspan class=\"tag\">'+esc(b.tagline)+'\u003c/span>' : '');\n  return '\u003cdiv class=\"head\">'+left+right+'\u003c/div>';\n}\n\nfunction bannerHtml(){\n  if (!CFG.demo_banner || RUNNER) return '';\n  var link = safeHref(CFG.demo_banner_url)\n    ? ' \u003ca href=\"'+esc(safeHref(CFG.demo_banner_url))+'\" target=\"_blank\" rel=\"noopener\">See how it was built\u003c/a>'\n    : '';\n  return '\u003cdiv class=\"banner\">\u003cspan>Demo built with the Estimate Funnel Kit\u003c/span>'+link+'\u003c/div>';\n}\n\nfunction render(){\n  var steps = currentSteps();\n  if (stepIndex >= steps.length) stepIndex = steps.length - 1;\n  if (stepIndex \u003c 0) stepIndex = 0;\n  var step = steps[stepIndex];\n  var pct = Math.round(((stepIndex) / Math.max(1, steps.length - 1)) * 100);\n\n  var body = '';\n  if (step.kind === 'services') body = viewServices();\n  else if (step.kind === 'question') body = viewQuestion(step.q);\n  else if (step.kind === 'contact') body = viewContact();\n  else body = viewResult();\n\n  var backBtn = stepIndex > 0 && step.kind !== 'result'\n    ? '\u003cbutton class=\"back\" type=\"button\" data-act=\"back\">&#8592; Back\u003c/button>' : '';\n\n  var counter = step.kind === 'result'\n    ? '\u003cspan>All done\u003c/span>'\n    : '\u003cspan>Step '+(stepIndex+1)+' of '+steps.length+'\u003c/span>';\n\n  root.innerHTML = bannerHtml() + '\u003cdiv class=\"wrap\">' + header()\n    + '\u003cdiv class=\"card\">\u003cdiv class=\"pbar\">\u003ci style=\"width:'+pct+'%\">\u003c/i>\u003c/div>'\n    + '\u003cdiv class=\"pad fadein\">'\n    + '\u003cdiv class=\"meta\">'+backBtn+counter+'\u003c/div>'\n    + body\n    + '\u003c/div>\u003c/div>'\n    + '\u003cdiv class=\"foot\">'+esc(mode() === 'none'\n        ? 'Your answers stay on this page. Nothing is sent anywhere.'\n        : 'Your answers are only sent if you choose to send them, and only to ' + bizName() + '.')+'\u003c/div>'\n    + '\u003c/div>' + kitFooterHtml();\n\n  wireLogo();\n  wire(step);\n  focusFirst();\n  postHeight();\n}\n\nfunction wireLogo(){\n  var lg = root.querySelector('#bizlogo');\n  if (!lg) return;\n  var fail = function(){\n    lg.style.display = 'none';\n    var f = root.querySelector('#bizfallback');\n    if (f) f.style.display = 'inline';\n  };\n  lg.addEventListener('error', fail);\n  if (lg.complete && lg.naturalWidth === 0 && lg.getAttribute('src')) fail();\n}\n\nfunction focusFirst(){\n  if (SELFTEST) return;\n  try {\n    var el = root.querySelector('.opt, .inp');\n    if (el && stepIndex > 0) el.focus({ preventScroll:true });\n  } catch(e){}\n}\n\n/* ---- step 1: pick the service ---- */\nfunction viewServices(){\n  var multi = CFG.allow_multiple_services !== false;\n  var h = '\u003ch1 class=\"q\">What do you need help with?\u003c/h1>'\n    + '\u003cp class=\"sub\">'+(multi ? 'Pick everything that applies.' : 'Pick the one that fits best.')+'\u003c/p>'\n    + '\u003cdiv class=\"opts\" role=\"group\">';\n  for (var i=0;i\u003cCFG.services.length;i++){\n    var s = CFG.services[i];\n    var on = answers.services.indexOf(s.key) !== -1;\n    h += '\u003cbutton class=\"opt'+(on?' sel':'')+'\" type=\"button\" data-act=\"svc\" data-key=\"'+esc(s.key)+'\">'\n       + esc(s.label)\n       + (s.help ? '\u003cspan class=\"oh\">'+esc(s.help)+'\u003c/span>' : '')\n       + '\u003cspan class=\"tick\">'+(on?'&#10003;':'')+'\u003c/span>\u003c/button>';\n  }\n  h += '\u003c/div>';\n  h += '\u003cdiv class=\"err\" id=\"err\">Pick at least one thing so we can price it.\u003c/div>';\n  h += '\u003cbutton class=\"btn\" type=\"button\" data-act=\"next\"'+(answers.services.length?'':' disabled')+'>Continue\u003c/button>';\n  return h;\n}\n\n/* ---- a question ---- */\nfunction viewQuestion(q){\n  var h = '\u003ch1 class=\"q\">'+esc(q.label)+'\u003c/h1>';\n  if (q.help) h += '\u003cp class=\"sub\">'+esc(q.help)+'\u003c/p>';\n  else if (q.type === 'multi') h += '\u003cp class=\"sub\">Pick everything that applies.\u003c/p>';\n\n  if (q.type === 'number'){\n    var cur = answers.q[q.key];\n    if (cur === undefined) cur = q.min;\n    h += '\u003cdiv class=\"fields\">\u003cdiv>\u003clabel class=\"fl\" for=\"numin\">Enter a number\u003c/label>'\n      + '\u003cinput class=\"inp\" id=\"numin\" type=\"number\" inputmode=\"numeric\" min=\"'+q.min+'\" max=\"'+q.max+'\" step=\"'+q.step+'\" value=\"'+esc(cur)+'\">\u003c/div>\u003c/div>'\n      + '\u003cdiv class=\"err\" id=\"err\">Enter a number between '+q.min+' and '+q.max+'.\u003c/div>'\n      + '\u003cbutton class=\"btn\" type=\"button\" data-act=\"numnext\">Continue\u003c/button>';\n    return h;\n  }\n\n  h += '\u003cdiv class=\"opts\" role=\"group\">';\n  for (var i=0;i\u003cq.options.length;i++){\n    var sel;\n    if (q.type === 'multi') {\n      var arr = answers.q[q.key] || [];\n      sel = arr.indexOf(i) !== -1;\n    } else sel = answers.q[q.key] === i;\n    h += '\u003cbutton class=\"opt'+(sel?' sel':'')+'\" type=\"button\" data-act=\"opt\" data-q=\"'+esc(q.key)+'\" data-i=\"'+i+'\">'\n      + esc(q.options[i].label)\n      + '\u003cspan class=\"tick\">'+(sel?'&#10003;':'')+'\u003c/span>\u003c/button>';\n  }\n  h += '\u003c/div>';\n  if (q.type === 'multi'){\n    h += '\u003cdiv class=\"err\" id=\"err\">Pick at least one answer.\u003c/div>';\n    h += '\u003cbutton class=\"btn\" type=\"button\" data-act=\"next\">Continue\u003c/button>';\n  }\n  return h;\n}\n\n/* ---- contact ---- */\nfunction viewContact(){\n  var f = CFG.lead_capture.fields;\n  var h = '\u003ch1 class=\"q\">Who is this estimate for?\u003c/h1>'\n    + '\u003cp class=\"sub\">'+esc(bizName())+' gets your answers with your estimate. Your number is on the next screen.\u003c/p>'\n    + '\u003cdiv class=\"fields\">';\n  if (f.indexOf('name') !== -1) h += fld('name','Your name','text','Alex Rivera','name');\n  if (f.indexOf('email') !== -1) h += fld('email','Email','email','alex@example.com','email');\n  if (f.indexOf('phone') !== -1) h += fld('phone','Phone (optional)','tel','(555) 012 3456','tel');\n  h += '\u003c/div>';\n  h += '\u003cinput class=\"hp\" type=\"text\" name=\"company\" id=\"hp\" tabindex=\"-1\" autocomplete=\"off\" aria-hidden=\"true\">';\n  h += '\u003cdiv class=\"err\" id=\"err\">Add a valid email address so they can reach you.\u003c/div>';\n  h += '\u003cbutton class=\"btn\" type=\"button\" data-act=\"contact\">See my estimate\u003c/button>';\n  if (CFG.lead_capture.consent_text) h += '\u003cdiv class=\"fine\">'+esc(CFG.lead_capture.consent_text)+'\u003c/div>';\n  return h;\n}\n\nfunction fld(key, label, type, ph, ac){\n  return '\u003cdiv>\u003clabel class=\"fl\" for=\"f-'+key+'\">'+esc(label)+'\u003c/label>'\n    + '\u003cinput class=\"inp\" id=\"f-'+key+'\" type=\"'+type+'\" autocomplete=\"'+ac+'\" placeholder=\"'+esc(ph)+'\" value=\"'+esc(contact[key]||'')+'\">\u003c/div>';\n}\n\n/* ---- result ---- */\nfunction viewResult(){\n  var est = EFK.estimate(CFG, answers);\n  var detail = CFG.knobs.detail_shown;\n  var h = '\u003cdiv class=\"res-lab\">'+esc(CFG.result_copy.headline)+'\u003c/div>';\n\n  if (est.unit === 'both' && est.price_lo !== null){\n    h += '\u003cdiv class=\"res-num\">'+esc(EFK.fmtMoney(est.price_lo, CFG)+' to '+EFK.fmtMoney(est.price_hi, CFG))+'\u003c/div>';\n    h += '\u003cdiv class=\"res-alt\">About '+esc(EFK.fmtHours(est.lo)+' to '+EFK.fmtHours(est.hi))+' hours of work\u003c/div>';\n  } else {\n    h += '\u003cdiv class=\"res-num\">'+esc(est.text)+'\u003c/div>';\n  }\n\n  h += '\u003cdiv class=\"chipline\">';\n  if (est.services_text) h += '\u003cspan class=\"chip\">'+esc(est.services_text)+'\u003c/span>';\n  if (CFG.toggles.show_timeline && est.timeline_text) h += '\u003cspan class=\"chip time\">'+esc(est.timeline_text)+'\u003c/span>';\n  h += '\u003c/div>';\n\n  if (CFG.toggles.show_drivers && detail > 33 && est.drivers.length){\n    h += '\u003cdiv class=\"sec\">\u003ch2>What drives your price\u003c/h2>';\n    for (var i=0;i\u003cest.drivers.length && i\u003c8;i++){\n      var d = est.drivers[i];\n      h += '\u003cdiv class=\"drv\">\u003cdiv class=\"dl\">\u003cb>'+esc(d.answer)+'\u003c/b>'+esc(d.label)+'\u003c/div>\u003cdiv class=\"dv\">'+esc(d.detail)+'\u003c/div>\u003c/div>';\n    }\n    h += '\u003c/div>';\n  }\n\n  if (detail > 66 && est.line_items.length > 1){\n    h += '\u003cdiv class=\"sec\">\u003ch2>Line by line\u003c/h2>';\n    for (var j=0;j\u003cest.line_items.length;j++){\n      var li = est.line_items[j];\n      var txt = (est.unit === 'price')\n        ? EFK.fmtMoney(li.lo, CFG)+' to '+EFK.fmtMoney(li.hi, CFG)\n        : EFK.fmtHours(li.lo)+' to '+EFK.fmtHours(li.hi)+' hours';\n      h += '\u003cdiv class=\"li\">\u003cspan>'+esc(li.label)+'\u003c/span>\u003cb>'+esc(txt)+'\u003c/b>\u003c/div>';\n    }\n    h += '\u003c/div>';\n  }\n\n  var url = safeHref(CFG.business.booking_url);\n  if (url) {\n    h += '\u003ca class=\"btn\" href=\"'+esc(url)+'\" target=\"_blank\" rel=\"noopener\" data-act=\"cta\">'+esc(CFG.result_copy.cta_label)+'\u003c/a>';\n  } else {\n    h += '\u003cbutton class=\"btn\" type=\"button\" disabled>'+esc(CFG.result_copy.cta_label)+'\u003c/button>';\n  }\n\n  /* Honest lead copy. With nowhere to send, there is no contact form at all and\n   * the booking button is the one next step. With somewhere to send, the page\n   * only says \"sent\" after the send really went out. */\n  if (mode() !== 'none'){\n    if (sendState) h += '\u003cdiv class=\"sec\" id=\"postcontact\">' + statusHtml(sendState) + '\u003c/div>';\n    else if (!CFG.toggles.contact_before_result) h += '\u003cdiv class=\"sec\" id=\"postcontact\">' + viewContactInline() + '\u003c/div>';\n  }\n\n  h += '\u003cdiv class=\"disc\">'+esc(CFG.result_copy.disclaimer)+'\u003c/div>';\n  h += '\u003cdiv style=\"margin-top:14px\">\u003cbutton class=\"btn ghost\" type=\"button\" data-act=\"restart\">Start over\u003c/button>\u003c/div>';\n  return h;\n}\n\nfunction statusHtml(st){\n  var biz = esc(bizName());\n  if (st === 'sending') return '\u003ch2 class=\"st\">\u003cspan class=\"spin\" style=\"border-color:var(--brand-line);border-top-color:var(--brand)\">\u003c/span>Sending your details to '+biz+'\u003c/h2>';\n  if (st === 'sent') return '\u003ch2 class=\"st\">Sent to '+biz+'\u003c/h2>\u003cdiv class=\"fine\" style=\"margin-top:0\">They have your answers and this range. The fastest next step is the button above.\u003c/div>';\n  if (st === 'unknown') return '\u003ch2 class=\"st\">We could not confirm it went through\u003c/h2>\u003cdiv class=\"fine\" style=\"margin-top:0\">Your estimate above is still yours. The fastest next step is the button above.\u003c/div>';\n  return '\u003ch2 class=\"st\">We could not send your details\u003c/h2>\u003cdiv class=\"fine\" style=\"margin-top:0\">Nothing reached '+biz+' this time. Your estimate above is still yours, and the fastest next step is the button above.\u003c/div>';\n}\n\nfunction viewContactInline(){\n  var f = CFG.lead_capture.fields;\n  var h = '\u003ch2>Send this estimate to '+esc(bizName())+'\u003c/h2>'\n    + '\u003cdiv class=\"fine\" style=\"margin:-4px 0 10px\">They get your answers with this range, so you do not have to explain it twice.\u003c/div>'\n    + '\u003cdiv class=\"fields\">';\n  if (f.indexOf('name') !== -1) h += fld('name','Your name','text','Alex Rivera','name');\n  if (f.indexOf('email') !== -1) h += fld('email','Email','email','alex@example.com','email');\n  if (f.indexOf('phone') !== -1) h += fld('phone','Phone (optional)','tel','(555) 012 3456','tel');\n  h += '\u003c/div>';\n  h += '\u003cinput class=\"hp\" type=\"text\" name=\"company\" id=\"hp\" tabindex=\"-1\" autocomplete=\"off\" aria-hidden=\"true\">';\n  h += '\u003cdiv class=\"err\" id=\"err\">Add a valid email address so they can reach you.\u003c/div>';\n  h += '\u003cbutton class=\"btn ghost\" type=\"button\" data-act=\"contact\">Send my estimate\u003c/button>';\n  if (CFG.lead_capture.consent_text) h += '\u003cdiv class=\"fine\">'+esc(CFG.lead_capture.consent_text)+'\u003c/div>';\n  return h;\n}\n\n/* ------------------------------------------------------------------ *\n * Interaction\n * ------------------------------------------------------------------ */\nfunction showErr(msg){\n  var e = root.querySelector('#err');\n  if (!e) return;\n  if (msg) e.textContent = msg;\n  e.classList.add('on');\n}\n\nroot.addEventListener('click', onClick);\n\nfunction wire(step){\n  var inputs = root.querySelectorAll('.inp');\n  for (var i=0;i\u003cinputs.length;i++){\n    inputs[i].addEventListener('input', onInput);\n    inputs[i].addEventListener('keydown', function(ev){\n      if (ev.key === 'Enter'){\n        ev.preventDefault();\n        var b = root.querySelector('.btn:not([disabled])');\n        if (b && b.tagName === 'BUTTON') b.click();\n      }\n    });\n  }\n}\n\nfunction onInput(ev){\n  var id = ev.target.id || '';\n  if (id.indexOf('f-') === 0) contact[id.slice(2)] = ev.target.value;\n  var e = root.querySelector('#err');\n  if (e) e.classList.remove('on');\n}\n\nfunction onClick(ev){\n  var t = ev.target;\n  while (t && t !== root && !t.getAttribute('data-act')) t = t.parentNode;\n  if (!t || t === root) return;\n  var act = t.getAttribute('data-act');\n\n  if (act === 'back'){ stepIndex--; render(); return; }\n\n  if (act === 'restart'){\n    answers = { services: [], q: {} };\n    contact = { name:'', email:'', phone:'' };\n    sendState = ''; stepIndex = 0; render(); return;\n  }\n\n  if (act === 'svc'){\n    var key = t.getAttribute('data-key');\n    var at = answers.services.indexOf(key);\n    if (CFG.allow_multiple_services === false){\n      answers.services = [key];\n      render();\n      setTimeout(function(){ stepIndex = 1; render(); }, 130);\n      return;\n    }\n    if (at === -1) answers.services.push(key); else answers.services.splice(at,1);\n    dropStaleAnswers();\n    render(); return;\n  }\n\n  if (act === 'opt'){\n    var qk = t.getAttribute('data-q');\n    var ix = parseInt(t.getAttribute('data-i'),10);\n    var q = findQuestion(qk);\n    if (!q) return;\n    if (q.type === 'multi'){\n      var arr = answers.q[qk] || [];\n      var pos = arr.indexOf(ix);\n      if (pos === -1) arr.push(ix); else arr.splice(pos,1);\n      answers.q[qk] = arr;\n      render(); return;\n    }\n    answers.q[qk] = ix;\n    render();\n    setTimeout(function(){ stepIndex++; render(); }, 130);\n    return;\n  }\n\n  if (act === 'numnext'){\n    var el = root.querySelector('#numin');\n    var q2 = currentSteps()[stepIndex].q;\n    var v = el ? parseFloat(el.value) : NaN;\n    if (!isFinite(v) || v \u003c q2.min || v > q2.max){ showErr(); return; }\n    answers.q[q2.key] = v;\n    stepIndex++; render(); return;\n  }\n\n  if (act === 'next'){\n    var st = currentSteps()[stepIndex];\n    if (st.kind === 'services' && !answers.services.length){ showErr(); return; }\n    if (st.kind === 'question' && st.q.type === 'multi'){\n      var a = answers.q[st.q.key];\n      if (!a || !a.length){ showErr(); return; }\n    }\n    stepIndex++; render(); return;\n  }\n\n  if (act === 'contact'){\n    var hp = root.querySelector('#hp');\n    if (hp && hp.value) botFlag = true;\n    if ((Date.now() - LOADED_AT) / 1000 \u003c MIN_SECONDS) botFlag = true;\n    var email = (contact.email || '').trim();\n    if (!/^[^\\s@]+@[^\\s@]+\\.[a-zA-Z]{2,}$/.test(email)){ showErr('Add a valid email address so they can reach you.'); return; }\n    t.setAttribute('disabled','disabled');\n    sendState = 'sending';\n    send().then(function(st){\n      sendState = (st === 'none') ? '' : st;\n      var box = root.querySelector('#postcontact');\n      if (box) { box.innerHTML = sendState ? statusHtml(sendState) : ''; postHeight(); }\n    });\n    if (CFG.toggles.contact_before_result){ stepIndex++; render(); }\n    else {\n      var pc = root.querySelector('#postcontact');\n      if (pc) pc.innerHTML = statusHtml('sending');\n      postHeight();\n    }\n    return;\n  }\n}\n\nfunction findQuestion(key){\n  for (var i=0;i\u003cCFG.questions.length;i++) if (CFG.questions[i].key === key) return CFG.questions[i];\n  return null;\n}\n\n/* Drop answers to questions that no longer apply after a service change. */\nfunction dropStaleAnswers(){\n  var live = {};\n  var qs = EFK.applicableQuestions(CFG, answers.services);\n  for (var i=0;i\u003cqs.length;i++) live[qs[i].key] = 1;\n  for (var k in answers.q) if (Object.prototype.hasOwnProperty.call(answers.q,k) && !live[k]) delete answers.q[k];\n}\n\n/* ------------------------------------------------------------------ *\n * Send. Never blocks the result.\n * ------------------------------------------------------------------ */\n/* Resolves to 'sent', 'failed', 'unknown' (no answer in 15 seconds) or 'none'.\n * The engine does the sending (EFK.sendLead), so the rules live in one place:\n * a webhook is posted no-cors, the email relay must answer success, and when the\n * CRM webhook fails or times out with a backup email key set, the lead is emailed\n * to the owner with an ALERT line first. Only a real delivery comes back 'sent'. */\nfunction send(){\n  if (mode() === 'none') return Promise.resolve('none');\n  if (botFlag) return Promise.resolve('sent');\n  try {\n    var meta = {\n      /* never the #fragment: on a live link that is the whole settings block */\n      page_url: (function(){ try { return location.href.split('#')[0].slice(0,400); } catch(e){ return ''; } })(),\n      utm_source: UTM.utm_source, utm_medium: UTM.utm_medium, utm_campaign: UTM.utm_campaign,\n      submitted_at: new Date().toISOString()\n    };\n    var f = (typeof fetch === 'function') ? fetch.bind(window) : null;\n    return EFK.sendLead(CFG, answers, contact, meta, { fetch: f })\n      .then(function(r){ return (r && r.state) || 'failed'; }, function(){ return 'failed'; });\n  } catch(e){ return Promise.resolve('failed'); }\n}\n\n/* ------------------------------------------------------------------ *\n * Tell the parent page how tall we are (HighLevel iframe auto-height)\n * ------------------------------------------------------------------ */\nvar lastH = 0;\nfunction postHeight(){\n  try {\n    var h = Math.max(\n      document.body.scrollHeight, document.documentElement.scrollHeight,\n      document.body.offsetHeight, document.documentElement.offsetHeight\n    );\n    if (Math.abs(h - lastH) \u003c 4) return;\n    sendHeight(h);\n  } catch(e){}\n}\nfunction sendHeight(h){\n  lastH = h;\n  if (window.parent && window.parent !== window){\n    /* the named shape from CONFIG-CONTRACT P1 */\n    window.parent.postMessage({ efk:'height', value:h }, '*');\n    /* older snippets listened for this one, so both go out */\n    window.parent.postMessage({ type:'efk-height', height:h, id:'estimate-funnel' }, '*');\n  }\n}\n/* Height watching is event driven on purpose. A repeating timer would keep the\n * page busy forever, which breaks screenshot tools and wastes battery. */\ntry {\n  if (typeof ResizeObserver === 'function'){\n    new ResizeObserver(postHeight).observe(document.documentElement);\n  } else {\n    var ticks = 0;\n    var iv = setInterval(function(){ postHeight(); if (++ticks > 20) clearInterval(iv); }, 500);\n  }\n} catch(e){}\nwindow.addEventListener('resize', postHeight);\nwindow.addEventListener('load', postHeight);\n/* the parent can ask at any time */\nwindow.addEventListener('message', function(ev){\n  try {\n    var d = ev.data;\n    if (d && d.efk === 'height?'){\n      lastH = 0;\n      postHeight();\n    }\n  } catch(e){}\n});\n\n/* ------------------------------------------------------------------ *\n * Self test: walks the whole funnel with no human. Read with --dump-dom.\n * ------------------------------------------------------------------ */\nfunction selftest(){\n  var log = [], fails = 0;\n  function check(name, cond, extra){\n    if (cond) log.push('PASS ' + name);\n    else { log.push('FAIL ' + name + (extra ? ' :: ' + extra : '')); fails++; }\n  }\n  try {\n    check('config ok', DX.ok, DX.errors.join(' | '));\n    check('services present', CFG.services.length > 0);\n\n    /* pick the first service */\n    var svcBtn = root.querySelector('[data-act=\"svc\"]');\n    check('service picker rendered', !!svcBtn);\n    if (svcBtn) svcBtn.click();\n    check('service selected', answers.services.length > 0);\n\n    var next = root.querySelector('[data-act=\"next\"]');\n    if (next && !next.disabled) next.click();\n\n    /* answer every question screen */\n    var guard = 0;\n    while (guard++ \u003c 40){\n      var steps = currentSteps();\n      var st = steps[stepIndex];\n      if (!st || st.kind === 'result' || st.kind === 'contact') break;\n      if (st.kind === 'question'){\n        if (st.q.type === 'number'){\n          var ni = root.querySelector('#numin');\n          if (ni) ni.value = st.q.min;\n          var nb = root.querySelector('[data-act=\"numnext\"]');\n          if (nb) nb.click(); else { stepIndex++; render(); }\n        } else {\n          var o = root.querySelector('[data-act=\"opt\"]');\n          if (o) { answers.q[st.q.key] = st.q.type === 'multi' ? [0] : 0; stepIndex++; render(); }\n          else { stepIndex++; render(); }\n        }\n      } else { stepIndex++; render(); }\n    }\n    check('walked past the questions in under 40 steps', guard \u003c 40);\n\n    /* contact step if it comes first */\n    var stepsNow = currentSteps();\n    if (stepsNow[stepIndex] && stepsNow[stepIndex].kind === 'contact'){\n      contact.email = 'selftest@example.com';\n      var em = root.querySelector('#f-email');\n      if (em) em.value = contact.email;\n      LOADED_AT = Date.now() - 99999;\n      var cb = root.querySelector('[data-act=\"contact\"]');\n      check('contact button present', !!cb);\n      if (cb) cb.click();\n    }\n\n    /* force the result view */\n    var s2 = currentSteps();\n    stepIndex = s2.length - 1;\n    render();\n\n    var num = root.querySelector('.res-num');\n    check('result screen shows a number', !!num && /\\d/.test(num.textContent), num ? num.textContent : 'no .res-num');\n\n    var est = EFK.estimate(CFG, answers);\n    check('low is not above high', est.lo \u003c= est.hi, est.lo + ' > ' + est.hi);\n    check('numbers are real numbers', isFinite(est.lo) && isFinite(est.hi));\n\n    var cta = root.querySelector('[data-act=\"cta\"]');\n    check('one booking button on the result', !!cta || !CFG.business.booking_url);\n    if (cta) check('booking link is https', /^https:\\/\\//.test(cta.getAttribute('href')), cta.getAttribute('href'));\n\n    var ctaCount = root.querySelectorAll('.btn[href]').length;\n    check('exactly one outbound call to action', ctaCount \u003c= 1, 'found ' + ctaCount);\n\n    var payload = EFK.payload(CFG, answers, { name:'T', email:'t@example.com', phone:'' }, {});\n    var wantKeys = ['name','email','phone','business_name','niche','services_text','estimate_low','estimate_high','estimate_unit','currency','timeline_text','answers_text','knobs_text','page_url','utm_source','utm_medium','utm_campaign','submitted_at','kit_version','summary_text','estimate_low_text','estimate_high_text','possibly_fake','fake_reasons','watch_match'];\n    var got = Object.keys(payload).sort().join(',');\n    check('webhook payload keys are the fixed set', got === wantKeys.slice().sort().join(','), got);\n\n    check('no external requests in this file', document.querySelectorAll('link[href^=\"http\"], script[src], img[src^=\"http:\"]').length === 0);\n\n    /* v1.1 honesty: with nowhere to send, no contact form and no \"sent\" anywhere */\n    var saved = CFG.lead_capture;\n    CFG.lead_capture = JSON.parse(JSON.stringify(saved));\n    CFG.lead_capture.destination = 'none'; CFG.lead_capture.webhook_url = ''; CFG.lead_capture.email_key = '';\n    sendState = ''; render();\n    check('nowhere mode shows no contact form', !root.querySelector('[data-act=\"contact\"]'));\n    check('nowhere mode never says sent', !/\\bsent\\b/i.test(root.querySelector('.card').textContent), root.querySelector('.card').textContent.slice(0,200));\n    check('nowhere mode says nothing is sent', /Nothing is sent anywhere/.test(root.textContent));\n    CFG.lead_capture.destination = 'webhook'; CFG.lead_capture.webhook_url = 'https://hooks.selftest.co/in';\n    render();\n    check('webhook mode offers to send the estimate', !!root.querySelector('[data-act=\"contact\"]'));\n    sendState = 'failed'; render();\n    check('a failed send is never called sent', !/Sent to/.test(root.textContent) && /could not send/i.test(root.textContent));\n    sendState = 'sent'; render();\n    check('a real send says sent', /Sent to/.test(root.textContent));\n    CFG.lead_capture = saved; sendState = ''; render();\n    check('the live footer shows only on a live link', RUNNER ? !!root.querySelector('.kitfoot') : !root.querySelector('.kitfoot'));\n    if (RUNNER) check('the live footer has the report link', /Report this page/.test(root.textContent));\n  } catch(err){\n    log.push('FAIL selftest crashed :: ' + (err && err.message ? err.message : String(err)));\n    fails++;\n  }\n  var box = document.getElementById('selftest');\n  box.className = '';\n  box.setAttribute('style','position:fixed;left:0;bottom:0;right:0;z-index:99999;background:#111827;color:#d1fae5;font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px;max-height:44vh;overflow:auto;clip:auto');\n  /* built with text nodes, because a log line can carry text from the settings */\n  box.textContent = '';\n  var vb = document.createElement('b');\n  vb.id = 'selftest-verdict';\n  vb.textContent = fails === 0 ? 'SELFTEST RESULT: ALL PASS' : 'SELFTEST RESULT: ' + fails + ' FAIL';\n  box.appendChild(vb);\n  for (var li2=0; li2\u003clog.length; li2++){ box.appendChild(document.createElement('br')); box.appendChild(document.createTextNode(log[li2])); }\n}\n\n/* go */\nfunction start(){\n  applyBrand();\n  if (PREVIEW_RESULT){\n    /* Jump straight to a finished result. Used for screenshots and for the\n     * Studio's live preview, never by a real visitor. Nothing is marked as sent. */\n    try {\n      var samp = EFK.sampleLeads(CFG);\n      answers = samp[1] ? samp[1].answers : answers;\n      stepIndex = currentSteps().length - 1;\n    } catch(e){}\n  }\n  render();\n  if (SELFTEST) setTimeout(selftest, 60);\n}\n\nif (RUNNER){\n  var frag = '';\n  try { frag = location.hash || ''; } catch(e){}\n  try { window.addEventListener('hashchange', function(){ location.reload(); }); } catch(e){}\n  EFK.decodeLink(frag).then(function(r){\n    if (!r || !r.ok){ broken(); return; }\n    DX = { ok:true, errors:[], config:r.config };\n    CFG = r.config;\n    start();\n  }, broken);\n} else {\n  DX = EFK.doctor(RAW);\n  /* The untouched template has no settings, so a visitor gets the setup message.\n   * Opened with ?selftest=1 it tests itself against a small built-in sample instead. */\n  if (!DX.ok && SELFTEST && !/\"services\"/.test(RAW)) {\n    DX = EFK.doctor({ business: { name: 'Selftest Plumbing', booking_url: 'https://cal.selftest-plumbing.co/book' },\n      services: [{ key: 'fix', label: 'Fix a leak', lo: 150, hi: 450, example_data: false }, { key: 'heater', label: 'New water heater', lo: 1400, hi: 3200, example_data: false }],\n      questions: [{ key: 'urgency', label: 'How soon do you need this?', role: 'urgency', options: [\n        { label: 'Today', effect: { type: 'multiply', value: 1.25 } }, { label: 'This week', effect: { type: 'none', value: 0 } }, { label: 'Not sure', effect: { type: 'widen', value: 0.1 } }] }] });\n  }\n  CFG = DX.config;\n  if (!DX.ok) { panic('This estimate page is not set up yet.', DX.errors); return; }\n  start();\n}\n\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";
var BUILDER_PROMPT_FILE = "# THE ESTIMATE FUNNEL BUILDER (Smarter Flow Estimate Funnel Kit v1.2)\n\n**How to use this file:** copy everything below the line into any AI chat (Claude, ChatGPT, Gemini, Meta AI, Copilot, a local model) and send it. Answer what it asks. At the end it gives you one block of JSON. Copy that JSON into the Studio (`studio.html`), on tab 1 \"Niche\", into the box under \"Paste your AI answer here\", then press \"Check it\". The Studio checks it, repairs it, and shows you what changed.\n\n---\n\nYou are the ESTIMATE FUNNEL BUILDER by Smarter Flow.\nYour only job: interview one business owner and output ONE JSON config for an instant estimate funnel.\nYou never do math, never write code, never invent a price or a link. The kit's engine does all the math.\n\nCURRENT CONFIG (may be empty or say \"none\"):\n{{CURRENT_CONFIG}}\n\nPRESET NICHE (may be empty): {{NICHE}}\n\n## STEP 0. CONTEXT FIRST (always do this before any question)\n\nSend exactly this, then stop and wait:\n\n> Before I ask you anything, paste or attach anything you already have about your business. Any of these help: your website text or URL, a price list, 2 or 3 past quotes or invoices, emails where you quoted a customer, a knowledge base export, a services page. More context means fewer questions.\n>\n> Type **skip** if you have nothing handy. We will use example numbers you can edit later.\n\nIf you have connected tools (web browsing, file search, email, drive, project knowledge), add ONE line: \"I can also check [name the tool] myself. Say yes and tell me what to look for.\" Only look after a yes, read only, never send anything anywhere, and never put a customer's name, address, phone or email into the config.\n\nWhen they paste context: read it, then say in 3 short lines what you found (services, prices or hours, how fast they start). Ask them to correct anything wrong. Then go to Step 1 and SKIP any question the context already answered.\n\n**Exception, and it beats everything above:** if their very first message already tells you to take the defaults, to accept everything, or to just give them the JSON, do not send the context request and do not interview. Go straight to the output, using their context if they gave any and the preset defaults for the rest.\n\n## STEP 1. THE INTERVIEW (max 7 questions, ONE per message)\n\n**FAST PATH, check this first.** If the user has already told you to take the defaults, to accept everything, to just give them the JSON, or answers \"ok\" to everything in one message, then DO NOT ASK ANY QUESTIONS. Use the default answer for every question below, fill in anything their context already told you, and output the JSON in that same message. Skipping the interview is allowed and expected. Asking anyway, after they told you not to, is the failure.\n\nOtherwise, ask one question per message, numbered \"Question 3 of 7\". Every question carries a default in brackets. Tell them once, at Question 1: **\"Type ok to accept the default, or just type your answer.\"** Fragments are fine. Never ask a question their context already answered. Never ask more than 7.\n\n1. **What kind of business is this?** [default: {{NICHE}}, or \"generic service business\" if that is empty]\n2. **Business name, and the currency you quote in?** [default: leave the name blank and use USD]\n3. **Your top 3 to 6 services or job types, with a low and a high for each.** Price or hours, their choice. [default: keep the preset example numbers and mark them as examples]\n4. **What makes a job cost more?** Size, access, age of equipment, urgency, add-ons. [default: size and urgency]\n5. **How fast do you usually start, and how long does a typical job take?** [default: start in 2 to 5 days, most jobs done in 1 to 3 days]\n6. **Your booking link** (calendar, booking page, contact page). [default: leave it empty, they add it in the Studio]\n7. **Show a price range, hours, or both?** [default: price]\n\nAfter Question 7, output the JSON. Nothing else to ask.\n\n## HARD RULES (these are what make the funnel trustworthy)\n\n- **Never invent a price or an hour figure.** If the owner gives none for a service, keep the preset example numbers and leave `\"example_data\": true` on that service. The Studio will not let them publish until they confirm or edit every example number.\n- **Never invent a URL, a phone number, an address, a review count or a claim.** Unknown means `\"\"`. An invented booking link is worse than no booking link.\n- **`booking_url` is `\"\"` unless the owner pasted a real link in this chat.** Any link already in CURRENT CONFIG is a placeholder: never keep it.\n- **A price range from the owner's notes counts as theirs.** Set `\"example_data\": false` on every service whose range came from what they pasted or said.\n- **Keep `business.name` from CURRENT CONFIG** unless the owner gives a different one.\n- **No single answer multiplies a price by more than 1.3** unless the owner's notes justify it.\n- **No guarantees anywhere.** The result is an estimate, not a quote. Never write \"guaranteed\", \"exact price\", \"final price\", \"we promise\".\n- **Ranges only.** `lo` is always less than or equal to `hi`, and both are greater than 0.\n- **One JSON object, in one code block, and nothing after it.** No explanation after the code block. No comments inside the JSON.\n- Plain English everywhere. No em dashes. Write \"Smarter Flow\" as two words.\n\n## THE SCHEMA (compact; fill every key)\n\n```\nkit_version \"1.2\"\nbusiness { name, niche, tagline, currency, currency_symbol,\n           unit (\"price\"|\"hours\"|\"both\"), hourly_rate (number or null),\n           booking_url, logo_url, brand_color (\"#1d4ed8\"), phone, service_area }\nservices [ { key (lowercase_snake), label, lo (number), hi (number),\n             days_lo, days_hi, help, example_data (true|false) } ]\nallow_multiple_services  true|false\nquestions [ { key (lowercase_snake), label, type (\"single\"|\"multi\"|\"number\"),\n              role (optional, \"urgency\" on the rush question),\n              applies_to [service keys, or omit for all],\n              options [ { label, effect { type, value } } ] } ]\n        effect.type: \"multiply\" (value 0.5 to 3.0) | \"add\" (flat money or hours)\n                   | \"widen\" (value 0 to 0.5, use this for \"not sure\" answers)\n                   | \"none\"\nknobs { range_width, price_level, safety_buffer, rush_premium, rounding, detail_shown }\n        all 0 to 100, start at 50 / 50 / 30 / 50 / 60 / 50\ntoggles { contact_before_result (false), show_timeline (true), show_drivers (true), timeline_style (\"about\") }\ncalibration { per_service {}, last_trained null, rounds 0 }\nlead_capture { webhook_url \"\", fields [\"name\",\"email\",\"phone\"], consent_text \"By submitting you agree we may text or email you about this estimate. Reply STOP to end texts.\", watch_list [] }\nresult_copy { headline, disclaimer, cta_label }\n```\n\nEvery service needs at least one question that applies to it. Give every list of options a \"Not sure\" choice with a `widen` effect, because \"not sure\" is a real answer and widening the range is the honest way to handle it.\n\n## WORKED EXAMPLE (HVAC, what good looks like)\n\n```json\n{\n  \"kit_version\": \"1.2\",\n  \"business\": {\n    \"name\": \"Northlake Heating & Air\", \"niche\": \"hvac\",\n    \"tagline\": \"Get a real price range in 60 seconds\",\n    \"currency\": \"USD\", \"currency_symbol\": \"$\", \"unit\": \"price\", \"hourly_rate\": null,\n    \"booking_url\": \"\", \"logo_url\": \"\", \"brand_color\": \"#1d4ed8\",\n    \"phone\": \"\", \"service_area\": \"\"\n  },\n  \"services\": [\n    { \"key\": \"ac_repair\", \"label\": \"AC repair\", \"lo\": 150, \"hi\": 650,\n      \"days_lo\": 1, \"days_hi\": 2, \"help\": \"Most repairs are same or next day\",\n      \"example_data\": false },\n    { \"key\": \"ac_install\", \"label\": \"New AC system\", \"lo\": 4200, \"hi\": 9800,\n      \"days_lo\": 3, \"days_hi\": 10, \"help\": \"Includes removal of the old unit\",\n      \"example_data\": false },\n    { \"key\": \"duct_cleaning\", \"label\": \"Duct cleaning\", \"lo\": 300, \"hi\": 600,\n      \"days_lo\": 1, \"days_hi\": 1, \"help\": \"One visit\", \"example_data\": false }\n  ],\n  \"allow_multiple_services\": true,\n  \"questions\": [\n    { \"key\": \"home_size\", \"label\": \"How big is your home?\", \"type\": \"single\",\n      \"applies_to\": [\"ac_install\"],\n      \"options\": [\n        { \"label\": \"Under 1,500 sq ft\", \"effect\": { \"type\": \"multiply\", \"value\": 0.9 } },\n        { \"label\": \"1,500 to 2,500 sq ft\", \"effect\": { \"type\": \"multiply\", \"value\": 1.0 } },\n        { \"label\": \"Over 2,500 sq ft\", \"effect\": { \"type\": \"multiply\", \"value\": 1.25 } },\n        { \"label\": \"Not sure\", \"effect\": { \"type\": \"widen\", \"value\": 0.1 } }\n      ] },\n    { \"key\": \"urgency\", \"label\": \"How soon do you need this?\", \"type\": \"single\",\n      \"role\": \"urgency\",\n      \"options\": [\n        { \"label\": \"Today or tomorrow\", \"effect\": { \"type\": \"multiply\", \"value\": 1.2 } },\n        { \"label\": \"This week\", \"effect\": { \"type\": \"multiply\", \"value\": 1.05 } },\n        { \"label\": \"Whenever works\", \"effect\": { \"type\": \"none\", \"value\": 0 } }\n      ] },\n    { \"key\": \"access\", \"label\": \"Where is the unit?\", \"type\": \"single\",\n      \"options\": [\n        { \"label\": \"Easy ground level access\", \"effect\": { \"type\": \"none\", \"value\": 0 } },\n        { \"label\": \"Attic, crawlspace or roof\", \"effect\": { \"type\": \"add\", \"value\": 150 } },\n        { \"label\": \"Not sure\", \"effect\": { \"type\": \"widen\", \"value\": 0.1 } }\n      ] }\n  ],\n  \"knobs\": { \"range_width\": 50, \"price_level\": 50, \"safety_buffer\": 30,\n             \"rush_premium\": 50, \"rounding\": 60, \"detail_shown\": 50 },\n  \"toggles\": { \"contact_before_result\": false, \"show_timeline\": true, \"show_drivers\": true, \"timeline_style\": \"about\" },\n  \"calibration\": { \"per_service\": {}, \"last_trained\": null, \"rounds\": 0 },\n  \"lead_capture\": { \"webhook_url\": \"\", \"fields\": [\"name\", \"email\", \"phone\"], \"consent_text\": \"By submitting you agree we may text or email you about this estimate. Reply STOP to end texts.\", \"watch_list\": [] },\n  \"result_copy\": {\n    \"headline\": \"Your estimated range\",\n    \"disclaimer\": \"This is an estimate, not a final quote. Your exact price depends on the details, which we go through with you before any work starts.\",\n    \"cta_label\": \"Book your free call\"\n  }\n}\n```\n\n## THE 8 MISTAKES TO AVOID\n\n1. Using `multiply` where a flat charge belongs. A call-out fee, a permit or a trip charge is `add`. A size or difficulty factor is `multiply`.\n2. A `multiply` value outside 0.5 to 3.0. Keep most of them at 1.5 or below: several big multipliers stacking on one job produces a scary number.\n3. `lo` higher than `hi`, or a `lo` of 0. Both must be above 0, and `lo` must be at most `hi`.\n4. Keys that are not lowercase_snake. `ac_repair` is right. `AC Repair`, `ac-repair` and `acRepair` are wrong.\n5. Putting the effect on the question instead of on each option. Every option carries its own `effect`.\n6. Comments, trailing commas, smart quotes or single quotes inside the JSON. Plain JSON only.\n7. Inventing a booking URL, a logo URL or a price the owner never gave you.\n8. Writing anything after the code block. The code block is the last thing in your message.\n\n## FINAL SELF-CHECK (run this silently before you answer)\n\n- [ ] One JSON object, one code block, nothing after it, and it parses.\n- [ ] Every key from the schema is present, including empty ones.\n- [ ] Every service: lowercase_snake key, `lo` > 0, `lo` \u003c= `hi`, has `days_lo` and `days_hi`, and is covered by at least one question.\n- [ ] Any number the owner did not give me carries `\"example_data\": true`.\n- [ ] Every `multiply` value sits between 0.5 and 3.0. Every `widen` value sits between 0 and 0.5.\n- [ ] No invented URL, phone, address or claim. Unknown fields are `\"\"`. `booking_url` is `\"\"` unless the owner gave me one.\n- [ ] No guarantee wording anywhere, and the disclaimer says this is an estimate, not a final quote.\n- [ ] `unit` matches what they asked for, and `hourly_rate` is filled only when `unit` is `\"both\"`.\n\n## REVISE MODE\n\nIf the user pastes an existing config plus a plain-English change (\"add a duct cleaning service 300 to 600\", \"make my ranges tighter\", \"drop the pest control service\", \"switch me to hours\"), do not interview them again. Apply the change and return the FULL updated config in one code block, nothing after it. Rules:\n\n- Keep everything they did not ask you to change, including knobs, calibration and their webhook URL.\n- \"Tighter\" or \"wider\" ranges is the `range_width` knob, not the service numbers. Tighter is lower, wider is higher, move it 15 to 25 points. \"Cheaper\" or \"more premium\" is `price_level`. \"More padding on the high end\" is `safety_buffer`.\n- A new service gets a new lowercase_snake key, `\"example_data\": false` when they gave you the numbers, and at least one question that applies to it.\n- Say nothing after the code block. The Studio shows them the diff.\n";

function copyText(text, btn, okLabel){
  var done = function(ok){
    if (!btn) return;
    var old = btn.textContent;
    btn.textContent = ok ? (okLabel || 'Copied') : 'Press Ctrl+C now';
    setTimeout(function(){ btn.textContent = old; }, 1800);
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallback(); });
      return;
    }
  } catch(e){}
  fallback();
  function fallback(){
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      done(ok);
    } catch(e){ done(false); }
  }
}

function downloadFile(name, text, mime){
  try {
    var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
    return true;
  } catch(e){ return false; }
}

    var note = $('#sample-note');

function animateSample(i, v){
  var el = document.getElementById('sv-'+i);
  var ghost = document.getElementById('sg-'+i);
  var card = document.getElementById('samp-'+i);
  if (!el) return;
  var prev = sampleState[i] || { lo: v.lo, hi: v.hi };
  if (prev.lo === v.lo && prev.hi === v.hi){ return; }

  if (knobBaseline && ghost){
    var base = knobBaseline[i];
    if (base && (base.lo !== v.lo || base.hi !== v.hi)){
      ghost.innerHTML = 'was <b>' + esc(fmtRange({ unit:v.unit, lo:base.lo, hi:base.hi })) + '</b>';
    } else if (ghost) ghost.innerHTML = '';
  }

  if (sampleAnim[i]) { cancelAnimationFrame(sampleAnim[i]); sampleAnim[i] = null; }
  var start = performance.now(), dur = 280;
  var fromLo = prev.lo, fromHi = prev.hi;
  function tick(now){
    var t = Math.min(1, (now - start) / dur);
    var e = 1 - Math.pow(1 - t, 3);
    var lo = fromLo + (v.lo - fromLo) * e;
    var hi = fromHi + (v.hi - fromHi) * e;
    el.textContent = fmtRange({ unit: v.unit, lo: lo, hi: hi });
    if (t < 1) sampleAnim[i] = requestAnimationFrame(tick);
    else { el.textContent = fmtRange(v); sampleAnim[i] = null; }
  }
  sampleAnim[i] = requestAnimationFrame(tick);
  sampleState[i] = { lo: v.lo, hi: v.hi };
  if (card){ card.classList.remove('pulse'); void card.offsetWidth; card.classList.add('pulse'); }
}

function sampleFingerprint(){
  var v = sampleValues(), out = [];
  for (var i=0;i<v.length;i++) out.push(fmtRange(v[i]));
  return out.join('|');
}
function sanityOk(){ return !!sanityPrint && sanityPrint === sampleFingerprint(); }

function checklist(){
  var ex = exampleCount();
  var dest = destination();
  var ready = dest !== 'none' && EFK.leadMode(cfg) === dest;
  var leadsRow = dest === 'none'
    ? { id:'leads', done:false, required:false, amber:true,
        title:'Where leads go: nowhere yet',
        why:'Your choice. Visitors see their price and your booking button, and nobody receives their details.' }
    : { id:'leads', done: ready && leadVerifiedOk(), required:true,
        title:'A test lead arrived',
        why: !ready ? (dest === 'webhook' ? 'Paste your webhook link under "Where should leads go?".' : 'Paste your access key under "Where should leads go?".')
          : (leadVerifiedOk() ? 'You confirmed a test lead arrived.' : 'Send a test lead below, then tell us whether it arrived.') };
  return [
    { id:'prices', done: ex === 0, required:true,
      title:'Your prices are your own',
      why: ex === 0 ? 'All ' + cfg.services.length + ' rows confirmed.' : ex + ' row(s) still say EXAMPLE. Open the Prices tab.' },
    { id:'booking', done: !!cfg.business.booking_url && bookingTested && !EFK.isPlaceholderUrl(cfg.business.booking_url), required:true,
      title:'Your booking link works',
      why: !cfg.business.booking_url ? 'No link yet. Open the Your business tab and paste it in.'
        : (EFK.isPlaceholderUrl(cfg.business.booking_url) ? 'That is still the example link. Paste your own booking link on the Your business tab.'
        : (bookingTested ? 'Tested and opened in a new tab.' : 'Press "Test this link" on the Your business tab.')) },
    { id:'name', done: !!cfg.business.name && cfg.business.name !== 'Your business', required:true,
      title:'Your business name is set',
      why: (cfg.business.name && cfg.business.name !== 'Your business') ? cfg.business.name : 'Still says "Your business".' },
    { id:'sanity', done: sanityOk(), required:true,
      title:'The three sample estimates look right',
      why: sanityOk() ? 'You checked them.' : (sanityPrint ? 'Your numbers changed since you checked. Look at them again below.' : 'Look at the three sample estimates below and tick the box.') },
    leadsRow
  ];
}

function gateOpen(){
  var list = checklist();
  for (var i=0;i<list.length;i++) if (list[i].required && !list[i].done) return false;
  return true;
}

/* THE canonical embed snippet. This is byte for byte the same block that
 * highlevel/INSTALL.md Part 2 ships, and test.mjs compares the two. If you
 * change one, change the other, or the test fails. */
function embedCode(){
  return [
    '<div id="efk-wrap" style="max-width:720px;margin:0 auto;">',
    '  <iframe',
    '    id="efk-frame"',
    '    src="YOUR-FUNNEL-URL"',
    '    title="Instant estimate"',
    '    style="width:100%;border:0;display:block;min-height:640px;"',
    '    loading="lazy"',
    '    scrolling="no"></iframe>',
    '</div>',
    '<script>',
    '(function () {',
    '  var f = document.getElementById(\'efk-frame\');',
    '  // pass utm_ values on this page\'s link (for example utm_source=booked) to the funnel',
    '  try {',
    '    var u = new URL(f.getAttribute(\'src\'), location.href), n = 0;',
    '    new URLSearchParams(location.search).forEach(function (v, k) {',
    '      if (/^utm_/.test(k)) { u.searchParams.set(k, v); n++; }',
    '    });',
    '    if (n) f.src = u.toString();',
    '  } catch (err) {}',
    '  window.addEventListener(\'message\', function (e) {',
    '    var d = e.data;',
    '    if (!d || d.efk !== \'height\') return;',
    '    if (f.contentWindow && e.source !== f.contentWindow) return;',
    '    var h = parseInt(d.value, 10);',
    '    if (h > 200 && h < 20000) f.style.height = h + \'px\';',
    '  });',
    '  // ask once in case the funnel loaded before this script did',
    '  f.addEventListener(\'load\', function () {',
    '    try { f.contentWindow.postMessage({ efk: \'height?\' }, \'*\'); } catch (err) {}',
    '  });',
    '})();',
    '<\/script>'
  ].join('\n');
}

    + '</div>'
    + '<div class="tiny" style="margin-top:10px">funnel.html is one single file. It needs nothing else, no internet connection to load, and no account anywhere.</div>'
    + '<h3>How to put it on HighLevel</h3>'
    + '<ol style="font-size:14.5px;color:var(--ink2);padding-left:20px;margin:0 0 12px">'
    + '<li>Download funnel.html above.</li>'
    + '<li>Upload it anywhere that gives you a link (your own website, any file host, or a HighLevel hosted file).</li>'
    + '<li>In your HighLevel funnel page, add a <b>Custom Code / HTML</b> element.</li>'
    + '<li>Paste the embed code below into it, then replace <b>YOUR-FUNNEL-URL</b> with your own link. Keep the quotes around it.</li>'

    + '</div>';

/* v1.2: a calibration nudge when no Train calibration is recorded, or none in 90 days (v1.2.1 wording) */
function staleDays(){
  var lt = cfg.calibration && cfg.calibration.last_trained;
  if (!lt) return -1;
  var t = Date.parse(String(lt).slice(0, 10) + 'T00:00:00Z');
  if (!isFinite(t)) return -1;
  return Math.max(0, Math.floor((Date.now() - t) / 86400000));
}
function staleHtml(){
  var d = staleDays();
  if (d !== -1 && d <= 90) return '';
  var msg = d === -1
    ? 'No Train calibration recorded yet.'
    : 'Last Train calibration recorded ' + d + ' days ago.';
  return '<div class="note warn" id="stale-note"><b>' + msg + '</b> Say "check my funnel" to Claude or open Train.</div>';
}

function leadTestHtml(){
  var t = leadTest;
  if (!t || t.dest !== destination()) return '';
  var h = '';
  if (t.status === 'sending') return '<div class="note info">Sending a test lead named Test Submission...</div>';
  if (t.status === 'went') h += '<div class="note info"><b>Test sent.</b> A browser is not allowed to see the answer from most CRMs, so this does not prove it arrived. Look in your tool for a lead named Test Submission (in HighLevel: the workflow\'s history, or the trigger\'s sample).</div>';
  else if (t.status === 'crmaccepted') h += '<div class="note info"><b>HighLevel accepted the test.</b> That proves the link works, not that your workflow is set up. Look for a lead named Test Submission in the workflow\'s history, or the trigger\'s sample.</div>';
  else if (t.status === 'crmrejected') h += '<div class="note bad"><b>HighLevel turned it down:</b> '+esc(t.detail || 'no reason given')+' Copy the webhook link again from the Inbound Webhook trigger and paste it over the old one.</div>';
  else if (t.status === 'accepted') h += '<div class="note info"><b>Web3Forms accepted the test.</b> Now look in the inbox you gave them, and in the spam folder, for a lead named Test Submission.</div>';
  else if (t.status === 'rejected') h += '<div class="note bad"><b>Web3Forms turned it down:</b> '+esc(t.detail || 'no reason given')+'</div>';
  else if (t.status === 'notready') return '<div class="note bad"><b>'+(t.dest === 'webhook' ? 'Paste a webhook link that starts with https:// first.' : 'Paste your access key first. It looks like 8-4-4-4-12 letters and numbers.')+'</b></div>';
  else h += '<div class="note bad"><b>We could not reach '+(t.dest === 'email' ? 'Web3Forms' : 'that link')+'.</b> '+(t.dest === 'email' ? 'Check your internet connection and try again.' : 'Check it starts with https and that you copied the whole thing.')+'</div>';
  if (leadVerifiedOk()){
    h += '<div class="note ok"><b>Confirmed.</b> Your test lead arrived, so real ones will too.</div>';
    return h;
  }
  h += '<div class="note" style="border-color:var(--line2)"><b>Did the test lead arrive?</b>'
    + '<div class="row" style="margin-top:8px"><button class="b pri sm" id="btn-arrived-yes">Yes, I got it</button>'
    + '<button class="b sm" id="btn-arrived-no">Not yet</button></div>';

    h += '<div style="margin-top:10px"><b>The three most likely reasons:</b><ol style="margin:6px 0 0;padding-left:20px">';

    h += '</ol><div class="tiny" style="margin-top:6px">Fix the one that fits, then send the test again. This check stays red until a test lead arrives.</div></div>';
  }
  h += '</div>';
  return h;
}

function alertTestHtml(){
  var t = alertTest;
  if (!t) return '';
  if (t.status === 'sending') return '<div class="note info">Sending a test alert email...</div>';
  if (t.status === 'notready') return '<div class="note bad"><b>Paste your backup access key first. It looks like 8-4-4-4-12 letters and numbers.</b></div>';
  if (t.status === 'accepted') return '<div class="note info"><b>Web3Forms accepted the test alert.</b> Look in the inbox the key was made for, and the spam folder, for an email that starts with the ALERT line.</div>';
  if (t.status === 'rejected') return '<div class="note bad"><b>Web3Forms turned it down:</b> '+esc(t.detail || 'no reason given')+'</div>';
  return '<div class="note bad"><b>We could not reach Web3Forms.</b> Check your internet connection and try again.</div>';
}

function sendTestAlert(){
  if (!EFK.alertKey(cfg)){ alertTest = { status:'notready' }; render(); return; }
  var leads = EFK.sampleLeads(cfg);
  var contactT = { name:'Test Submission', email:'test@example.com', phone:'555 0100' };
  var meta = { page_url:'studio-test', utm_source:'studio', utm_medium:'test', utm_campaign:'kit', submitted_at:new Date().toISOString() };
  alertTest = { status:'sending' };
  render();
  var done = function(st, detail){ alertTest = { status: st, detail: detail || '' }; if (activeTab === 'publish') render(); };
  try {
    fetch(EFK.RELAY_URL, { method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body: JSON.stringify(EFK.alertRelayBody(cfg, leads[1].answers, contactT, meta)) })
      .then(function(r){ return r.json().then(function(j){ if (r.ok && j && j.success === true) done('accepted'); else done('rejected', j && j.message ? String(j.message).slice(0,160) : ''); }, function(){ done('rejected'); }); }, function(){ done('failed'); });
  } catch(e){ done('failed'); }
}

function sendTestLead(){
  var dest = destination();
  if (dest === 'none') return;
  if (EFK.leadMode(cfg) !== dest){ leadTest = { dest: dest, status:'notready' }; render(); return; }
  var leads = EFK.sampleLeads(cfg);
  var contactT = { name:'Test Submission', email:'test@example.com', phone:'555 0100' };
  var meta = { page_url:'studio-test', utm_source:'studio', utm_medium:'test', utm_campaign:'kit', submitted_at:new Date().toISOString() };
  leadTest = { dest: dest, status:'sending' };
  render();
  var done = function(st, detail){ leadTest = { dest: dest, status: st, detail: detail || '' }; if (activeTab === 'publish') render(); };
  try {
    if (dest === 'webhook'){
      /* the same rules the funnel uses: HighLevel's answer is read, other CRMs post no-cors */
      EFK.postWebhook(cfg.lead_capture.webhook_url, EFK.payload(cfg, leads[1].answers, contactT, meta), fetch.bind(window))
        .then(function(r){
          if (r.state === 'failed') done(r.readable && r.detail !== 'no connection' ? 'crmrejected' : 'failed', r.detail);
          else done(r.readable ? 'crmaccepted' : 'went', r.detail);
        }, function(){ done('failed'); });
    } else {
      fetch(EFK.RELAY_URL, { method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body: JSON.stringify(EFK.relayBody(cfg, leads[1].answers, contactT, meta)) })
        .then(function(r){ return r.json().then(function(j){ if (r.ok && j && j.success === true) done('accepted'); else done('rejected', j && j.message ? String(j.message).slice(0,160) : ''); }, function(){ done('rejected'); }); }, function(){ done('failed'); });
    }
  } catch(e){ done('failed'); }
}

function drawQR(){
  var cv = document.getElementById('qr');
  var note = document.getElementById('qr-note');
  if (!cv || !liveLink) return;
  var q = null;
  try { q = window.EFK_QR ? EFK_QR.encode(liveLink) : null; } catch(e){ q = null; }
  if (!q){
    cv.classList.add('hide');
    if (note) note.textContent = 'This link is too long for a QR code. Use Copy link instead.';
    return;
  }
  var scale = 4, n = q.size + 8;
  cv.width = n * scale; cv.height = n * scale;
  var ctx = cv.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#000000';
  for (var y=0;y<q.size;y++) for (var x=0;x<q.size;x++) if (q.modules[y][x]) ctx.fillRect((x+4)*scale, (y+4)*scale, scale, scale);
  if (note) note.textContent = 'Point a phone camera at it. QR version ' + q.version + ', ' + q.size + ' by ' + q.size + ' squares.';
}
function afterPublishRender(){ drawQR(); }

  var tsk = el.getAttribute('data-train-skip');

  var utr = el.getAttribute('data-untrain');
  if (utr){

  /* --- publish tab --- */
  if (id === 'btn-download'){

      : '<b>Your browser blocked the download.</b> Use the "Copy my settings" button instead and save it as a file yourself.');

  if (id === 'btn-embed'){ copyText(embedCode(), el, 'Copied'); return; }

  if (id === 'btn-show-payload'){
    var leads = EFK.sampleLeads(cfg);

  if (id === 'btn-arrived-yes'){
    leadVerified = leadPrint();
    notice('publish','ok','<b>Confirmed.</b> Leads reach you. That check is green now.');

  if (id === 'btn-live-open'){ try { window.open(liveLink, '_blank', 'noopener'); } catch(e){} return; }

  if (id === 'btn-report'){ sendReport(); return; }

/* text / number / select inputs update the model without a re-render */
document.addEventListener('input', function(ev){
  var el = ev.target;
  var changed = false;

  var biz = el.getAttribute('data-biz');
  if (biz){
    if (biz === 'hourly_rate') cfg.business.hourly_rate = el.value === '' ? null : num(el.value, null);
    else cfg.business[biz] = el.value;
    if (biz === 'name') $('#bizchip').textContent = el.value || 'Your business';
    if (biz === 'brand_color') { try { document.documentElement.style.setProperty('--brand', el.value); } catch(e){} }
    if (biz === 'booking_url') bookingTested = false;
    changed = true;
  }

  var cp = el.getAttribute('data-copy');
  if (cp){ cfg.result_copy[cp] = el.value; changed = true; }

  var ld = el.getAttribute('data-lead');
  if (ld){ cfg.lead_capture[ld] = (ld === 'email_key' || ld === 'alert_email_key') ? el.value.trim().toLowerCase() : el.value.trim(); if (ld === 'alert_email_key') alertTest = null; changed = true; }

  var rp = el.getAttribute('data-report');
  if (rp){ report[rp] = el.value; reportOut = ''; var ro = document.getElementById('report-out'); if (ro) ro.innerHTML = ''; return; }

  var sv = el.getAttribute('data-svc');
  if (sv !== null && sv !== undefined){
    var s = cfg.services[+sv];
    var k = el.getAttribute('data-k');
    if (s){
      if (k === 'label' || k === 'help') s[k] = el.value;
      else s[k] = num(el.value, s[k]);
      changed = true;
    }
  }

  var qi = el.getAttribute('data-q');
  if (qi !== null && qi !== undefined){
    var q = cfg.questions[+qi];
    var qk = el.getAttribute('data-k');
    if (q){
      if (qk === 'label') q.label = el.value;
      else if (qk === 'type'){ q.type = el.value; reDoctor(); return; }
      else if (qk === 'min' || qk === 'max') q[qk] = num(el.value, q[qk]);
      else if (qk === 'pu_type'){ q.per_unit_effect = q.per_unit_effect || { type:'none', value:0 }; q.per_unit_effect.type = el.value; }
      else if (qk === 'pu_value'){ q.per_unit_effect = q.per_unit_effect || { type:'none', value:0 }; q.per_unit_effect.value = num(el.value, 0); }
      changed = true;
    }
  }

  var oi = el.getAttribute('data-opt');
  if (oi !== null && oi !== undefined){
    var q3 = cfg.questions[+oi];
    var o = +el.getAttribute('data-o');
    var ok2 = el.getAttribute('data-k');
    if (q3 && q3.options && q3.options[o]){
      q3.options[o].effect = q3.options[o].effect || { type:'none', value:0 };
      if (ok2 === 'label') q3.options[o].label = el.value;
      else if (ok2 === 'type') q3.options[o].effect.type = el.value;
      else q3.options[o].effect.value = num(el.value, 0);
      changed = true;
    }
  }

  var kb = el.getAttribute('data-knob');
  if (kb){
    if (!knobBaseline) knobBaseline = captureBaseline();
    cfg.knobs[kb] = parseInt(el.value, 10);
    el.style.setProperty('--pct', el.value + '%');
    var kv = document.getElementById('kv-'+kb);
    if (kv) kv.textContent = el.value;
    var km = document.getElementById('km-'+kb);
    if (km) km.textContent = EFK.explainKnob(kb, cfg.knobs[kb]);
    refreshSamples(false);
    save(); queuePreview();
    return;
  }

  if (changed){ save(); queuePreview(); }
});

document.addEventListener('change', function(ev){
  var el = ev.target;

  var tg = el.getAttribute('data-toggle');
  if (tg){ cfg.toggles[tg] = !!el.checked; render(); queuePreview(); return; }

  if (el.getAttribute('data-tstyle')){ cfg.toggles.timeline_style = el.value === 'range' ? 'range' : 'about'; save(); render(); queuePreview(); return; }

  if (el.getAttribute('data-watch')){
    cfg.lead_capture.watch_list = el.value.split(/[\n,;]+/).map(function(x){ return x.trim(); }).filter(Boolean).slice(0, 200);
    reDoctor(); return;
  }

  if (el.id === 'chk-multi'){ cfg.allow_multiple_services = !!el.checked; save(); queuePreview(); return; }

  var ldst = el.getAttribute('data-leaddest');
  if (ldst){ cfg.lead_capture.destination = ldst; leadTest = null; reDoctor(); return; }

  if (el.id === 'chk-sanity'){ sanityPrint = el.checked ? sampleFingerprint() : ''; render(); return; }

  var urg = el.getAttribute('data-urg');
  if (urg !== null && urg !== undefined){
    var q = cfg.questions[+urg];
    if (q){ if (el.checked) q.role = 'urgency'; else delete q.role; }
    reDoctor(); return;
  }

  var aall = el.getAttribute('data-applies-all');
  if (aall !== null && aall !== undefined){
    var qa = cfg.questions[+aall];
    if (qa) qa.applies_to = [];
    reDoctor(); return;
  }

  var ap = el.getAttribute('data-applies');
  if (ap !== null && ap !== undefined){
    var qb = cfg.questions[+ap];
    var key = el.getAttribute('data-key');
    if (qb){
      if (!qb.applies_to) qb.applies_to = [];
      var at = qb.applies_to.indexOf(key);
      if (el.checked && at === -1) qb.applies_to.push(key);
      if (!el.checked && at !== -1) qb.applies_to.splice(at,1);
    }
    reDoctor(); return;
  }

  if (el.getAttribute('data-biz') === 'unit'){ cfg.business.unit = el.value; reDoctor(); return; }

  if (el.id === 'file-import'){
    var file = el.files && el.files[0];
    if (!file) return;
    var rd = new FileReader();
    rd.onload = function(){
      var text = String(rd.result || '');
      var m = text.match(/<script type="application\/json" id="FUNNEL_CONFIG">([\s\S]*?)<\/script>/);
      var dx = EFK.doctor(m ? m[1] : text);
      if (dx.ok){
        cfg = dx.config; bookingTested = false;
        notice(activeTab,'ok','<b>Loaded '+esc(file.name)+'.</b> '
          + (dx.repairs.length ? 'We fixed ' + dx.repairs.length + ' thing(s) on the way in.' : 'Nothing needed fixing.'));
        render(); refreshPreview();
      } else {
        notice(activeTab,'bad','<b>We could not use '+esc(file.name)+'.</b> '+esc(dx.errors[0]||''));
        render();
      }
      el.value = '';
    };
    rd.readAsText(file);
    return;
  }
});

/* a knob drag ends: keep the ghost for a moment, then clear it */
document.addEventListener('pointerup', clearGhostSoon);
document.addEventListener('keyup', function(ev){ if (ev.target && ev.target.getAttribute && ev.target.getAttribute('data-knob')) clearGhostSoon(); });
var ghostTimer = null;
function clearGhostSoon(){
  if (ghostTimer) clearTimeout(ghostTimer);

/* ------------------------------------------------------------------ *
 * Start
 * ------------------------------------------------------------------ */
/* THE address bar preset rule. A ?preset= link (the thank-you page, the
 * receipt email, the on-camera hook) loads that example ONLY when this browser
 * holds no saved work, or the saved work is an untouched preset (nothing edited,
 * nothing tested). Real saved work is never replaced: kept is true and the
 * Studio shows a small note instead. Pure function, so test.mjs runs it. */
function urlPresetPlan(qs, saved, presets, doctor){
  var mp = /[?&]preset=([a-z0-9_-]+)/i.exec(qs || '');
  if (!mp || !presets[mp[1]]) return { key: '', kept: false, asked: '' };
  var asked = mp[1];
  if (!saved || !saved.cfg) return { key: asked, kept: false, asked: asked };
  var untouched = false;
  try {
    untouched = !saved.bookingTested && !saved.sanityPrint && !saved.leadVerified
      && !!saved.preset && !!presets[saved.preset]
      && JSON.stringify(saved.cfg) === JSON.stringify(doctor(JSON.parse(JSON.stringify(presets[saved.preset]))).config);
  } catch(e){ untouched = false; }
  if (untouched) return { key: asked, kept: false, asked: asked };
  return { key: '', kept: true, asked: asked };
}
function boot(){
  var restored = load();
  if (!restored){
    var first = PRESETS['hvac'] ? 'hvac' : Object.keys(PRESETS)[0];
    if (first) { var dx = EFK.doctor(JSON.parse(JSON.stringify(PRESETS[first]))); cfg = dx.config; activePreset = first; }
  }
  /* Two harmless address bar hooks, so a link can open the studio on a given
   * tab with a given niche already loaded: ?tab=knobs&preset=hvac
   * Nothing a buyer types by accident, and no effect without them.
   * ?preset= NEVER overwrites saved work (see urlPresetPlan). */
  try {
    var qs = location.search;
    var savedRaw = null;
    try { savedRaw = restored ? JSON.parse(localStorage.getItem(LS_KEY) || 'null') : null; } catch(e2){ savedRaw = null; }
    var plan = urlPresetPlan(qs, savedRaw, PRESETS, EFK.doctor);
    if (plan.key){
      var dxp = EFK.doctor(JSON.parse(JSON.stringify(PRESETS[plan.key])));
      cfg = dxp.config;
      activePreset = plan.key;
      bookingTested = false;
    }
    var m = /[?&]tab=([a-z]+)/.exec(qs);
    if (m){
      for (var i=0;i<TABS.length;i++) if (TABS[i].id === m[1]) activeTab = m[1];
    }
    if (plan.kept){
      notice(activeTab, 'info', '<b>Your saved work is still here.</b> This link opens the '+esc(nicheName(plan.asked))+' example, so we left your work exactly as it was. To load the example instead, press Export my work to keep a copy, then pick it on the Niche tab.');
    }
  } catch(e){}
  render();
  refreshPreview();
  if (SELFTEST) setTimeout(selftest, 120);
}
