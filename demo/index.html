<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../favicon.png">
<meta name="robots" content="noindex">
<title>Instant estimate</title>
<style>
:root{
  --brand:#1d4ed8;
  --brand-soft:rgba(29,78,216,.10);
  --brand-line:rgba(29,78,216,.28);
  --ink:#111827;
  --ink-soft:#4b5563;
  --ink-faint:#6b7280;
  --line:#e5e7eb;
  --card:#ffffff;
  --bg:#f4f6fb;
  --ok:#047857;
  --radius:18px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 12px 32px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji",sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:16px;
  line-height:1.5;
  min-height:100%;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 420px at 50% -8%, var(--brand-soft), transparent 70%);
}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:20px 16px 44px}
.banner{
  max-width:620px;margin:0 auto 12px;padding:9px 14px;border-radius:12px;
  background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
  font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;
}
.banner a{color:#9a3412;font-weight:700}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px;min-height:34px}
.logo{height:34px;width:auto;max-width:150px;object-fit:contain;display:block}
.bizname{font-weight:700;font-size:16px;letter-spacing:-.01em}
.tag{font-size:13px;color:var(--ink-faint);margin-left:auto;text-align:right}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.pbar{height:5px;background:var(--line);position:relative}
.pbar i{position:absolute;inset:0 auto 0 0;width:0%;background:var(--brand);border-radius:0 4px 4px 0;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.pad{padding:24px 22px 22px}
.meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-faint);font-weight:600;margin-bottom:12px;letter-spacing:.01em}
.back{
  appearance:none;background:none;border:0;padding:6px 8px;margin:-6px 0 -6px -8px;border-radius:9px;
  font:inherit;font-size:13px;font-weight:600;color:var(--ink-faint);cursor:pointer;
}
.back:hover{background:#f3f4f6;color:var(--ink)}
.back:focus-visible,.opt:focus-visible,.btn:focus-visible,.inp:focus-visible,.textlink:focus-visible{outline:3px solid var(--brand-line);outline-offset:2px}
h1.q{font-size:23px;line-height:1.28;letter-spacing:-.02em;margin:0 0 6px;font-weight:700}
.sub{font-size:14.5px;color:var(--ink-soft);margin:0 0 18px}
.opts{display:flex;flex-direction:column;gap:9px;margin:0 0 4px}
.opt{
  appearance:none;width:100%;text-align:left;font:inherit;font-size:15.5px;font-weight:600;
  background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:14px 46px 14px 15px;
  cursor:pointer;color:var(--ink);position:relative;transition:border-color .15s,background .15s,transform .08s;
}
.opt:hover{border-color:var(--brand-line);background:#fbfcff}
.opt:active{transform:scale(.995)}
.opt .oh{display:block;font-size:13px;font-weight:500;color:var(--ink-faint);margin-top:3px}
.opt[aria-pressed="true"],.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt .tick{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:800;
}
.opt.sel .tick{background:var(--brand);border-color:var(--brand)}
.btn{
  appearance:none;width:100%;font:inherit;font-size:16px;font-weight:700;color:#fff;background:var(--brand);
  border:0;border-radius:13px;padding:15px 18px;cursor:pointer;margin-top:14px;
  box-shadow:0 6px 18px rgba(29,78,216,.22);transition:filter .15s,transform .08s;text-align:center;
  text-decoration:none;display:block;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none;font-weight:600}
.fields{display:flex;flex-direction:column;gap:11px;margin-top:4px}
label.fl{font-size:13px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:5px}
.inp{
  width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:12px;background:#fff;color:var(--ink);
}
.inp:focus{border-color:var(--brand)}
.err{color:#b91c1c;font-size:13.5px;font-weight:600;margin-top:10px;display:none}
.err.on{display:block}
.hp{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
.fine{font-size:12.5px;color:var(--ink-faint);margin-top:12px;line-height:1.5}
.res-lab{font-size:13px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.res-num{
  font-size:clamp(30px,8.5vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1.08;color:var(--brand);
  margin:0 0 6px;word-break:break-word;
}
.res-alt{font-size:15px;font-weight:600;color:var(--ink-soft);margin-bottom:12px}
.chipline{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{background:#f3f4f6;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.chip.time{background:var(--brand-soft);color:var(--brand)}
.sec{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.sec h2{font-size:14px;font-weight:800;margin:0 0 10px;letter-spacing:-.01em}
.drv{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;align-items:flex-start}
.drv:last-child{border-bottom:0}
.drv .dl{flex:1;color:var(--ink-soft)}
.drv .dl b{color:var(--ink);font-weight:700;display:block;font-size:14px}
.drv .dv{font-weight:700;font-size:13.5px;color:var(--ink);white-space:nowrap}
.li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14.5px;border-bottom:1px dashed var(--line)}
.li:last-child{border-bottom:0}
.li b{font-weight:700}
.disc{font-size:12.5px;color:var(--ink-faint);margin-top:14px;line-height:1.55}
.spin{display:inline-block;width:15px;height:15px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.fadein{animation:fi .26s ease both}
@keyframes fi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.foot{text-align:center;font-size:12px;color:var(--ink-faint);margin-top:16px}
.kitfoot{position:relative;z-index:1;text-align:center;font-size:12px;color:var(--ink-faint);padding:6px 16px 22px}
.kitfoot a{color:var(--ink-faint);font-weight:600}
.sec h2.st{margin-bottom:6px}
.panic{max-width:620px;margin:40px auto;background:#fff;border:1px solid #fecaca;border-left:5px solid #dc2626;border-radius:14px;padding:22px}
.panic h2{margin:0 0 8px;font-size:19px}
.panic li{margin:6px 0;font-size:14.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:420px){ .pad{padding:20px 16px 18px} h1.q{font-size:21px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>

<script>/* Estimate Funnel Kit - engine.js - v1.2
 * Pure functions. No dependencies. Runs in node and in the browser.

  /* The one email relay the kit supports (option "Email me each lead"). Facts

   * including file:// and a null origin iframe, free plan 250 submissions a month.
   * It is a constant on purpose: a config can never point the relay elsewhere. */
  var RELAY_URL = 'https://api.web3forms.com/submit';

  function isObj(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }
  function isArr(v) { return Array.isArray(v); }
  function isStr(v) { return typeof v === 'string'; }
  function isFiniteNum(v) { return typeof v === 'number' && isFinite(v); }

  function clamp(n, lo, hi) {
    if (!isFiniteNum(n)) return lo;
    if (n < lo) return lo;
    if (n > hi) return hi;
    return n;

  /* Turn almost anything into a number. Handles "$1,200", "1 200 USD",
   * "from 450", "12.5 hrs", "40%", true/false, null. Returns null if hopeless. */
  function toNum(v) {
    if (isFiniteNum(v)) return v;
    if (typeof v === 'boolean') return v ? 1 : 0;
    if (v === null || v === undefined) return null;
    if (typeof v === 'object') return null;
    var s = String(v);
    s = s.replace(/[\u2212\u2013\u2014]/g, '-');           // unicode minus / dashes
    s = s.replace(/[^0-9eE+\-.,]/g, ' ');                   // drop currency words + symbols
    s = s.replace(/(\d)[ ,](?=\d{3}\b)/g, '$1');            // 1,200 and 1 200 -> 1200
    var m = s.match(/-?\d*\.?\d+(?:[eE][+-]?\d+)?/);
    if (!m) return null;
    var n = parseFloat(m[0]);
    return isFinite(n) ? n : null;
  }

  /* Pull every number out of a string, e.g. "150 to 650" -> [150, 650] */
  function allNums(v) {
    if (isFiniteNum(v)) return [v];
    if (!isStr(v)) return [];
    var s = String(v).replace(/(\d)[ ,](?=\d{3}\b)/g, '$1');

    while ((m = re.exec(s)) !== null) {

  function slugify(v, fallback) {
    var s = (v === null || v === undefined) ? '' : String(v);
    s = s.toLowerCase()

      .replace(/[^a-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '')
      .slice(0, 48);
    return s || (fallback || 'item');
  }

  function titleCase(s) {
    s = String(s || '').replace(/[_-]+/g, ' ').trim();
    if (!s) return '';
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function deepClone(v, seen) {
    seen = seen || [];
    if (v === null || typeof v !== 'object') return v;
    for (var i = 0; i < seen.length; i++) if (seen[i] === v) return null; // cycle guard

    return o;

  function median(list) {
    if (!list || !list.length) return null;
    var a = list.slice().sort(function (x, y) { return x - y; });
    var mid = Math.floor(a.length / 2);
    return a.length % 2 ? a[mid] : (a[mid - 1] + a[mid]) / 2;
  }

  function uniqPush(arr, msg) {
    if (!msg) return;
    for (var i = 0; i < arr.length; i++) if (arr[i] === msg) return;

   * 1. Lenient JSON reader (the Config Doctor's front door)
   * ------------------------------------------------------------------ */

    while (i < n) {

        i++; continue;
      }
      if (isQuote(ch)) {

        i++;
        while (i < n) {

      if (ch === '#') { while (i < n && s[i] !== '\n') i++; continue; }

        hi = biz.unit === 'price' ? 500 : 6;
      }
      if (lo > hi) {
        uniqPush(repairs, '"' + label + '" had a low of ' + lo + ' sitting above its high of ' + hi + ', so we swapped them around for you.');
        var tmp = lo; lo = hi; hi = tmp;
      }
      if (lo <= 0) {
        uniqPush(repairs, 'The low price on "' + label + '" was zero or less. We set it just above zero. Open the Prices tab and type your real low.');
        lo = biz.unit === 'price' ? 1 : 0.25;
        if (hi <= lo) hi = lo * 2;
      }
      lo = clamp(lo, 0.01, 10000000); hi = clamp(hi, lo, 10000000);

      var key = slugify(r.key || label, 'service_' + (services.length + 1));
      if (usedKeys[key]) {
        var bump = 2;
        while (usedKeys[key + '_' + bump]) bump++;
        uniqPush(repairs, 'Two of your services shared the id "' + key + '", which would have made them share a price. We renamed the second one to "' + key + '_' + bump + '" so they stay separate.');
        key = key + '_' + bump;
      }
      usedKeys[key] = 1;

      var dlo = toNum(r.days_lo); if (dlo === null) dlo = 1;
      var dhi = toNum(r.days_hi); if (dhi === null) dhi = Math.max(dlo, 2);
      dlo = Math.round(clamp(dlo, 0, 365)); dhi = Math.round(clamp(dhi, 0, 365));
      if (dlo > dhi) { var td = dlo; dlo = dhi; dhi = td; }

      services.push({
        key: key,
        label: label,
        lo: Math.round(lo * 100) / 100,
        hi: Math.round(hi * 100) / 100,
        days_lo: dlo,
        days_hi: dhi,
        help: isStr(r.help) ? r.help.trim().slice(0, 160) : '',
        example_data: r.example_data === false ? false : (r.example_data === true ? true : true)
      });
    }

    if (!services.length) {
      uniqPush(errors, 'There are no services yet. Open the Prices tab and add at least one thing you sell, with a low and a high price.');
      services.push({ key: 'main_service', label: 'Main service', lo: biz.unit === 'price' ? 250 : 4, hi: biz.unit === 'price' ? 900 : 10, days_lo: 1, days_hi: 3, help: '', example_data: true });
    }
    cfg.services = services;
    cfg.allow_multiple_services = raw.allow_multiple_services === false ? false : true;

    /* ---- questions ---- */
    var validKeys = {};
    for (var vk = 0; vk < services.length; vk++) validKeys[services[vk].key] = services[vk].label;

    var rawQuestions = isArr(raw.questions) ? raw.questions : [];
    if (!isArr(raw.questions) && isObj(raw.questions)) {
      rawQuestions = [];
      for (var qk in raw.questions) if (Object.prototype.hasOwnProperty.call(raw.questions, qk)) {
        var qv = raw.questions[qk];
        if (isObj(qv)) { qv = deepClone(qv); if (!qv.key) qv.key = qk; rawQuestions.push(qv); }
      }
    }

    /* Any modifier we pulled out of services becomes its own yes/no question. */
    for (var mi = 0; mi < movedModifiers.length; mi++) {
      var mo = movedModifiers[mi];
      var mlabel = isStr(mo.label) && mo.label.trim() ? mo.label.trim() : (isStr(mo.name) ? mo.name.trim() : 'Extra');
      var meff = isObj(mo.effect) ? mo.effect : { type: (isStr(mo.type) ? mo.type : 'multiply'), value: (mo.value !== undefined ? mo.value : (mo.multiplier !== undefined ? mo.multiplier : mo.factor)) };
      rawQuestions.push({
        key: slugify(mo.key || mlabel, 'extra_' + (mi + 1)),
        label: 'Does this job need ' + mlabel.toLowerCase() + '?',
        type: 'single',
        applies_to: [],
        options: [
          { label: 'Yes', effect: meff },
          { label: 'No', effect: { type: 'none', value: 0 } },
          { label: 'Not sure', effect: { type: 'widen', value: 0.1 } }
        ]
      });
      uniqPush(repairs, 'We moved "' + mlabel + '" out of your services list. It changes a price instead of being something you sell, so it is now a question.');
    }

    var questions = [], usedQKeys = {}, hasUrgency = false;
    for (var qi = 0; qi < rawQuestions.length && questions.length < 30; qi++) {
      var q = rawQuestions[qi];
      if (isStr(q)) q = { label: q, type: 'single', options: [{ label: 'Yes' }, { label: 'No' }] };
      if (!isObj(q)) continue;

      var qlabel = isStr(q.label) && q.label.trim() ? q.label.trim().slice(0, 160)
        : (isStr(q.question) ? q.question.trim().slice(0, 160) : titleCase(q.key || ''));
      if (!qlabel) continue;

      var qtype = isStr(q.type) ? q.type.trim().toLowerCase() : 'single';
      if (qtype === 'radio' || qtype === 'select' || qtype === 'choice' || qtype === 'dropdown' || qtype === 'one') qtype = 'single';
      if (qtype === 'checkbox' || qtype === 'multiple' || qtype === 'multiselect' || qtype === 'many') qtype = 'multi';
      if (qtype === 'num' || qtype === 'integer' || qtype === 'count' || qtype === 'quantity') qtype = 'number';
      if (qtype !== 'single' && qtype !== 'multi' && qtype !== 'number') qtype = 'single';

      var qkey = slugify(q.key || qlabel, 'question_' + (questions.length + 1));
      if (usedQKeys[qkey]) {
        var qb = 2; while (usedQKeys[qkey + '_' + qb]) qb++;
        qkey = qkey + '_' + qb;
        uniqPush(repairs, 'Two questions shared the same id. We renamed one so both still work.');
      }
      usedQKeys[qkey] = 1;

      var applies = [];
      var rawApplies = isArr(q.applies_to) ? q.applies_to : (isStr(q.applies_to) ? [q.applies_to] : []);
      var droppedApplies = 0;
      for (var pi = 0; pi < rawApplies.length; pi++) {
        var ak = slugify(rawApplies[pi], '');
        if (validKeys[ak]) { if (applies.indexOf(ak) === -1) applies.push(ak); }
        else if (ak) droppedApplies++;
      }
      if (droppedApplies) {
        uniqPush(repairs, 'The question "' + qlabel + '" pointed at ' + droppedApplies + ' service(s) that do not exist. We removed those links.');
      }
      if (rawApplies.length && !applies.length) {
        uniqPush(repairs, 'The question "' + qlabel + '" was linked only to services that do not exist, so it now shows for every service.');
      }

      var qq = { key: qkey, label: qlabel, type: qtype, applies_to: applies };

      var role = isStr(q.role) ? q.role.trim().toLowerCase() : '';
      if (role === 'urgency' || /urgen|how soon|rush|emergen|when do you need/i.test(qlabel)) {
        qq.role = 'urgency';
        hasUrgency = true;
      }
      if (isStr(q.help) && q.help.trim()) qq.help = q.help.trim().slice(0, 160);

      if (qtype === 'number') {
        var mn = toNum(q.min); var mx = toNum(q.max); var st = toNum(q.step);
        qq.min = mn === null ? 0 : clamp(mn, 0, 1000000);
        qq.max = mx === null ? Math.max(qq.min + 10, 10) : clamp(mx, qq.min + 1, 1000000);
        qq.step = st === null || st <= 0 ? 1 : clamp(st, 0.01, 1000);
        qq.per_unit_effect = readEffect(q.per_unit_effect || q.effect, repairs, 'on "' + qlabel + '"');
        if (qq.per_unit_effect.type === 'widen') qq.per_unit_effect = { type: 'none', value: 0 };
        questions.push(qq);
        continue;
      }

      var rawOpts = isArr(q.options) ? q.options : (isArr(q.choices) ? q.choices : (isArr(q.answers) ? q.answers : []));
      var opts = [];
      for (var oi = 0; oi < rawOpts.length && opts.length < 20; oi++) {
        var o = rawOpts[oi];
        if (isStr(o) || isFiniteNum(o)) o = { label: String(o) };
        if (!isObj(o)) continue;
        var olabel = isStr(o.label) && o.label.trim() ? o.label.trim().slice(0, 90)
          : (isStr(o.text) ? o.text.trim().slice(0, 90) : (isStr(o.value) ? o.value.trim().slice(0, 90) : ''));
        if (!olabel) continue;
        var eff = readEffect(o.effect !== undefined ? o.effect : (o.multiplier !== undefined ? o.multiplier : o.value), repairs, 'under "' + qlabel + '"');
        if (/not sure|unsure|don'?t know|no idea|not certain/i.test(olabel) && eff.type === 'none') {
          eff = { type: 'widen', value: 0.10 };
          uniqPush(repairs, 'The "' + olabel + '" answer under "' + qlabel + '" did nothing. We made it widen the range a little, which is what a not-sure answer should do.');
        }
        opts.push({ label: olabel, effect: eff });
      }
      if (opts.length < 2) {
        uniqPush(repairs, 'The question "' + qlabel + '" had fewer than two answers, so we left it out. Add it back on the Prices tab if you need it.');
        continue;
      }
      qq.options = opts;
      questions.push(qq);
    }
    cfg.questions = questions;
    if (!hasUrgency) uniqPush(setup, 'You have no "how soon do you need this" question. Adding one lets the Rush premium knob do its job.');

    /* ---- knobs ---- */
    var rawKnobs = isObj(raw.knobs) ? raw.knobs : {};
    for (var ki = 0; ki < KNOB_KEYS.length; ki++) {
      var kk = KNOB_KEYS[ki];
      var kv = toNum(rawKnobs[kk]);
      if (kv === null) { cfg.knobs[kk] = KNOB_DEFAULTS[kk]; continue; }
      if (kv > 0 && kv <= 1 && kv !== 1) { kv = kv * 100; uniqPush(repairs, 'The ' + kk.replace(/_/g, ' ') + ' knob was set as a fraction. We changed it to the 0 to 100 scale.'); }
      var ck = Math.round(clamp(kv, 0, 100));
      if (Math.abs(ck - kv) > 0.5) uniqPush(repairs, 'The ' + kk.replace(/_/g, ' ') + ' knob was outside 0 to 100. We moved it to ' + ck + '.');
      cfg.knobs[kk] = ck;
    }

    /* ---- toggles ---- */
    var rawTog = isObj(raw.toggles) ? raw.toggles : {};
    cfg.toggles.contact_before_result = truthy(rawTog.contact_before_result, false);
    cfg.toggles.show_timeline = truthy(rawTog.show_timeline, true);
    cfg.toggles.show_drivers = truthy(rawTog.show_drivers, true);
    /* v1.2: "about" shows one figure from the middle of the day range, "range" shows "X to Y days" */
    var ts = isStr(rawTog.timeline_style) ? rawTog.timeline_style.trim().toLowerCase() : '';
    if (ts && TIMELINE_STYLES.indexOf(ts) === -1) {
      uniqPush(repairs, 'The timeline style was not "about" or "range", so we set it to "about", which shows one number of days.');
      ts = '';
    }
    cfg.toggles.timeline_style = ts || 'about';

    /* ---- calibration ---- */
    var rawCal = isObj(raw.calibration) ? raw.calibration : {};
    var per = isObj(rawCal.per_service) ? rawCal.per_service : {};
    var cleanPer = {};
    for (var ck2 in per) {
      if (!Object.prototype.hasOwnProperty.call(per, ck2)) continue;
      var sKey = slugify(ck2, '');
      if (!validKeys[sKey]) continue;
      var f = toNum(per[ck2]);
      if (f === null || f <= 0) continue;
      var cf = clamp(f, 0.5, 2.0);
      if (Math.abs(cf - f) > 0.0001) uniqPush(repairs, 'A learned price adjustment was outside safe limits. We pulled it back to ' + cf.toFixed(2) + '.');
      cleanPer[sKey] = Math.round(cf * 1000) / 1000;
    }
    cfg.calibration.per_service = cleanPer;
    cfg.calibration.last_trained = isStr(rawCal.last_trained) ? rawCal.last_trained.slice(0, 40) : null;
    var rounds = toNum(rawCal.rounds);
    cfg.calibration.rounds = rounds === null ? 0 : Math.round(clamp(rounds, 0, 1000));

    /* ---- lead capture ---- */
    var rawLead = isObj(raw.lead_capture) ? raw.lead_capture : {};
    var whErrs = [];
    var wh = isStr(rawLead.webhook_url) && rawLead.webhook_url.trim()
      ? checkUrl(rawLead.webhook_url, 'webhook link', repairs, whErrs, false, setup) : '';
    if (whErrs.length) {
      uniqPush(warnings, 'Your webhook link did not look like a web address, so we left it empty. Your funnel still works and still shows the price. Paste the link again on the Publish tab if you want the answers sent somewhere.');
      wh = '';
    }
    cfg.lead_capture.webhook_url = wh;

    /* the email relay key (Web3Forms access key). Public by design, shaped like a UUID. */
    var ek = isStr(rawLead.email_key) ? rawLead.email_key.trim().replace(/^["'\s]+|["'\s]+$/g, '') : '';
    if (ek && !UUID_RE.test(ek)) {
      uniqPush(repairs, 'Your email access key did not look right (it should look like 8-4-4-4-12 letters and numbers), so we left it empty. Copy it again from the Web3Forms email and paste it on the Publish tab.');
      ek = '';
    }
    cfg.lead_capture.email_key = ek.toLowerCase();

    /* v1.1.2: the backup email when the CRM send fails. Also a Web3Forms access key,
     * because Web3Forms sends to the address the key was made for. */
    var alk = isStr(rawLead.alert_email_key) ? rawLead.alert_email_key.trim().replace(/^["'\s]+|["'\s]+$/g, '') : '';
    if (alk && !UUID_RE.test(alk)) {
      uniqPush(repairs, 'Your backup email key did not look right (it should look like 8-4-4-4-12 letters and numbers), so we left it empty. Copy it again from the Web3Forms email and paste it on the Publish tab.');
      alk = '';
    }
    cfg.lead_capture.alert_email_key = alk.toLowerCase();

    /* where leads go. Older configs have no destination: a webhook link means
     * webhook, otherwise nowhere. Nowhere is honest, the funnel then never says sent. */
    var dest = isStr(rawLead.destination) ? rawLead.destination.trim().toLowerCase() : '';
    if (dest === 'crm' || dest === 'zapier' || dest === 'make' || dest === 'highlevel') dest = 'webhook';
    if (dest === 'relay' || dest === 'web3forms' || dest === 'inbox') dest = 'email';
    if (dest === 'nowhere' || dest === 'off' || dest === '') dest = dest === '' ? '' : 'none';
    if (LEAD_MODES.indexOf(dest) === -1) dest = wh ? 'webhook' : (ek ? 'email' : 'none');
    cfg.lead_capture.destination = dest;
    if (dest === 'webhook' && !wh) uniqPush(setup, 'You chose to send leads to your CRM or automation tool, but there is no webhook link yet. Paste it on the Publish tab, or nobody receives your leads.');
    if (dest === 'email' && !ek) uniqPush(setup, 'You chose to get each lead by email, but there is no access key yet. Follow the three steps on the Publish tab, or nobody receives your leads.');

    var fields = [];
    var rawFields = isArr(rawLead.fields) ? rawLead.fields : ['name', 'email', 'phone'];
    for (var fi = 0; fi < rawFields.length; fi++) {
      var fname = slugify(rawFields[fi], '');
      if (fname === 'full_name' || fname === 'first_name') fname = 'name';
      if (fname === 'email_address') fname = 'email';
      if (fname === 'phone_number' || fname === 'mobile') fname = 'phone';
      if (ALLOWED_FIELDS.indexOf(fname) !== -1 && fields.indexOf(fname) === -1) fields.push(fname);
    }
    if (!fields.length) fields = ['name', 'email'];
    if (fields.indexOf('email') === -1) {
      fields.push('email');
      uniqPush(repairs, 'We added the email box back to your contact step. Without it you cannot follow up with anyone.');
    }
    cfg.lead_capture.fields = fields;
    cfg.lead_capture.consent_text = isStr(rawLead.consent_text) ? rawLead.consent_text.trim().slice(0, 300) : '';
    cfg.lead_capture.watch_list = cleanWatchList(rawLead.watch_list);

    /* ---- result copy ---- */
    var rawCopy = isObj(raw.result_copy) ? raw.result_copy : {};
    cfg.result_copy.headline = cleanCopy(rawCopy.headline, d.result_copy.headline, 90, repairs);
    cfg.result_copy.disclaimer = cleanCopy(rawCopy.disclaimer, d.result_copy.disclaimer, 320, repairs);
    cfg.result_copy.cta_label = cleanCopy(rawCopy.cta_label, d.result_copy.cta_label, 50, repairs);

    /* ---- demo banner + version ---- */
    cfg.demo_banner = truthy(raw.demo_banner, false);
    cfg.demo_banner_url = isStr(raw.demo_banner_url) ? raw.demo_banner_url.trim().slice(0, 300) : '';
    if (cfg.demo_banner_url && (!/^https:\/\/[^\/?#]+\.[^\/?#]+/i.test(cfg.demo_banner_url) || /[\s"'<>`\\]/.test(cfg.demo_banner_url))) cfg.demo_banner_url = '';
    cfg.kit_version = VERSION;

    /* ---- math bounds check (PROJECT.md 2b) ---- */
    try {
      var stack = worstStack(cfg);
      if (stack.factor > 2.5) {
        uniqPush(warnings, 'Your questions can multiply one ' + stack.service + ' job by up to ' + (Math.round(stack.factor * 100) / 100) +
          ' times on their own, which is a bigger jump than most customers will believe. The biggest pushers are ' + stack.blame +
          '. Open the Prices tab and lower those "multiply" answers to about 1.3 or less.');
      }
    } catch (e3) { /* never block on the warning */ }

    /* ---- example data gate ---- */
    var exampleCount = 0;
    for (var ei = 0; ei < cfg.services.length; ei++) if (cfg.services[ei].example_data) exampleCount++;
    if (exampleCount) {
      uniqPush(setup, exampleCount + ' of your ' + cfg.services.length + ' services still use example numbers. Open the Prices tab and confirm each one before you publish.');
    }

    return cfg;
  }

  function cleanCopy(v, fallback, max, repairs) {
    if (!isStr(v) || !v.trim()) return fallback;
    var s = v.trim().slice(0, max);
    if (/\u2014|\u2013/.test(s)) {
      s = s.replace(/\s*[\u2014\u2013]\s*/g, ', ');
      uniqPush(repairs, 'We replaced some long dashes in your wording with commas so it reads plainly.');
    }
    if (/\bguarantee(d|s)?\b/i.test(s)) {
      uniqPush(repairs, 'Your wording promised a guarantee. We took that word out, because an estimate is not a promise.');
      s = s.replace(/\bguaranteed\b/gi, 'estimated').replace(/\bguarantees\b/gi, 'estimates').replace(/\bguarantee\b/gi, 'estimate');
    }
    return s;
  }

  function truthy(v, dflt) {
    if (v === undefined || v === null) return dflt;
    if (typeof v === 'boolean') return v;
    if (isFiniteNum(v)) return v !== 0;
    if (isStr(v)) {
      var s = v.trim().toLowerCase();
      if (s === 'true' || s === 'yes' || s === 'on' || s === '1') return true;
      if (s === 'false' || s === 'no' || s === 'off' || s === '0' || s === '') return false;
    }
    return dflt;
  }

  /* The worst multiplier stack that can land on ONE service. This is the number a
   * customer actually feels, so it is what the bounds warning judges. Services are
   * never summed for this, and the rush knob is read at its neutral setting. */
  function worstStack(cfg) {
    var best = { factor: 1, service: 'job', blame: '' };
    for (var i = 0; i < cfg.services.length; i++) {
      var svc = cfg.services[i];
      var factor = 1, parts = [];
      for (var q = 0; q < cfg.questions.length; q++) {
        var qq = cfg.questions[q];
        var ap = isArr(qq.applies_to) ? qq.applies_to : [];
        if (ap.length && ap.indexOf(svc.key) === -1) continue;
        var m = 1;
        if (qq.type === 'number') {
          var e = qq.per_unit_effect || { type: 'none', value: 0 };
          if (e.type === 'multiply') {
            var span = Math.max(0, (toNum(qq.max) || 0) - (toNum(qq.min) || 0));
            m = clamp(1 + (toNum(e.value) || 0) * span, 0.5, 3.0);
          }
        } else {
          for (var o = 0; o < (qq.options || []).length; o++) {
            var ef = qq.options[o].effect || {};
            if (ef.type !== 'multiply') continue;
            var v = toNum(ef.value);
            if (v === null || v <= 1) continue;
            if (qq.type === 'multi') m *= v; else m = Math.max(m, v);
          }
        }
        if (m > 1.0001) { factor *= m; parts.push({ label: qq.label, m: m }); }
      }
      if (factor > best.factor) {
        parts.sort(function (a, b) { return b.m - a.m; });
        var names = [];
        for (var n = 0; n < parts.length && n < 3; n++) names.push('"' + parts[n].label + '"');
        best = {
          factor: factor,
          service: '"' + svc.label + '"',
          blame: names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : (names[0] || 'your questions')
        };
      }
    }
    return best;
  }

  function calFactor(cfg, key) {
    var per = (cfg.calibration && cfg.calibration.per_service) || {};
    var f = toNum(per[key]);
    if (f === null || f <= 0) return 1;
    return clamp(f, 0.5, 2.0);
  }

  /* ------------------------------------------------------------------ *
   * 4. Formatting
   * ------------------------------------------------------------------ */

  function groupDigits(n) {
    var s = String(n);
    var neg = s.charAt(0) === '-';
    if (neg) s = s.slice(1);
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + parts.join('.');
  }

  function fmtMoney(n, cfg) {
    if (!isFiniteNum(n)) n = 0;
    var sym = (cfg && cfg.business && cfg.business.currency_symbol) || '$';
    var rounded = Math.abs(n) < 10 && n % 1 !== 0 ? Math.round(n * 100) / 100 : Math.round(n);
    return sym + groupDigits(rounded);
  }

  function fmtHours(n) {
    if (!isFiniteNum(n)) n = 0;
    var r = Math.round(n * 10) / 10;
    if (Math.abs(r - Math.round(r)) < 0.05) r = Math.round(r);
    return groupDigits(r);
  }

  function fmtPlain(n, cfg) {
    var unit = cfg && cfg.business ? cfg.business.unit : 'price';
    if (unit === 'price') return fmtMoney(n, cfg);
    return fmtHours(n) + ' hours';
  }

  /* ------------------------------------------------------------------ *
   * 5. Rounding
   * ------------------------------------------------------------------ */

  function roundStep(r, value, isHours) {
    if (isHours) {
      if (r <= 0) return 0.1;
      if (r <= 66) return 0.5;
      return 1;
    }
    if (r <= 0) return 1;
    if (r <= 33) return 5;
    if (r <= 66) return 25;
    return value < 1000 ? 50 : 100;
  }

  function roundDown(v, step) {
    if (!(step > 0)) return v;
    var out = Math.floor((v + 1e-9) / step) * step;
    return Math.round(out * 1000) / 1000;
  }
  function roundUp(v, step) {
    if (!(step > 0)) return v;
    var out = Math.ceil((v - 1e-9) / step) * step;
    return Math.round(out * 1000) / 1000;
  }

  /* ------------------------------------------------------------------ *
   * 6. Which questions apply
   * ------------------------------------------------------------------ */

  function applicableQuestions(config, selectedServiceKeys) {
    var out = [];
    if (!config || !isArr(config.questions)) return out;
    var sel = isArr(selectedServiceKeys) ? selectedServiceKeys : [];
    for (var i = 0; i < config.questions.length; i++) {
      var q = config.questions[i];
      if (!q) continue;
      var ap = isArr(q.applies_to) ? q.applies_to : [];
      if (!ap.length) { out.push(q); continue; }
      for (var j = 0; j < sel.length; j++) {
        if (ap.indexOf(sel[j]) !== -1) { out.push(q); break; }
      }
    }
    return out;
  }

  /* ------------------------------------------------------------------ *
   * 7. The estimate
   * ------------------------------------------------------------------ */

  function emptyEstimate(config, note) {
    var unit = config && config.business ? config.business.unit : 'price';
    return {
      lo: 0, hi: 0, unit: unit,
      price_lo: null, price_hi: null,
      days_lo: 0, days_hi: 0,
      drivers: [], line_items: [],
      text: note || 'Pick what you need to see your range.',
      timeline_text: '',
      services_text: ''
    };
  }

  function estimate(config, answers) {
    try {
      return estimateInner(config, answers);
    } catch (e) {
      return emptyEstimate(config, 'We could not work out a price from those answers. Go back a step and try again.');
    }
  }

  function estimateInner(config, answers) {
    var cfg = isObj(config) ? config : defaults();
    if (!isArr(cfg.services) || !cfg.services.length) return emptyEstimate(cfg, 'No services are set up yet.');
    var knobs = isObj(cfg.knobs) ? cfg.knobs : KNOB_DEFAULTS;
    var K = {};
    for (var kn = 0; kn < KNOB_KEYS.length; kn++) {
      var v = toNum(knobs[KNOB_KEYS[kn]]);
      K[KNOB_KEYS[kn]] = v === null ? KNOB_DEFAULTS[KNOB_KEYS[kn]] : clamp(v, 0, 100);
    }
    var ans = isObj(answers) ? answers : {};
    var wanted = isArr(ans.services) ? ans.services : (isStr(ans.services) ? [ans.services] : []);
    var qAns = isObj(ans.q) ? ans.q : {};

    var byKey = {};
    for (var s0 = 0; s0 < cfg.services.length; s0++) byKey[cfg.services[s0].key] = cfg.services[s0];

    var selected = [];
    for (var w = 0; w < wanted.length; w++) {
      var sk = isStr(wanted[w]) ? wanted[w] : String(wanted[w] || '');
      if (byKey[sk] && selected.indexOf(sk) === -1) selected.push(sk);
    }
    if (cfg.allow_multiple_services === false && selected.length > 1) selected = [selected[0]];
    if (!selected.length) return emptyEstimate(cfg, 'Pick what you need to see your range.');

    var isHours = cfg.business && (cfg.business.unit === 'hours' || cfg.business.unit === 'both');

    /* base */
    var baseLo = 0, baseHi = 0, perService = [];
    for (var s1 = 0; s1 < selected.length; s1++) {
      var svc = byKey[selected[s1]];
      var f = calFactor(cfg, svc.key);
      var l = svc.lo * f, h = svc.hi * f;
      baseLo += l; baseHi += h;
      perService.push({ key: svc.key, label: svc.label, lo: l, hi: h, days_lo: svc.days_lo, days_hi: svc.days_hi });
    }
    if (!(baseHi > 0)) return emptyEstimate(cfg, 'Those services have no prices on them yet.');

    /* effects */
    var mult = 1, add = 0, widen = 0, drivers = [];
    var qs = applicableQuestions(cfg, selected);
    for (var qi = 0; qi < qs.length; qi++) {
      var q = qs[qi];
      var a = qAns[q.key];
      if (a === undefined || a === null || a === '') continue;

      if (q.type === 'number') {
        var nval = toNum(a);
        if (nval === null) continue;
        nval = clamp(nval, isFiniteNum(q.min) ? q.min : 0, isFiniteNum(q.max) ? q.max : 1000000);
        var pe = q.per_unit_effect || { type: 'none', value: 0 };
        if (pe.type === 'multiply') {
          var mfac = clamp(1 + (toNum(pe.value) || 0) * nval, 0.5, 3.0);
          mult *= mfac;
          if (Math.abs(mfac - 1) > 0.005) drivers.push({ label: q.label, answer: String(nval), detail: pctWord(mfac) });
        } else if (pe.type === 'add') {
          var amt = (toNum(pe.value) || 0) * nval;
          add += amt;
          if (Math.abs(amt) > 0.005) drivers.push({ label: q.label, answer: String(nval), detail: (amt > 0 ? 'adds ' : 'takes off ') + fmtPlain(Math.abs(amt), cfg) });
        }
        continue;
      }

      var picks = [];
      if (q.type === 'multi') {
        var list = isArr(a) ? a : [a];
        for (var li = 0; li < list.length; li++) {
          var idx = Math.round(toNum(list[li]));
          if (isFiniteNum(idx) && q.options && q.options[idx]) picks.push(idx);
        }
      } else {
        var one = Math.round(toNum(a));
        if (isFiniteNum(one) && q.options && q.options[one]) picks.push(one);
      }

      for (var pk = 0; pk < picks.length; pk++) {
        var opt = q.options[picks[pk]];
        var eff = opt.effect || { type: 'none', value: 0 };
        var val = toNum(eff.value); if (val === null) val = eff.type === 'multiply' ? 1 : 0;

        if (eff.type === 'multiply') {
          var m = val;
          if (q.role === 'urgency') {
            var scale = K.rush_premium / 50;
            m = 1 + (val - 1) * scale;
            m = clamp(m, 0.5, 3.0);
          }
          mult *= m;
          if (Math.abs(m - 1) > 0.005) drivers.push({ label: q.label, answer: opt.label, detail: pctWord(m) });
        } else if (eff.type === 'add') {
          add += val;
          if (Math.abs(val) > 0.005) drivers.push({ label: q.label, answer: opt.label, detail: (val > 0 ? 'adds ' : 'takes off ') + fmtPlain(Math.abs(val), cfg) });
        } else if (eff.type === 'widen') {
          widen += clamp(val, 0, 0.5);
          drivers.push({ label: q.label, answer: opt.label, detail: 'widens the range at both ends while this is unknown' });
        }
      }
    }

    mult = clamp(mult, 0.4, 4.0);
    widen = clamp(widen, 0, 1.0);

    var lo = baseLo * mult + add;
    var hi = baseHi * mult + add;
    if (!isFiniteNum(lo)) lo = 0;
    if (!isFiniteNum(hi)) hi = 0;
    if (hi < lo) { var sw = lo; lo = hi; hi = sw; }

    /* price level */
    var levelF = 1 + (K.price_level - 50) / 50 * 0.20;
    lo *= levelF; hi *= levelF;

    /* range width + widen */
    var mid = (lo + hi) / 2;
    var half = (hi - lo) / 2;
    half = half * (0.25 + 1.5 * K.range_width / 100);
    half += widen * mid;
    lo = mid - half; hi = mid + half;

    /* safety buffer on the high end */
    hi += mid * (K.safety_buffer / 100 * 0.30);

    if (lo < 0) lo = 0;
    if (hi < lo) hi = lo;

    /* rounding */
    var stepLo = roundStep(K.rounding, lo, isHours);
    var stepHi = roundStep(K.rounding, hi, isHours);
    var rLo = roundDown(lo, stepLo);
    var rHi = roundUp(hi, stepHi);
    if (rLo < 0) rLo = 0;
    if (rHi < rLo) rHi = rLo;

    /* line items keep the same shape as the total */
    var scaleLo = baseLo > 0 ? rLo / baseLo : 0;
    var scaleHi = baseHi > 0 ? rHi / baseHi : 0;
    var lineItems = [];
    for (var pi2 = 0; pi2 < perService.length; pi2++) {
      var ps = perService[pi2];
      var ilo = ps.lo * scaleLo, ihi = ps.hi * scaleHi;
      var istep = roundStep(K.rounding, ilo, isHours);
      lineItems.push({
        key: ps.key,
        label: ps.label,
        lo: roundDown(ilo, istep),
        hi: roundUp(ihi, roundStep(K.rounding, ihi, isHours))
      });
    }

    /* timeline */
    var dLo = 0, dHi = 0;
    for (var d1 = 0; d1 < perService.length; d1++) {
      dLo = Math.max(dLo, perService[d1].days_lo || 0);
      dHi += (perService[d1].days_hi || 0);
    }
    if (dHi > 120) dHi = 120;
    if (dHi < dLo) dHi = dLo;

    /* unit conversion */
    var rate = cfg.business ? toNum(cfg.business.hourly_rate) : null;
    var unit = cfg.business ? cfg.business.unit : 'price';
    var priceLo = null, priceHi = null;
    if (unit === 'price') { priceLo = rLo; priceHi = rHi; }
    else if (unit === 'both' && rate) {
      priceLo = roundDown(rLo * rate, roundStep(K.rounding, rLo * rate, false));
      priceHi = roundUp(rHi * rate, roundStep(K.rounding, rHi * rate, false));
    }

    var text;
    if (unit === 'price') text = fmtMoney(rLo, cfg) + ' to ' + fmtMoney(rHi, cfg);
    else if (unit === 'hours') text = fmtHours(rLo) + ' to ' + fmtHours(rHi) + ' hours';
    else text = fmtHours(rLo) + ' to ' + fmtHours(rHi) + ' hours' + (priceLo !== null ? ' (' + fmtMoney(priceLo, cfg) + ' to ' + fmtMoney(priceHi, cfg) + ')' : '');

    var tStyle = cfg.toggles && cfg.toggles.timeline_style === 'range' ? 'range' : 'about';
    var tDays = tStyle === 'about' ? Math.round((dLo + dHi) / 2) : dLo;
    var timelineText = (dLo === dHi || tStyle === 'about')
      ? (tDays === 1 ? 'About 1 day on site' : 'About ' + tDays + ' days')
      : dLo + ' to ' + dHi + ' days';

    var names = [];
    for (var nn = 0; nn < perService.length; nn++) names.push(perService[nn].label);

    return {
      lo: rLo, hi: rHi, unit: unit,
      price_lo: priceLo, price_hi: priceHi,
      days_lo: dLo, days_hi: dHi,
      drivers: drivers,
      line_items: lineItems,
      text: text,
      timeline_text: timelineText,
      services_text: names.join(', ')
    };
  }

  function pctWord(m) {
    var pct = Math.round((m - 1) * 100);
    if (pct === 0) return 'no change';
    if (pct > 0) return 'adds about ' + pct + '%';
    return 'takes off about ' + Math.abs(pct) + '%';
  }

  /* ------------------------------------------------------------------ *
   * 8. Knob explanations, in plain words
   * ------------------------------------------------------------------ */

  function explainKnob(name, value) {
    var v = toNum(value);
    if (v === null) v = 50;
    v = Math.round(clamp(v, 0, 100));
    var n = String(name || '').toLowerCase();

    if (n === 'range_width') {
      var k = 0.25 + 1.5 * v / 100;
      if (Math.abs(k - 1) < 0.02) return 'Range width ' + v + ': your low and high stay exactly as you typed them.';
      if (k < 1) return 'Range width ' + v + ': both ends move ' + Math.round((1 - k) * 100) + '% closer to the middle, so your low goes up and your high comes down. Tighter reads as more confident and gives you less room to be wrong.';
      return 'Range width ' + v + ': both ends move ' + Math.round((k - 1) * 100) + '% further from the middle, so your low comes down and your high goes up. Wider leaves room for a job that turns out bigger than it looked.';
    }
    if (n === 'price_level') {
      var p = Math.round((v - 50) / 50 * 20);
      if (p === 0) return 'Price level ' + v + ': prices show exactly as you typed them.';
      if (p > 0) return 'Price level ' + v + ': every price shows ' + p + '% higher than what you typed.';
      return 'Price level ' + v + ': every price shows ' + Math.abs(p) + '% lower than what you typed.';
    }
    if (n === 'safety_buffer') {
      var b = Math.round(v / 100 * 30);
      if (b === 0) return 'Safety buffer 0: no padding at all, your high end stays where the range put it.';
      return 'Safety buffer ' + v + ': your high end gets about ' + b + '% more room so surprises are covered. Your low end never moves.';
    }
    if (n === 'rush_premium') {
      if (v === 0) return 'Rush premium 0: urgent jobs cost the same as any other job.';
      if (v === 50) return 'Rush premium 50: urgent jobs cost exactly the extra you typed.';
      if (v < 50) return 'Rush premium ' + v + ': urgent jobs get ' + Math.round(v / 50 * 100) + '% of the extra you typed.';
      return 'Rush premium ' + v + ': urgent jobs get ' + Math.round(v / 50 * 100) + '% of the extra you typed, so rush work costs more.';
    }
    if (n === 'rounding') {
      if (v <= 0) return 'Rounding 0: prices show to the exact dollar, like 1,247.';
      if (v <= 33) return 'Rounding ' + v + ': prices round to the nearest 5, like 1,245.';
      if (v <= 66) return 'Rounding ' + v + ': prices round to the nearest 25, like 1,250.';
      return 'Rounding ' + v + ': prices round to the nearest 50 (or nearest 100 above 1,000), like 1,300.';
    }
    if (n === 'detail_shown') {
      if (v <= 33) return 'Detail shown ' + v + ': customers see the price range only.';
      if (v <= 66) return 'Detail shown ' + v + ': customers see the range plus what drives their price.';
      return 'Detail shown ' + v + ': customers see the range, the drivers, and a price per service.';
    }
    return 'This setting is on ' + v + ' out of 100.';
  }

  /* ------------------------------------------------------------------ *
   * 9. Train on past jobs
   * ------------------------------------------------------------------ */

  function train(config, jobs) {
    try {
      return trainInner(config, jobs);
    } catch (e) {
      return { suggestions: [], skipped: [{ service: '', reason: 'We could not read those past jobs. Check the columns are service, quoted low, quoted high, actual.' }] };
    }
  }

  function trainInner(config, jobs) {
    var cfg = isObj(config) ? config : defaults();
    var list = isArr(jobs) ? jobs : [];
    var byKey = {}, byLabel = {};
    for (var i = 0; i < (cfg.services || []).length; i++) {
      byKey[cfg.services[i].key] = cfg.services[i];
      byLabel[slugify(cfg.services[i].label, '')] = cfg.services[i];
    }

    var groups = {}, unknown = {};
    for (var j = 0; j < list.length; j++) {
      var row = list[j];
      if (!isObj(row)) continue;
      var nameRaw = row.service !== undefined ? row.service : row.key;
      var key = slugify(nameRaw, '');
      var svc = byKey[key] || byLabel[key] || null;
      if (!svc) {
        var lbl = String(nameRaw === undefined || nameRaw === null ? '' : nameRaw).slice(0, 60);
        unknown[lbl || '(blank)'] = (unknown[lbl || '(blank)'] || 0) + 1;
        continue;
      }
      var ql = toNum(row.quoted_lo); if (ql === null) ql = toNum(row.quoted_low);
      var qh = toNum(row.quoted_hi); if (qh === null) qh = toNum(row.quoted_high);
      var act = toNum(row.actual);
      if (act === null || act <= 0) continue;
      if (ql === null && qh === null) continue;
      if (ql === null) ql = qh;
      if (qh === null) qh = ql;
      if (ql > qh) { var t = ql; ql = qh; qh = t; }
      var mid = (ql + qh) / 2;
      if (!(mid > 0)) continue;
      var ratio = act / mid;
      if (!isFiniteNum(ratio) || ratio <= 0) continue;
      if (!groups[svc.key]) groups[svc.key] = { service: svc.key, label: svc.label, rows: [] };
      groups[svc.key].rows.push({ ratio: ratio, quoted_lo: ql, quoted_hi: qh, actual: act });
    }

    var suggestions = [], skipped = [];
    for (var uk in unknown) {
      if (!Object.prototype.hasOwnProperty.call(unknown, uk)) continue;
      skipped.push({ service: uk, n: unknown[uk], reason: 'We do not have a service called "' + uk + '". Check the spelling on the Prices tab, or rename it in your pasted data.' });
    }

    for (var gk in groups) {
      if (!Object.prototype.hasOwnProperty.call(groups, gk)) continue;
      var g = groups[gk];
      var allRatios = [];
      for (var r0 = 0; r0 < g.rows.length; r0++) allRatios.push(g.rows[r0].ratio);
      var med0 = median(allRatios);
      var kept = [], outliers = [];
      for (var r1 = 0; r1 < g.rows.length; r1++) {
        var rr = g.rows[r1];
        if (med0 && (rr.ratio > med0 * 2.5 || rr.ratio < med0 / 2.5)) {
          outliers.push({ quoted_lo: rr.quoted_lo, quoted_hi: rr.quoted_hi, actual: rr.actual, ratio: Math.round(rr.ratio * 100) / 100 });
        } else kept.push(rr);
      }
      var n = kept.length;
      if (n < 3) {
        skipped.push({
          service: g.service, label: g.label, n: n, outliers: outliers,
          reason: n === 0
            ? 'Every ' + g.label + ' job looked like a one-off, so we changed nothing.'
            : 'Only ' + n + ' usable ' + g.label + ' job' + (n === 1 ? '' : 's') + '. We need at least 3 before we touch a price.'
        });
        continue;
      }
      var keptRatios = [];
      for (var r2 = 0; r2 < kept.length; r2++) keptRatios.push(kept[r2].ratio);
      var medR = median(keptRatios);
      var current = calFactor(cfg, g.service);
      var wanted = current * medR;
      var capLo = current * 0.85, capHi = current * 1.15;
      var capped = clamp(wanted, capLo, capHi);
      var wasCapped = Math.abs(capped - wanted) > 0.0005;
      capped = clamp(capped, 0.5, 2.0);
      suggestions.push({
        service: g.service,
        label: g.label,
        n: n,
        median_ratio: Math.round(medR * 1000) / 1000,
        current_factor: Math.round(current * 1000) / 1000,
        suggested_factor: Math.round(capped * 1000) / 1000,
        change_pct: Math.round((capped / current - 1) * 1000) / 10,
        capped: wasCapped,
        confidence: n <= 4 ? 'low' : 'ok',
        outliers: outliers,
        note: plainTrainNote(g.label, medR, capped, current, n, wasCapped, outliers.length)
      });
    }

    suggestions.sort(function (a, b) { return Math.abs(b.change_pct) - Math.abs(a.change_pct); });
    return { suggestions: suggestions, skipped: skipped };
  }

  function plainTrainNote(label, medR, next, current, n, wasCapped, outCount) {
    var dir = medR > 1 ? 'over' : 'under';
    var pct = Math.abs(Math.round((medR - 1) * 100));
    var movePct = Math.round((next / current - 1) * 100);
    var s = 'Across ' + n + ' jobs, ' + label + ' came in about ' + pct + '% ' + dir + ' your quote on average.';
    if (movePct === 0) s += ' That is close enough that we suggest no change.';
    else s += ' We suggest moving this price ' + (movePct > 0 ? 'up ' : 'down ') + Math.abs(movePct) + '%.';
    if (wasCapped) s += ' We capped the move at 15% so nothing jumps too far in one go.';
    if (outCount) s += ' We left ' + outCount + ' odd job' + (outCount === 1 ? '' : 's') + ' out of the maths.';
    return s;
  }

  function applyTraining(config, accepted) {
    try {
      var cfg = deepClone(isObj(config) ? config : defaults());
      if (!isObj(cfg.calibration)) cfg.calibration = { per_service: {}, last_trained: null, rounds: 0 };
      if (!isObj(cfg.calibration.per_service)) cfg.calibration.per_service = {};
      var list = isArr(accepted) ? accepted : (accepted ? [accepted] : []);
      var applied = 0;
      var valid = {};
      for (var v = 0; v < (cfg.services || []).length; v++) valid[cfg.services[v].key] = 1;
      for (var i = 0; i < list.length; i++) {
        var a = list[i];
        if (!isObj(a)) continue;
        var key = slugify(a.service || a.key, '');
        if (!valid[key]) continue;
        var f = toNum(a.suggested_factor);
        if (f === null || f <= 0) continue;
        cfg.calibration.per_service[key] = Math.round(clamp(f, 0.5, 2.0) * 1000) / 1000;
        applied++;
      }
      if (applied) {
        cfg.calibration.rounds = (toNum(cfg.calibration.rounds) || 0) + 1;
        cfg.calibration.last_trained = new Date().toISOString().slice(0, 10);
      }
      return cfg;
    } catch (e) {
      return config;
    }
  }

  /* ------------------------------------------------------------------ *
   * 9b. v1.2: possibly fake leads and the owner's watch list
   * ------------------------------------------------------------------ */

  var TIMELINE_STYLES = ['about', 'range'];
  var FAKE_NAME_WORDS = ['test', 'testing', 'tester', 'asdf', 'asdfg', 'asdfgh', 'qwerty', 'fake', 'dummy', 'sample', 'xxx'];
  var FAKE_FULL_NAMES = ['john doe', 'jane doe'];
  var FAKE_EMAIL_DOMAINS = ['example.com', 'example.org', 'example.net'];
  var FAKE_EMAIL_TLDS = ['test', 'example', 'invalid', 'localhost'];

  function normWords(v) {
    return str(v).toLowerCase().replace(/[^a-z0-9@.\s'-]/g, ' ').replace(/[\s]+/g, ' ').trim();
  }

  /* The estimate ALWAYS still shows and sends. This only labels the lead, so the
   * owner's workflow can skip the call task. Plain reasons, one per rule hit. */
  function fakeCheck(contact) {
    var c = isObj(contact) ? contact : {};
    var reasons = [];
    var name = normWords(c.name).replace(/[.'-]/g, ' ').replace(/\s+/g, ' ').trim();
    if (name) {
      var words = name.split(' ');
      var hit = '';
      for (var i = 0; i < words.length && !hit; i++) {
        if (FAKE_NAME_WORDS.indexOf(words[i]) !== -1) hit = words[i];
        else if (/^([a-z])\1{2,}$/.test(words[i])) hit = words[i];
      }
      if (!hit && FAKE_FULL_NAMES.indexOf(name) !== -1) hit = name;
      if (hit) reasons.push('the name looks like a test (' + hit + ')');
    }
    var email = str(c.email).trim().toLowerCase();
    var at = email.lastIndexOf('@');
    if (at > 0) {
      var dom = email.slice(at + 1);
      var tld = dom.split('.').pop();
      if (FAKE_EMAIL_DOMAINS.indexOf(dom) !== -1 || FAKE_EMAIL_TLDS.indexOf(tld) !== -1) reasons.push('the email address is a test address (' + dom + ')');
    }
    var digits = str(c.phone).replace(/\D/g, '');
    if (digits.length === 11 && digits.charAt(0) === '1') digits = digits.slice(1);
    if (digits.length >= 7) {
      var local7 = digits.slice(-7);
      if (/^55501\d\d$/.test(local7)) reasons.push('the phone number is a 555-01xx number, which is kept for films and tests');
      else if (/^(\d)\1+$/.test(digits)) reasons.push('the phone number is one digit repeated');
      else if ('01234567890123456789'.indexOf(digits) !== -1 || '98765432109876543210'.indexOf(digits) !== -1) reasons.push('the phone number is digits in a row');
    }
    return { possibly_fake: reasons.length > 0, reasons: reasons };
  }

  /* The watch list: names or email domains the owner types. It never ships as
   * plain text: the funnel file and a live link carry a short fingerprint of each
   * entry (#xxxxxxxx), because anyone can read a web page's source. */
  var WATCH_HASH_RE = /^#[0-9a-f]{8}$/;
  function watchNorm(v) {
    return str(v).toLowerCase().replace(/^[\s@]+/, '').replace(/[^a-z0-9@.&'\s-]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function watchHash(v) {
    var s = 'efk-watch:' + v, h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul ? Math.imul(h, 0x01000193) : (h * 0x01000193) | 0; }
    return '#' + ('0000000' + (h >>> 0).toString(16)).slice(-8);
  }
  function cleanWatchList(raw) {
    var list = isArr(raw) ? raw : (isStr(raw) ? raw.split(/[\n,;]+/) : []);
    var out = [];
    for (var i = 0; i < list.length && out.length < 200; i++) {
      if (!isStr(list[i])) continue;
      var t = list[i].trim().toLowerCase();
      var v = WATCH_HASH_RE.test(t) ? t : watchNorm(t).slice(0, 80);
      if (v && out.indexOf(v) === -1) out.push(v);
    }
    return out;
  }
  function watchHashes(list) {
    var set = {};
    var l = cleanWatchList(list);
    for (var i = 0; i < l.length; i++) set[WATCH_HASH_RE.test(l[i]) ? l[i] : watchHash(l[i])] = true;
    return set;
  }
  function watchMatch(config, contact) {
    var lc = config && isObj(config.lead_capture) ? config.lead_capture : {};
    var set = watchHashes(lc.watch_list);
    if (!Object.keys(set).length) return false;
    var c = isObj(contact) ? contact : {};
    var cands = [watchNorm(c.name), watchNorm(c.company)];
    var email = watchNorm(c.email).replace(/\s/g, '');
    if (email) {
      cands.push(email);
      var at = email.lastIndexOf('@');
      if (at > 0) {
        var parts = email.slice(at + 1).split('.');
        for (var p = 0; p < parts.length - 1; p++) cands.push(parts.slice(p).join('.'));
      }
    }
    for (var j = 0; j < cands.length; j++) if (cands[j] && set[watchHash(cands[j])]) return true;
    return false;
  }
  /* The config as it may be published: the watch list as fingerprints only. */
  function publicConfig(config) {
    var c = deepClone(isObj(config) ? config : defaults());
    if (isObj(c.lead_capture) && c.lead_capture.watch_list !== undefined) {
      c.lead_capture.watch_list = Object.keys(watchHashes(c.lead_capture.watch_list)).sort();
    }
    return c;
  }

  /* ------------------------------------------------------------------ *
   * 10. The webhook payload - these keys NEVER change
   * ------------------------------------------------------------------ */

  function payload(config, answers, contact, meta) {
    var out = {
      name: '', email: '', phone: '',
      business_name: '', niche: '',
      services_text: '',
      estimate_low: 0, estimate_high: 0, estimate_unit: 'price',
      currency: 'USD',
      timeline_text: '',
      answers_text: '',
      knobs_text: '',
      page_url: '', utm_source: '', utm_medium: '', utm_campaign: '',
      submitted_at: '', kit_version: VERSION,
      /* v1.1, additive: one human readable block for a CRM note or an email */
      summary_text: '',
      /* v1.1.1, additive: the two ends ready to read, as the result card shows
       * them ("$4,500", or "12 hours"), so an email never says "4500 to 9500" */
      estimate_low_text: '', estimate_high_text: '',
      /* v1.2, additive: a lead that looks like a test or made up (the estimate still
       * shows and still sends), and a match on the owner's watch list */
      possibly_fake: false, fake_reasons: '',
      watch_match: false
    };
    try {
      var cfg = isObj(config) ? config : defaults();
      var c = isObj(contact) ? contact : {};
      var m = isObj(meta) ? meta : {};
      var est = estimate(cfg, answers);

      out.name = str(c.name).slice(0, 120);
      out.email = str(c.email).slice(0, 160);
      out.phone = str(c.phone).slice(0, 40);
      out.business_name = str(cfg.business && cfg.business.name).slice(0, 120);
      out.niche = str(cfg.business && cfg.business.niche).slice(0, 60);
      out.services_text = est.services_text || '';
      out.estimate_low = est.lo;
      out.estimate_high = est.hi;
      if (est.hi > 0) {
        out.estimate_low_text = fmtPlain(est.lo, cfg);
        out.estimate_high_text = fmtPlain(est.hi, cfg);
      }
      out.estimate_unit = est.unit;
      out.currency = str(cfg.business && cfg.business.currency) || 'USD';
      out.timeline_text = est.timeline_text || '';

      var lines = [];
      var ans = isObj(answers) ? answers : {};
      var sel = isArr(ans.services) ? ans.services : [];
      lines.push('Q: What do you need? A: ' + (est.services_text || '(none picked)'));
      var qs = applicableQuestions(cfg, sel);
      var qAns = isObj(ans.q) ? ans.q : {};
      for (var i = 0; i < qs.length; i++) {
        var q = qs[i];
        var a = qAns[q.key];
        if (a === undefined || a === null || a === '') continue;
        var text = '';
        if (q.type === 'number') text = String(a);
        else if (q.type === 'multi') {
          var arr = isArr(a) ? a : [a], picked = [];
          for (var j = 0; j < arr.length; j++) {
            var ix = Math.round(toNum(arr[j]));
            if (q.options && q.options[ix]) picked.push(q.options[ix].label);
          }
          text = picked.join(', ');
        } else {
          var one = Math.round(toNum(a));
          text = (q.options && q.options[one]) ? q.options[one].label : '';
        }
        if (text) lines.push('Q: ' + q.label + ' A: ' + text);
      }
      out.answers_text = lines.join('\n');

      var sum = [];
      sum.push('Estimate request for ' + (out.business_name || 'your business'));
      sum.push('Service(s): ' + (est.services_text || '(none picked)'));
      sum.push('Estimate: ' + estimateLine(est, cfg));
      if (out.timeline_text) sum.push('Timeline: ' + out.timeline_text);

      var fk = fakeCheck(c);
      out.possibly_fake = fk.reasons.length > 0;
      out.fake_reasons = fk.reasons.join('; ').slice(0, 300);
      out.watch_match = watchMatch(cfg, c);
      if (out.possibly_fake) sum.push('Possibly a test or made up lead: ' + out.fake_reasons);
      if (out.watch_match) sum.push('On your watch list');
      sum.push('');
      out.summary_text = (sum.join('\n') + '\n' + out.answers_text).slice(0, 4000);

      var kbits = [];
      for (var k = 0; k < KNOB_KEYS.length; k++) {
        var kv = cfg.knobs && cfg.knobs[KNOB_KEYS[k]];
        kbits.push(KNOB_KEYS[k] + '=' + (toNum(kv) === null ? KNOB_DEFAULTS[KNOB_KEYS[k]] : Math.round(toNum(kv))));
      }
      out.knobs_text = kbits.join(' ');

      out.page_url = str(m.page_url).slice(0, 400);
      out.utm_source = str(m.utm_source).slice(0, 120);
      out.utm_medium = str(m.utm_medium).slice(0, 120);
      out.utm_campaign = str(m.utm_campaign).slice(0, 120);
      out.submitted_at = str(m.submitted_at) || new Date().toISOString();
    } catch (e) { /* the shape above still ships */ }
    return out;
  }

  /* "$3,825 to $8,675 USD", "12 to 20 hours", "12 to 20 hours ($1,500 to $2,500 USD)" */
  function estimateLine(est, cfg) {
    var cur = str(cfg && cfg.business && cfg.business.currency) || 'USD';
    if (!est || !(est.hi > 0)) return '(no estimate)';
    if (est.unit === 'price') return est.text + ' ' + cur;
    if (est.unit === 'both' && est.price_lo !== null) return est.text.replace(/\)$/, ' ' + cur + ')');
    return est.text;
  }

  /* ------------------------------------------------------------------ *
   * 10b. Where leads go (v1.1)
   * ------------------------------------------------------------------ */

  /* The mode the funnel really runs in. Anything half set up is 'none', so the
   * funnel never tells a visitor their details went somewhere they did not. */
  function leadMode(config) {
    var lc = config && isObj(config.lead_capture) ? config.lead_capture : {};
    var dest = isStr(lc.destination) ? lc.destination : '';
    var wh = isStr(lc.webhook_url) ? lc.webhook_url : '';
    var ek = isStr(lc.email_key) ? lc.email_key : '';
    if (!dest) dest = wh ? 'webhook' : (ek ? 'email' : 'none');
    if (dest === 'webhook' && /^https:\/\/[^\s"'<>`\\]+$/i.test(wh)) return 'webhook';
    if (dest === 'email' && UUID_RE.test(ek)) return 'email';
    return 'none';
  }

  /* The body the email relay gets: the lead's own fields plus summary_text as
   * the message, so the email reads like a note, not a data dump. */
  function relayBody(config, answers, contact, meta) {
    var p = payload(config, answers, contact, meta);
    var cfg = isObj(config) ? config : defaults();
    var lc = isObj(cfg.lead_capture) ? cfg.lead_capture : {};
    var est = estimate(cfg, answers);
    return {
      access_key: isStr(lc.email_key) ? lc.email_key : '',
      subject: ('New estimate request: ' + (p.name || 'a visitor') + (p.services_text ? ', ' + p.services_text : '')).slice(0, 150),
      from_name: (p.business_name || 'Estimate funnel').slice(0, 80) + ' estimate funnel',
      name: p.name,
      email: p.email,
      phone: p.phone,
      estimate: estimateLine(est, cfg),
      message: p.summary_text,
      page_url: p.page_url
    };
  }

  /* v1.1.2: the owner alert. When the CRM send is not confirmed (a network error, no answer in
   * 15 seconds, or, for a CRM whose answer the browser can read, an error answer) and a backup
   * email key is set, the same lead goes to the owner by email, ALERT line first. v1.2.1: the line
   * says what is known, not more: a timed out send can still land in the CRM later. */
  var ALERT_LINE = 'ALERT: your CRM did not confirm this lead, so it was emailed to you. It may also be in your CRM. Check your funnel settings.';

  function alertKey(config) {
    var lc = config && isObj(config.lead_capture) ? config.lead_capture : {};
    var k = isStr(lc.alert_email_key) ? lc.alert_email_key.trim().toLowerCase() : '';
    return UUID_RE.test(k) ? k : '';
  }

  function alertRelayBody(config, answers, contact, meta) {
    var b = relayBody(config, answers, contact, meta);
    /* the alert key goes first in the email Web3Forms writes, the message starts with it too */
    return {
      access_key: alertKey(config),
      subject: ('ALERT, CRM did not confirm. ' + b.subject).slice(0, 150),
      from_name: b.from_name,
      alert: ALERT_LINE,
      name: b.name,
      email: b.email,
      phone: b.phone,
      estimate: b.estimate,
      message: ALERT_LINE + '\n\n' + b.message,
      page_url: b.page_url
    };
  }

  /* v1.2.1: webhooks whose answer the browser is allowed to read. HighLevel inbound webhooks
   * (services.leadconnectorhq.com) answer with Access-Control-Allow-Origin: * and accept a JSON
   * body (checked 2026-10-02: a text/plain body is answered "Error: Request has invalid data").
   * For these the funnel posts application/json in cors mode, reads the answer, and an HTTP
   * error or a {"status":"Error..."} answer counts as failed. Every other webhook is posted
   * no-cors as before: the browser cannot see that CRM's answer, so only a network error or
   * no answer in 15 seconds counts as failed. */
  var READABLE_WEBHOOK_RE = /^https:\/\/services\.leadconnectorhq\.com\//i;
  function webhookReadable(url) { return READABLE_WEBHOOK_RE.test(str(url).trim()); }

  /* One webhook post. Resolves, never rejects, to { state: 'sent' | 'failed', readable, detail }. */
  function postWebhook(url, body, f) {
    var readable = webhookReadable(url);
    var text = JSON.stringify(body);
    if (!readable) {
      return Promise.resolve().then(function () {
        return f(url, {
          method: 'POST', mode: 'no-cors', keepalive: true,
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: text
        });
      }).then(function () { return { state: 'sent', readable: false, detail: '' }; },
        function () { return { state: 'failed', readable: false, detail: 'no connection' }; });
    }
    return Promise.resolve().then(function () {
      return f(url, {
        method: 'POST', mode: 'cors',
        headers: { 'Content-Type': 'application/json' },
        body: text
      });
    }).then(function (r) {
      if (!r || !r.ok) return { state: 'failed', readable: true, detail: 'HTTP ' + (r && r.status ? r.status : 'error') };
      return Promise.resolve().then(function () { return typeof r.text === 'function' ? r.text() : ''; }).then(function (t) {
        var j = null;
        try { j = JSON.parse(t); } catch (e) { j = null; }
        var st = j && typeof j.status === 'string' ? j.status.trim() : '';
        if (/^error/i.test(st)) return { state: 'failed', readable: true, detail: st.slice(0, 160) };
        return { state: 'sent', readable: true, detail: st.slice(0, 160) };
      }, function () { return { state: 'sent', readable: true, detail: '' }; });
    }, function () { return { state: 'failed', readable: true, detail: 'no connection' }; });
  }

  /* Send one lead. deps.fetch is the browser's fetch (or a test double), deps.timeoutMs
   * defaults to 15 seconds per attempt. Resolves, never rejects, to
   * { state: 'sent' | 'failed' | 'unknown' | 'none', via: 'webhook' | 'email' | 'alert' | '' }.
   * The webhook goes through postWebhook (above): read for HighLevel, no-cors for the rest. The
   * email relay answers with JSON, so there 'sent' means the relay accepted it. Neither is proof
   * the lead reached an inbox or a contact was made. */
  function sendLead(config, answers, contact, meta, deps) {
    var d = isObj(deps) ? deps : {};
    var f = typeof d.fetch === 'function' ? d.fetch : null;
    var ms = toNum(d.timeoutMs);
    if (ms === null || ms <= 0) ms = 15000;
    var m = leadMode(config);
    if (m === 'none') return Promise.resolve({ state: 'none', via: '' });
    if (!f) return Promise.resolve({ state: 'failed', via: m });

    function timed(p) {
      return new Promise(function (res) {
        var done = false;
        var t = setTimeout(function () { if (!done) { done = true; res('unknown'); } }, ms);
        p.then(function (v) { if (!done) { done = true; clearTimeout(t); res(v); } },
          function () { if (!done) { done = true; clearTimeout(t); res('failed'); } });
      });
    }
    function relay(body) {
      return timed(Promise.resolve().then(function () {
        return f(RELAY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(body)
        });
      }).then(function (r) {
        return r.json().then(function (j) { return (r.ok && j && j.success === true) ? 'sent' : 'failed'; }, function () { return 'failed'; });
      }, function () { return 'failed'; }));
    }

    if (m === 'email') {
      return relay(relayBody(config, answers, contact, meta)).then(function (s) { return { state: s, via: 'email' }; });
    }
    var url = config.lead_capture.webhook_url;
    return timed(postWebhook(url, payload(config, answers, contact, meta), f)
      .then(function (r) { return r.state; })).then(function (w) {
      if (w === 'sent' || !alertKey(config)) return { state: w, via: 'webhook' };
      return relay(alertRelayBody(config, answers, contact, meta)).then(function (a) {
        if (a === 'sent') return { state: 'sent', via: 'alert' };
        /* nothing confirmed: 'unknown' when either attempt might still have landed */
        return { state: (w === 'unknown' || a === 'unknown') ? 'unknown' : 'failed', via: 'alert' };
      });
    });
  }

  /* ------------------------------------------------------------------ *
   * 10c. The live link (v1.1): the whole config travels in the URL fragment.
   * Link shape: <LIVE_BASE>/#v1.<base64url(deflate-raw(json))>, or v0. with
   * plain utf-8 when the browser has no CompressionStream. The runner treats
   * every field as hostile: size caps, strict https, then the doctor.
   * ------------------------------------------------------------------ */

  var LINK_MAX_FRAGMENT = 16384;
  var LINK_MAX_JSON = 200000;

  function b64urlFromBytes(bytes) {
    var bin = '';
    for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function bytesFromB64url(s) {
    if (!/^[A-Za-z0-9_-]+$/.test(s)) return null;
    var b = s.replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    var bin;
    try { bin = atob(b); } catch (e) { return null; }
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  /* The config minus everything the doctor puts back by itself, so the link
   * (and its QR code) stays as small as it can. */
  function linkConfig(config) {
    var c = publicConfig(config);
    var d = defaults();
    delete c.preview_result; delete c.kit_version; delete c.demo_banner; delete c.demo_banner_url;
    function sameAs(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
    ['knobs', 'toggles'].forEach(function (k) { if (sameAs(c[k], d[k])) delete c[k]; });
    if (isObj(c.calibration) && sameAs(c.calibration.per_service, {}) && !c.calibration.rounds) delete c.calibration;
    if (c.allow_multiple_services !== false) delete c.allow_multiple_services;
    if (isObj(c.business)) {
      for (var bk in c.business) if (Object.prototype.hasOwnProperty.call(c.business, bk) && (c.business[bk] === '' || c.business[bk] === null)) delete c.business[bk];
      if (c.business.currency === 'USD') delete c.business.currency;
      if (c.business.unit === 'price') delete c.business.unit;
    }
    if (isObj(c.lead_capture)) {
      var lc = c.lead_capture;
      if (sameAs(lc.fields, d.lead_capture.fields)) delete lc.fields;
      if (isArr(lc.watch_list) && !lc.watch_list.length) delete lc.watch_list;
      for (var lk in lc) if (Object.prototype.hasOwnProperty.call(lc, lk) && lc[lk] === '') delete lc[lk];
      if (lc.destination === 'none') delete lc.destination;
    }
    if (isObj(c.result_copy)) {
      for (var rk in d.result_copy) if (c.result_copy[rk] === d.result_copy[rk]) delete c.result_copy[rk];
    }
    (c.services || []).forEach(function (sv) { if (sv.help === '') delete sv.help; if (sv.example_data === false) delete sv.example_data; });
    (c.questions || []).forEach(function (q) {
      if (isArr(q.applies_to) && !q.applies_to.length) delete q.applies_to;
      if (q.type === 'single') delete q.type;
    });
    return c;
  }

  function encodeLink(config) {
    return Promise.resolve().then(function () {
      var bytes = new TextEncoder().encode(JSON.stringify(linkConfig(config)));
      if (typeof CompressionStream === 'function') {
        try {
          var cs = new CompressionStream('deflate-raw');
          return new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer().then(
            function (buf) { return 'v1.' + b64urlFromBytes(new Uint8Array(buf)); },
            function () { return 'v0.' + b64urlFromBytes(bytes); });
        } catch (e) { /* deflate-raw not supported here */ }
      }
      return 'v0.' + b64urlFromBytes(bytes);
    });
  }

  function inflateCapped(bytes, cap) {
    if (typeof DecompressionStream !== 'function') return Promise.reject(new Error('this browser cannot open compressed links'));
    var reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader();
    var chunks = [], total = 0;
    function pump() {
      return reader.read().then(function (r) {
        if (r.done) {
          var out = new Uint8Array(total), at = 0;
          for (var i = 0; i < chunks.length; i++) { out.set(chunks[i], at); at += chunks[i].length; }
          return out;
        }
        total += r.value.length;
        if (total > cap) { try { reader.cancel(); } catch (e) { /* done */ } throw new Error('the link unpacks to more than ' + cap + ' bytes'); }
        chunks.push(r.value);
        return pump();
      });
    }
    return pump();
  }

  function linkFail(reason) { return { ok: false, config: null, reason: reason }; }

  /* A link config is attacker controlled. Every link field must already be https
   * (no silent http repair here), the relay key must look like a key, and the
   * doctor must pass it. */
  function checkLinkConfig(raw) {
    if (!isObj(raw)) return linkFail('the link does not hold a settings object');
    var b = isObj(raw.business) ? raw.business : {};
    var lc = isObj(raw.lead_capture) ? raw.lead_capture : {};
    var urls = [b.booking_url, b.logo_url, lc.webhook_url, raw.demo_banner_url];
    for (var i = 0; i < urls.length; i++) {
      if (urls[i] === undefined || urls[i] === null || urls[i] === '') continue;
      if (!isStr(urls[i]) || !/^https:\/\/[^\s"'<>`\\]+$/i.test(urls[i].trim())) return linkFail('a link in the settings is not a plain https link');
    }
    if (lc.email_key !== undefined && lc.email_key !== '' && !(isStr(lc.email_key) && UUID_RE.test(lc.email_key.trim()))) return linkFail('the email key is not a key');
    if (lc.alert_email_key !== undefined && lc.alert_email_key !== '' && !(isStr(lc.alert_email_key) && UUID_RE.test(lc.alert_email_key.trim()))) return linkFail('the backup email key is not a key');
    var dx = doctor(raw);
    if (!dx.ok) return linkFail('the settings do not pass the doctor: ' + dx.errors.join(' '));
    var cfg = dx.config;
    cfg.demo_banner = false;
    cfg.demo_banner_url = '';
    delete cfg.preview_result;
    return { ok: true, config: cfg, reason: '' };
  }

  /* v1.2.1: split a live link fragment into the packed settings and any query written after
   * them. "LINK#v1.xxx?utm_source=booked" happens when an owner appends ?utm_source=booked to a
   * live link; the settings alphabet has no "?", so the split is safe. */
  function splitLinkFragment(fragment) {
    var f = fragment === null || fragment === undefined ? '' : String(fragment);
    if (f.charAt(0) === '#') f = f.slice(1);
    var q = f.indexOf('?');
    if (q === -1) return { packed: f, query: '' };
    return { packed: f.slice(0, q), query: f.slice(q + 1) };
  }

  /* The utm_ values a visitor arrived with: from the page query (location.search), and from a
   * query written after a live link's settings. The page query wins when both carry one. */
  function linkUtm(search, fragment) {
    var out = { utm_source: '', utm_medium: '', utm_campaign: '' };
    function take(q) {
      var parts = str(q).replace(/^\?/, '').split('&');
      var got = {};
      for (var i = 0; i < parts.length; i++) {
        var kv = parts[i].split('=');
        var k = '', v = '';
        try { k = decodeURIComponent(kv[0].replace(/\+/g, ' ')); v = decodeURIComponent(kv.slice(1).join('=').replace(/\+/g, ' ')); } catch (e) { continue; }
        if (Object.prototype.hasOwnProperty.call(out, k) && !got[k]) got[k] = v.slice(0, 120);
      }
      return got;
    }
    var fromHash = take(splitLinkFragment(fragment).query);
    var fromPage = take(search);
    for (var k in out) {
      if (!Object.prototype.hasOwnProperty.call(out, k)) continue;
      out[k] = fromPage[k] || fromHash[k] || '';
    }
    return out;
  }

  /* The call prep link for a booking confirmation: the funnel link with utm_source=booked in its
   * query, which is always BEFORE any #. Works for a hosted file and for a live link. */
  function callPrepLink(url) {
    var s = str(url).trim();
    if (!s) return '';
    var hash = '';
    var h = s.indexOf('#');
    if (h !== -1) { hash = s.slice(h); s = s.slice(0, h); }
    /* a query an owner wrote after the settings belongs before the # */
    var hq = hash.indexOf('?');
    var extra = '';
    if (hq !== -1) { extra = hash.slice(hq + 1); hash = hash.slice(0, hq); }
    var q = '';
    var qi = s.indexOf('?');
    if (qi !== -1) { q = s.slice(qi + 1); s = s.slice(0, qi); }
    var parts = (q + (q && extra ? '&' : '') + extra).split('&').filter(function (p) { return p && !/^utm_source=/i.test(p); });
    parts.push('utm_source=booked');
    return s + '?' + parts.join('&') + hash;
  }

  function decodeLink(fragment) {
    return Promise.resolve().then(function () {
      var f = splitLinkFragment(fragment).packed;
      if (!f) return linkFail('the link has no settings in it');
      if (f.length > LINK_MAX_FRAGMENT) return linkFail('the link is too long');
      var m = /^v([01])\.([A-Za-z0-9_-]+)$/.exec(f);
      if (!m) return linkFail('the link is from an unknown version');
      var bytes = bytesFromB64url(m[2]);
      if (!bytes || !bytes.length) return linkFail('the link is damaged');
      var raw = m[1] === '1' ? inflateCapped(bytes, LINK_MAX_JSON)
        : (bytes.length > LINK_MAX_JSON ? Promise.reject(new Error('too big')) : Promise.resolve(bytes));
      return raw.then(function (u8) {
        var text = new TextDecoder('utf-8', { fatal: true }).decode(u8);
        return checkLinkConfig(JSON.parse(text));
      });
    }).then(null, function (e) { return linkFail('the link could not be read (' + String(e && e.message ? e.message : e).slice(0, 80) + ')'); });
  }

  function str(v) {
    if (v === null || v === undefined) return '';
    if (typeof v === 'object') return '';
    return String(v);
  }

  /* ------------------------------------------------------------------ *
   * 11. Three sample leads for the knob preview
   * ------------------------------------------------------------------ */

  function sampleLeads(config) {
    var out = [
      { label: 'Small job', answers: { services: [], q: {} } },
      { label: 'Typical job', answers: { services: [], q: {} } },
      { label: 'Big job', answers: { services: [], q: {} } }
    ];
    try {
      var cfg = isObj(config) ? config : defaults();
      var svcs = isArr(cfg.services) ? cfg.services : [];
      if (!svcs.length) return out;

      /* Cheapest first. The "typical" lead is deliberately NOT the middle of the list:
       * a middle row is usually a small add-on, and then the knob sliders look like
