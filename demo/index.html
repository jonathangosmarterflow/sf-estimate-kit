       * they do nothing. Typical = the second biggest job, big = the biggest. */
      var sorted = svcs.slice().sort(function (a, b) { return ((a.lo + a.hi) / 2) - ((b.lo + b.hi) / 2); });
      var last = sorted.length - 1;
      var small = [sorted[0].key];
      var typical = [sorted[sorted.length >= 3 ? last - 1 : Math.floor(sorted.length / 2)].key];
      var big;
      if (cfg.allow_multiple_services !== false && sorted.length > 1) {
        big = [sorted[last].key, sorted[last - 1].key];
      } else {
        big = [sorted[last].key];
      }

      var picks = [small, typical, big];
      var modes = ['low', 'mid', 'high'];
      for (var i = 0; i < 3; i++) {
        out[i].answers.services = picks[i];
        var qs = applicableQuestions(cfg, picks[i]);
        for (var j = 0; j < qs.length; j++) {
          var q = qs[j];
          if (q.type === 'number') {
            var mn = isFiniteNum(q.min) ? q.min : 0;
            var mx = isFiniteNum(q.max) ? q.max : 10;
            out[i].answers.q[q.key] = modes[i] === 'low' ? mn : (modes[i] === 'mid' ? Math.round((mn + mx) / 2) : mx);
            continue;
          }
          var opts = isArr(q.options) ? q.options : [];
          if (!opts.length) continue;
          var bestIdx = 0, bestScore = null;
          for (var o = 0; o < opts.length; o++) {
            var e = opts[o].effect || { type: 'none', value: 0 };
            if (e.type === 'widen') continue; // a sample lead is never "not sure"
            var score;
            if (e.type === 'multiply') score = toNum(e.value) || 1;
            else if (e.type === 'add') score = 1 + (toNum(e.value) || 0) / 1000;
            else score = 1;
            if (bestScore === null) { bestScore = score; bestIdx = o; continue; }
            if (modes[i] === 'low' && score < bestScore) { bestScore = score; bestIdx = o; }
            if (modes[i] === 'high' && score > bestScore) { bestScore = score; bestIdx = o; }
            if (modes[i] === 'mid' && Math.abs(score - 1) < Math.abs(bestScore - 1)) { bestScore = score; bestIdx = o; }
          }
          out[i].answers.q[q.key] = q.type === 'multi' ? [bestIdx] : bestIdx;
        }
      }
    } catch (e) { /* defaults above */ }
    return out;
  }

  /* ------------------------------------------------------------------ *
   * Export
   * ------------------------------------------------------------------ */

  var EFK = {
    version: VERSION,
    defaults: defaults,
    doctor: doctor,
    estimate: estimate,
    explainKnob: explainKnob,
    train: train,
    applyTraining: applyTraining,
    payload: payload,
    sampleLeads: sampleLeads,
    /* additive helpers used by studio.html and funnel.html */
    applicableQuestions: applicableQuestions,
    knobKeys: KNOB_KEYS.slice(),
    slugify: slugify,
    fmtMoney: fmtMoney,
    fmtHours: fmtHours,
    parseJobs: parseJobs,
    lenientParse: function (t) { return lenientParse(t, []); },
    firstBalanced: firstBalanced,
    /* v1.1 */
    RELAY_URL: RELAY_URL,
    leadMode: leadMode,
    relayBody: relayBody,
    ALERT_LINE: ALERT_LINE,
    alertKey: alertKey,
    alertRelayBody: alertRelayBody,
    sendLead: sendLead,
    /* v1.2.1 */
    webhookReadable: webhookReadable,
    postWebhook: postWebhook,
    splitLinkFragment: splitLinkFragment,
    linkUtm: linkUtm,
    callPrepLink: callPrepLink,
    isPlaceholderUrl: isPlaceholderUrl,
    linkConfig: linkConfig,
    encodeLink: encodeLink,
    decodeLink: decodeLink,
    LINK_MAX_FRAGMENT: LINK_MAX_FRAGMENT,
    LINK_MAX_JSON: LINK_MAX_JSON,
    /* v1.2 */
    fakeCheck: fakeCheck,
    watchMatch: watchMatch,
    publicConfig: publicConfig,
    timelineStyles: TIMELINE_STYLES.slice()
  };

  /* ------------------------------------------------------------------ *
   * 12. Forgiving past-jobs parser (CSV, tabs, semicolons, pipes)
   * ------------------------------------------------------------------ */

  function splitRow(line) {
    if (line.indexOf('\t') !== -1) return line.split('\t');
    if (line.indexOf('|') !== -1 && line.indexOf(',') === -1) return line.split('|');
    if (line.indexOf(';') !== -1 && line.indexOf(',') === -1) return line.split(';');
    /* comma split that respects quotes */
    var out = [], cur = '', inQ = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (ch === '"') { inQ = !inQ; continue; }
      if (ch === ',' && !inQ) { out.push(cur); cur = ''; continue; }
      cur += ch;
    }
    out.push(cur);
    return out;
  }

  function parseJobs(text) {
    var jobs = [], problems = [];
    try {
      var lines = String(text || '').split(/\r\n|\r|\n/);
      var order = null;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (!line || !line.trim()) continue;
        var cells = splitRow(line);
        for (var c = 0; c < cells.length; c++) cells[c] = String(cells[c]).trim();
        var joined = cells.join(' ').toLowerCase();

        if (order === null && /service|job|item/.test(joined) && /actual|final|real|billed/.test(joined)) {
          order = { service: -1, lo: -1, hi: -1, actual: -1 };
          for (var h = 0; h < cells.length; h++) {
            var hh = cells[h].toLowerCase();
            if (order.service === -1 && /service|job|item|type/.test(hh)) order.service = h;
            else if (order.lo === -1 && /(low|lo|min|from)/.test(hh) && !/actual/.test(hh)) order.lo = h;
            else if (order.hi === -1 && /(high|hi|max|to)/.test(hh) && !/actual/.test(hh)) order.hi = h;
            else if (order.actual === -1 && /actual|final|real|billed/.test(hh)) order.actual = h;
          }
          continue;
        }
        var nums = [];
        for (var k = 0; k < cells.length; k++) { var nv = toNum(cells[k]); if (nv !== null) nums.push({ i: k, v: nv }); }
        var name = '';
        for (var m = 0; m < cells.length; m++) {
          if (cells[m] && toNum(cells[m]) === null) { name = cells[m]; break; }
        }
        var lo = null, hi = null, act = null;
        if (order && order.service !== -1 && order.actual !== -1 && cells.length > order.actual) {
          name = cells[order.service] || name;
          lo = order.lo !== -1 ? toNum(cells[order.lo]) : null;
          hi = order.hi !== -1 ? toNum(cells[order.hi]) : null;
          act = toNum(cells[order.actual]);
        } else if (nums.length >= 3) {
          lo = nums[0].v; hi = nums[1].v; act = nums[2].v;
        } else if (nums.length === 2) {
          lo = nums[0].v; hi = nums[0].v; act = nums[1].v;
        } else {
          problems.push('Line ' + (i + 1) + ' did not have enough numbers on it, so we skipped it.');
          continue;
        }
        if (!name) { problems.push('Line ' + (i + 1) + ' had no service name, so we skipped it.'); continue; }
        if (act === null) { problems.push('Line ' + (i + 1) + ' had no final price, so we skipped it.'); continue; }
        jobs.push({ service: name, quoted_lo: lo, quoted_hi: hi, actual: act });
        if (jobs.length > 2000) break;
      }
    } catch (e) {
      problems.push('We could not read that. Paste four columns: service, quoted low, quoted high, and what it actually came to.');
    }
    return { jobs: jobs, problems: problems };
  }

  root.EFK = EFK;
  /* node / ESM interop. A file imported with `await import('./engine.js')` hands back
   * EFK on .default (and on .EFK), and globalThis.EFK is set either way. No `export`
   * keyword is used, because that would make this file unreadable to plain `require`. */
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = EFK;
    module.exports.EFK = EFK;
    module.exports.default = EFK;
  }

})(typeof globalThis !== 'undefined' ? globalThis : (typeof window !== 'undefined' ? window : this));
</script>

<script>/* Estimate Funnel Kit - zip preview guard (v1.1). One source, inlined by build.mjs
 * into START-HERE.html, studio.html and funnel.html. On Windows, double clicking a
 * file inside a zip opens a temporary copy, and nothing next to it works. This
 * spots that case and says so, once, in plain words. Hosted https pages and
 * normal folders never trigger it. */
(function () {
  function efkLooksLikeZipPreview(href) {
    var s = String(href || '');
    if (!/^file:/i.test(s)) return false;
    var p = s;
    try { p = decodeURIComponent(s); } catch (e) { /* keep it raw */ }
    p = p.replace(/\\/g, '/').toLowerCase();
    if (/\.zip\//.test(p)) return true;
    if (/\/appdata\/local\/temp\//.test(p)) return true;
    if (/\/temp\d+_[^\/]*\//.test(p)) return true;
    if (/\/7zo[0-9a-z]*\//.test(p)) return true;
    if (/\/rar\$ex[^\/]*\//.test(p)) return true;
    return false;
  }
  if (typeof window === 'undefined' || typeof document === 'undefined') {
    if (typeof globalThis !== 'undefined') globalThis.efkLooksLikeZipPreview = efkLooksLikeZipPreview;
    return;
  }
  window.efkLooksLikeZipPreview = efkLooksLikeZipPreview;
  var here = '';
  try { here = location.href; } catch (e) { return; }
  if (!efkLooksLikeZipPreview(here)) return;
  try { if (sessionStorage.getItem('efk-zip-ok') === '1') return; } catch (e) { /* storage blocked */ }
  function show() {
    if (document.getElementById('efk-zip-guard')) return;
    var o = document.createElement('div');
    o.id = 'efk-zip-guard';
    o.setAttribute('role', 'alertdialog');
    o.setAttribute('aria-label', 'Extract the kit first');
    o.style.cssText = 'position:fixed;inset:0;z-index:2147483000;background:#f6f7f9;display:flex;align-items:center;justify-content:center;padding:16px;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#0f172a';
    var c = document.createElement('div');
    c.style.cssText = 'max-width:560px;width:100%;background:#fff;border:1px solid #e3e7ee;border-left:5px solid #d97706;border-radius:14px;padding:26px 24px;box-shadow:0 12px 32px rgba(15,23,42,.08)';
    var h = document.createElement('h1');
    h.style.cssText = 'font-size:22px;line-height:1.25;margin:0 0 10px;letter-spacing:-.01em';
    h.textContent = 'One step first: this kit is still inside the zip.';
    var p = document.createElement('p');
    p.style.cssText = 'margin:0 0 18px;color:#334155';
    p.textContent = 'Close this tab, right click the zip, choose Extract All, then open START-HERE.html from the new folder.';
    var a = document.createElement('a');
    a.href = '#';
    a.textContent = 'Continue anyway';
    a.style.cssText = 'font-size:14px;color:#64748b';
    a.addEventListener('click', function (ev) {
      ev.preventDefault();
      try { sessionStorage.setItem('efk-zip-ok', '1'); } catch (e) { /* fine */ }
      if (o.parentNode) o.parentNode.removeChild(o);
    });
    c.appendChild(h); c.appendChild(p); c.appendChild(a);
    o.appendChild(c);
    document.body.appendChild(o);
  }
  if (document.body) show();
  else document.addEventListener('DOMContentLoaded', show);
})();
</script>

<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ *
 * Boot: read the config. If anything is wrong, the owner sees a
 * friendly message. A blank page is never acceptable.
 * ------------------------------------------------------------------ */
var root = document.getElementById('root');

/* Build constants. The downloaded funnel keeps RUNNER false. The hosted live
 * runner (live-runner/index.html) is this same file with RUNNER true: it reads
 * its settings from the link itself and always shows the kit footer. */
var RUNNER = false;
var KIT_URL = "https://gosmarterflow.com";
var REPORT_MAILTO = 'mailto:jonathan@gosmarterflow.com?subject=' + encodeURIComponent('Report a live funnel');

function esc(s){
  return String(s===null||s===undefined?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* Only plain https links ever reach an href or a src. */
function safeHref(u){
  return (typeof u === 'string' && /^https:\/\/[^\s"'<>`\\]+$/i.test(u)) ? u : '';
}

function panic(title, points){
  var li = '';
  for (var i=0;i<points.length;i++) li += '<li>'+esc(points[i])+'</li>';
  root.innerHTML = '<div class="panic"><h2>'+esc(title)+'</h2>'
    + '<p style="margin:0 0 10px;font-size:14.5px;color:#4b5563">Your visitors should not see this page. Here is how to fix it:</p>'
    + '<ol style="margin:0;padding-left:20px">'+li+'</ol>'
    + '<p style="margin:14px 0 0;font-size:13px;color:#6b7280">Open your Estimate Funnel Kit studio, fix the point above, then download this page again.</p></div>';
  postHeight();
}

/* The live runner's footer. It is not in the settings, so no link can remove it. */
function kitFooterHtml(){
  if (!RUNNER) return '';
  return '<div class="kitfoot"><a href="'+esc(safeHref(KIT_URL))+'" target="_blank" rel="noopener">Built with the Estimate Funnel Kit</a>'
    + ' &middot; <a href="'+esc(REPORT_MAILTO)+'">Report this page</a></div>';
}

/* What a visitor sees when a live link is damaged, too big, too old or hostile. */
function broken(){
  root.innerHTML = '<div class="panic" id="broken"><h2>This link is broken or out of date.</h2>'
    + '<p style="margin:0;font-size:15px;color:#4b5563">Ask the business for a fresh link.</p></div>'
    + kitFooterHtml();
  try { document.title = 'Link not available'; } catch(e){}
  postHeight();
}

var RAW = '';
try { RAW = RUNNER ? '' : (document.getElementById('FUNNEL_CONFIG').textContent || ''); } catch(e){ RAW = ''; }

if (typeof EFK === 'undefined') {
  panic('This page is missing its pricing engine.', [
    'Download funnel.html again from the Publish tab in your studio.',
    'Do not copy only part of the file. It has to be the whole file.'
  ]);
  return;
}

var DX = { ok:false, errors:[], config:null };
var CFG = null;

/* ------------------------------------------------------------------ *
 * State
 * ------------------------------------------------------------------ */
var LOADED_AT = Date.now();
var MIN_SECONDS = 4;
var answers = { services: [], q: {} };
var contact = { name:'', email:'', phone:'' };
var stepIndex = 0;
/* '' (not sent), 'sending', 'sent', 'failed' or 'unknown'. Only 'sent' ever
 * tells the visitor their details went anywhere. */
var sendState = '';
var botFlag = false;
var SELFTEST = false, PREVIEW_RESULT = false;
try {
  SELFTEST = /[?&]selftest=1/.test(location.search);
  PREVIEW_RESULT = /[?&]preview=result/.test(location.search);
} catch(e){}
/* the studio's side preview asks for the result screen this way, because an
 * iframe built from srcdoc cannot carry a query string. Never from a live link. */
try { if (!RUNNER && /"preview_result"\s*:\s*true/.test(RAW)) PREVIEW_RESULT = true; } catch(e){}

/* v1.2.1: utm_ values come from the page query (a hosted file, or a live link written
 * LINK?utm_source=booked#v1...) and from a query written after a live link's settings
 * (LINK#v1...?utm_source=booked). EFK.linkUtm reads both. */
var UTM = { utm_source:'', utm_medium:'', utm_campaign:'' };
try { UTM = EFK.linkUtm(location.search, location.hash); } catch(e){}

function applyBrand(){
  try {
    var col = CFG.business.brand_color;
    if (!/^#[0-9a-fA-F]{6}$/.test(col)) return;
    document.documentElement.style.setProperty('--brand', col);
    var hex = col.replace('#','');
    var r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
    if (isFinite(r)&&isFinite(g)&&isFinite(b)) {
      document.documentElement.style.setProperty('--brand-soft','rgba('+r+','+g+','+b+',.10)');
      document.documentElement.style.setProperty('--brand-line','rgba('+r+','+g+','+b+',.30)');
    }
  } catch(e){}
  try { document.title = (CFG.business.name || 'Instant estimate') + ' - instant estimate'; } catch(e){}
}

function mode(){ return EFK.leadMode(CFG); }
function bizName(){ return (CFG && CFG.business && CFG.business.name) || 'the business'; }

/* ------------------------------------------------------------------ *
 * Step plan
 * ------------------------------------------------------------------ */
function buildSteps(){
  var steps = [{ kind:'services' }];
  var qs = EFK.applicableQuestions(CFG, answers.services);
  for (var i=0;i<qs.length;i++) steps.push({ kind:'question', q: qs[i] });
  if (CFG.toggles.contact_before_result && mode() !== 'none') steps.push({ kind:'contact' });
  steps.push({ kind:'result' });
  return steps;
}

function currentSteps(){ return buildSteps(); }

/* ------------------------------------------------------------------ *
 * Render
 * ------------------------------------------------------------------ */
function header(){
  var b = CFG.business;
  var logo = safeHref(b.logo_url);
  var left = logo
    ? '<img class="logo" id="bizlogo" src="'+esc(logo)+'" alt="'+esc(b.name)+'">'
      + '<span class="bizname" id="bizfallback" style="display:none">'+esc(b.name)+'</span>'
    : '<span class="bizname">'+esc(b.name)+'</span>';
  var right = b.service_area ? '<span class="tag">'+esc(b.service_area)+'</span>' : (b.tagline ? '<span class="tag">'+esc(b.tagline)+'</span>' : '');
  return '<div class="head">'+left+right+'</div>';
}

function bannerHtml(){
  if (!CFG.demo_banner || RUNNER) return '';
  var link = safeHref(CFG.demo_banner_url)
    ? ' <a href="'+esc(safeHref(CFG.demo_banner_url))+'" target="_blank" rel="noopener">See how it was built</a>'
    : '';
  return '<div class="banner"><span>Demo built with the Estimate Funnel Kit</span>'+link+'</div>';
}

function render(){
  var steps = currentSteps();
  if (stepIndex >= steps.length) stepIndex = steps.length - 1;
  if (stepIndex < 0) stepIndex = 0;
  var step = steps[stepIndex];
  var pct = Math.round(((stepIndex) / Math.max(1, steps.length - 1)) * 100);

  var body = '';
  if (step.kind === 'services') body = viewServices();
  else if (step.kind === 'question') body = viewQuestion(step.q);
  else if (step.kind === 'contact') body = viewContact();
  else body = viewResult();

  var backBtn = stepIndex > 0 && step.kind !== 'result'
    ? '<button class="back" type="button" data-act="back">&#8592; Back</button>' : '';

  var counter = step.kind === 'result'
    ? '<span>All done</span>'
    : '<span>Step '+(stepIndex+1)+' of '+steps.length+'</span>';

  root.innerHTML = bannerHtml() + '<div class="wrap">' + header()
    + '<div class="card"><div class="pbar"><i style="width:'+pct+'%"></i></div>'
    + '<div class="pad fadein">'
    + '<div class="meta">'+backBtn+counter+'</div>'
    + body
    + '</div></div>'
    + '<div class="foot">'+esc(mode() === 'none'
        ? 'Your answers stay on this page. Nothing is sent anywhere.'
        : 'Your answers are only sent if you choose to send them, and only to ' + bizName() + '.')+'</div>'
    + '</div>' + kitFooterHtml();

  wireLogo();
  wire(step);
  focusFirst();
  postHeight();
}

function wireLogo(){
  var lg = root.querySelector('#bizlogo');
  if (!lg) return;
  var fail = function(){
    lg.style.display = 'none';
    var f = root.querySelector('#bizfallback');
    if (f) f.style.display = 'inline';
  };
  lg.addEventListener('error', fail);
  if (lg.complete && lg.naturalWidth === 0 && lg.getAttribute('src')) fail();
}

function focusFirst(){
  if (SELFTEST) return;
  try {
    var el = root.querySelector('.opt, .inp');
    if (el && stepIndex > 0) el.focus({ preventScroll:true });
  } catch(e){}
}

/* ---- step 1: pick the service ---- */
function viewServices(){
  var multi = CFG.allow_multiple_services !== false;
  var h = '<h1 class="q">What do you need help with?</h1>'
    + '<p class="sub">'+(multi ? 'Pick everything that applies.' : 'Pick the one that fits best.')+'</p>'
    + '<div class="opts" role="group">';
  for (var i=0;i<CFG.services.length;i++){
    var s = CFG.services[i];
    var on = answers.services.indexOf(s.key) !== -1;
    h += '<button class="opt'+(on?' sel':'')+'" type="button" data-act="svc" data-key="'+esc(s.key)+'">'
       + esc(s.label)
       + (s.help ? '<span class="oh">'+esc(s.help)+'</span>' : '')
       + '<span class="tick">'+(on?'&#10003;':'')+'</span></button>';
  }
  h += '</div>';
  h += '<div class="err" id="err">Pick at least one thing so we can price it.</div>';
  h += '<button class="btn" type="button" data-act="next"'+(answers.services.length?'':' disabled')+'>Continue</button>';
  return h;
}

/* ---- a question ---- */
function viewQuestion(q){
  var h = '<h1 class="q">'+esc(q.label)+'</h1>';
  if (q.help) h += '<p class="sub">'+esc(q.help)+'</p>';
  else if (q.type === 'multi') h += '<p class="sub">Pick everything that applies.</p>';

  if (q.type === 'number'){
    var cur = answers.q[q.key];
    if (cur === undefined) cur = q.min;
    h += '<div class="fields"><div><label class="fl" for="numin">Enter a number</label>'
      + '<input class="inp" id="numin" type="number" inputmode="numeric" min="'+q.min+'" max="'+q.max+'" step="'+q.step+'" value="'+esc(cur)+'"></div></div>'
      + '<div class="err" id="err">Enter a number between '+q.min+' and '+q.max+'.</div>'
      + '<button class="btn" type="button" data-act="numnext">Continue</button>';
    return h;
  }

  h += '<div class="opts" role="group">';
  for (var i=0;i<q.options.length;i++){
    var sel;
    if (q.type === 'multi') {
      var arr = answers.q[q.key] || [];
      sel = arr.indexOf(i) !== -1;
    } else sel = answers.q[q.key] === i;
    h += '<button class="opt'+(sel?' sel':'')+'" type="button" data-act="opt" data-q="'+esc(q.key)+'" data-i="'+i+'">'
      + esc(q.options[i].label)
      + '<span class="tick">'+(sel?'&#10003;':'')+'</span></button>';
  }
  h += '</div>';
  if (q.type === 'multi'){
    h += '<div class="err" id="err">Pick at least one answer.</div>';
    h += '<button class="btn" type="button" data-act="next">Continue</button>';
  }
  return h;
}

/* ---- contact ---- */
function viewContact(){
  var f = CFG.lead_capture.fields;
  var h = '<h1 class="q">Who is this estimate for?</h1>'
    + '<p class="sub">'+esc(bizName())+' gets your answers with your estimate. Your number is on the next screen.</p>'
    + '<div class="fields">';
  if (f.indexOf('name') !== -1) h += fld('name','Your name','text','Alex Rivera','name');
  if (f.indexOf('email') !== -1) h += fld('email','Email','email','alex@example.com','email');
  if (f.indexOf('phone') !== -1) h += fld('phone','Phone (optional)','tel','(555) 012 3456','tel');
  h += '</div>';
  h += '<input class="hp" type="text" name="company" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">';
  h += '<div class="err" id="err">Add a valid email address so they can reach you.</div>';
  h += '<button class="btn" type="button" data-act="contact">See my estimate</button>';
  if (CFG.lead_capture.consent_text) h += '<div class="fine">'+esc(CFG.lead_capture.consent_text)+'</div>';
  return h;
}

function fld(key, label, type, ph, ac){
  return '<div><label class="fl" for="f-'+key+'">'+esc(label)+'</label>'
    + '<input class="inp" id="f-'+key+'" type="'+type+'" autocomplete="'+ac+'" placeholder="'+esc(ph)+'" value="'+esc(contact[key]||'')+'"></div>';
}

/* ---- result ---- */
function viewResult(){
  var est = EFK.estimate(CFG, answers);
  var detail = CFG.knobs.detail_shown;
  var h = '<div class="res-lab">'+esc(CFG.result_copy.headline)+'</div>';

  if (est.unit === 'both' && est.price_lo !== null){
    h += '<div class="res-num">'+esc(EFK.fmtMoney(est.price_lo, CFG)+' to '+EFK.fmtMoney(est.price_hi, CFG))+'</div>';
    h += '<div class="res-alt">About '+esc(EFK.fmtHours(est.lo)+' to '+EFK.fmtHours(est.hi))+' hours of work</div>';
  } else {
    h += '<div class="res-num">'+esc(est.text)+'</div>';
  }

  h += '<div class="chipline">';
  if (est.services_text) h += '<span class="chip">'+esc(est.services_text)+'</span>';
  if (CFG.toggles.show_timeline && est.timeline_text) h += '<span class="chip time">'+esc(est.timeline_text)+'</span>';
  h += '</div>';

  if (CFG.toggles.show_drivers && detail > 33 && est.drivers.length){
    h += '<div class="sec"><h2>What drives your price</h2>';
    for (var i=0;i<est.drivers.length && i<8;i++){
      var d = est.drivers[i];
      h += '<div class="drv"><div class="dl"><b>'+esc(d.answer)+'</b>'+esc(d.label)+'</div><div class="dv">'+esc(d.detail)+'</div></div>';
    }
    h += '</div>';
  }

  if (detail > 66 && est.line_items.length > 1){
    h += '<div class="sec"><h2>Line by line</h2>';
    for (var j=0;j<est.line_items.length;j++){
      var li = est.line_items[j];
      var txt = (est.unit === 'price')
        ? EFK.fmtMoney(li.lo, CFG)+' to '+EFK.fmtMoney(li.hi, CFG)
        : EFK.fmtHours(li.lo)+' to '+EFK.fmtHours(li.hi)+' hours';
      h += '<div class="li"><span>'+esc(li.label)+'</span><b>'+esc(txt)+'</b></div>';
    }
    h += '</div>';
  }

  var url = safeHref(CFG.business.booking_url);
  if (url) {
    h += '<a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener" data-act="cta">'+esc(CFG.result_copy.cta_label)+'</a>';
  } else {
    h += '<button class="btn" type="button" disabled>'+esc(CFG.result_copy.cta_label)+'</button>';
  }

  /* Honest lead copy. With nowhere to send, there is no contact form at all and
   * the booking button is the one next step. With somewhere to send, the page
   * only says "sent" after the send really went out. */
  if (mode() !== 'none'){
    if (sendState) h += '<div class="sec" id="postcontact">' + statusHtml(sendState) + '</div>';
    else if (!CFG.toggles.contact_before_result) h += '<div class="sec" id="postcontact">' + viewContactInline() + '</div>';
  }

  h += '<div class="disc">'+esc(CFG.result_copy.disclaimer)+'</div>';
  h += '<div style="margin-top:14px"><button class="btn ghost" type="button" data-act="restart">Start over</button></div>';
  return h;
}

function statusHtml(st){
  var biz = esc(bizName());
  if (st === 'sending') return '<h2 class="st"><span class="spin" style="border-color:var(--brand-line);border-top-color:var(--brand)"></span>Sending your details to '+biz+'</h2>';
  if (st === 'sent') return '<h2 class="st">Sent to '+biz+'</h2><div class="fine" style="margin-top:0">They have your answers and this range. The fastest next step is the button above.</div>';
  if (st === 'unknown') return '<h2 class="st">We could not confirm it went through</h2><div class="fine" style="margin-top:0">Your estimate above is still yours. The fastest next step is the button above.</div>';
  return '<h2 class="st">We could not send your details</h2><div class="fine" style="margin-top:0">Nothing reached '+biz+' this time. Your estimate above is still yours, and the fastest next step is the button above.</div>';
}

function viewContactInline(){
  var f = CFG.lead_capture.fields;
  var h = '<h2>Send this estimate to '+esc(bizName())+'</h2>'
    + '<div class="fine" style="margin:-4px 0 10px">They get your answers with this range, so you do not have to explain it twice.</div>'
    + '<div class="fields">';
  if (f.indexOf('name') !== -1) h += fld('name','Your name','text','Alex Rivera','name');
  if (f.indexOf('email') !== -1) h += fld('email','Email','email','alex@example.com','email');
  if (f.indexOf('phone') !== -1) h += fld('phone','Phone (optional)','tel','(555) 012 3456','tel');
  h += '</div>';
  h += '<input class="hp" type="text" name="company" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">';
  h += '<div class="err" id="err">Add a valid email address so they can reach you.</div>';
  h += '<button class="btn ghost" type="button" data-act="contact">Send my estimate</button>';
  if (CFG.lead_capture.consent_text) h += '<div class="fine">'+esc(CFG.lead_capture.consent_text)+'</div>';
  return h;
}

/* ------------------------------------------------------------------ *
 * Interaction
 * ------------------------------------------------------------------ */
function showErr(msg){
  var e = root.querySelector('#err');
  if (!e) return;
  if (msg) e.textContent = msg;
  e.classList.add('on');
}

root.addEventListener('click', onClick);

function wire(step){
  var inputs = root.querySelectorAll('.inp');
  for (var i=0;i<inputs.length;i++){
    inputs[i].addEventListener('input', onInput);
    inputs[i].addEventListener('keydown', function(ev){
      if (ev.key === 'Enter'){
        ev.preventDefault();
        var b = root.querySelector('.btn:not([disabled])');
        if (b && b.tagName === 'BUTTON') b.click();
      }
    });
  }
}

function onInput(ev){
  var id = ev.target.id || '';
  if (id.indexOf('f-') === 0) contact[id.slice(2)] = ev.target.value;
  var e = root.querySelector('#err');
  if (e) e.classList.remove('on');
}

function onClick(ev){
  var t = ev.target;
  while (t && t !== root && !t.getAttribute('data-act')) t = t.parentNode;
  if (!t || t === root) return;
  var act = t.getAttribute('data-act');

  if (act === 'back'){ stepIndex--; render(); return; }

  if (act === 'restart'){
    answers = { services: [], q: {} };
    contact = { name:'', email:'', phone:'' };
    sendState = ''; stepIndex = 0; render(); return;
  }

  if (act === 'svc'){
    var key = t.getAttribute('data-key');
    var at = answers.services.indexOf(key);
    if (CFG.allow_multiple_services === false){
      answers.services = [key];
      render();
      setTimeout(function(){ stepIndex = 1; render(); }, 130);
      return;
    }
    if (at === -1) answers.services.push(key); else answers.services.splice(at,1);
    dropStaleAnswers();
    render(); return;
  }

  if (act === 'opt'){
    var qk = t.getAttribute('data-q');
    var ix = parseInt(t.getAttribute('data-i'),10);
    var q = findQuestion(qk);
    if (!q) return;
    if (q.type === 'multi'){
      var arr = answers.q[qk] || [];
      var pos = arr.indexOf(ix);
      if (pos === -1) arr.push(ix); else arr.splice(pos,1);
      answers.q[qk] = arr;
      render(); return;
    }
    answers.q[qk] = ix;
    render();
    setTimeout(function(){ stepIndex++; render(); }, 130);
    return;
  }

  if (act === 'numnext'){
    var el = root.querySelector('#numin');
    var q2 = currentSteps()[stepIndex].q;
    var v = el ? parseFloat(el.value) : NaN;
    if (!isFinite(v) || v < q2.min || v > q2.max){ showErr(); return; }
    answers.q[q2.key] = v;
    stepIndex++; render(); return;
  }

  if (act === 'next'){
    var st = currentSteps()[stepIndex];
    if (st.kind === 'services' && !answers.services.length){ showErr(); return; }
    if (st.kind === 'question' && st.q.type === 'multi'){
      var a = answers.q[st.q.key];
      if (!a || !a.length){ showErr(); return; }
    }
    stepIndex++; render(); return;
  }

  if (act === 'contact'){
    var hp = root.querySelector('#hp');
    if (hp && hp.value) botFlag = true;
    if ((Date.now() - LOADED_AT) / 1000 < MIN_SECONDS) botFlag = true;
    var email = (contact.email || '').trim();
    if (!/^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/.test(email)){ showErr('Add a valid email address so they can reach you.'); return; }
    t.setAttribute('disabled','disabled');
    sendState = 'sending';
    send().then(function(st){
      sendState = (st === 'none') ? '' : st;
      var box = root.querySelector('#postcontact');
      if (box) { box.innerHTML = sendState ? statusHtml(sendState) : ''; postHeight(); }
    });
    if (CFG.toggles.contact_before_result){ stepIndex++; render(); }
    else {
      var pc = root.querySelector('#postcontact');
      if (pc) pc.innerHTML = statusHtml('sending');
      postHeight();
    }
    return;
  }
}

function findQuestion(key){
  for (var i=0;i<CFG.questions.length;i++) if (CFG.questions[i].key === key) return CFG.questions[i];
  return null;
}

/* Drop answers to questions that no longer apply after a service change. */
function dropStaleAnswers(){
  var live = {};
  var qs = EFK.applicableQuestions(CFG, answers.services);
  for (var i=0;i<qs.length;i++) live[qs[i].key] = 1;
  for (var k in answers.q) if (Object.prototype.hasOwnProperty.call(answers.q,k) && !live[k]) delete answers.q[k];
}

/* ------------------------------------------------------------------ *
 * Send. Never blocks the result.
 * ------------------------------------------------------------------ */
/* Resolves to 'sent', 'failed', 'unknown' (no answer in 15 seconds) or 'none'.
 * The engine does the sending (EFK.sendLead), so the rules live in one place:
 * a webhook is posted no-cors, the email relay must answer success, and when the
 * CRM webhook fails or times out with a backup email key set, the lead is emailed
 * to the owner with an ALERT line first. Only a real delivery comes back 'sent'. */
function send(){
  if (mode() === 'none') return Promise.resolve('none');
  if (botFlag) return Promise.resolve('sent');
  try {
    var meta = {
      /* never the #fragment: on a live link that is the whole settings block */
      page_url: (function(){ try { return location.href.split('#')[0].slice(0,400); } catch(e){ return ''; } })(),
      utm_source: UTM.utm_source, utm_medium: UTM.utm_medium, utm_campaign: UTM.utm_campaign,
      submitted_at: new Date().toISOString()
    };
    var f = (typeof fetch === 'function') ? fetch.bind(window) : null;
    return EFK.sendLead(CFG, answers, contact, meta, { fetch: f })
      .then(function(r){ return (r && r.state) || 'failed'; }, function(){ return 'failed'; });
  } catch(e){ return Promise.resolve('failed'); }
}

/* ------------------------------------------------------------------ *
 * Tell the parent page how tall we are (HighLevel iframe auto-height)
 * ------------------------------------------------------------------ */
var lastH = 0;
function postHeight(){
  try {
    var h = Math.max(
      document.body.scrollHeight, document.documentElement.scrollHeight,
      document.body.offsetHeight, document.documentElement.offsetHeight
    );
    if (Math.abs(h - lastH) < 4) return;
    sendHeight(h);
  } catch(e){}
}
function sendHeight(h){
  lastH = h;
  if (window.parent && window.parent !== window){
    /* the named shape from CONFIG-CONTRACT P1 */
    window.parent.postMessage({ efk:'height', value:h }, '*');
    /* older snippets listened for this one, so both go out */
    window.parent.postMessage({ type:'efk-height', height:h, id:'estimate-funnel' }, '*');
  }
}
/* Height watching is event driven on purpose. A repeating timer would keep the
 * page busy forever, which breaks screenshot tools and wastes battery. */
try {
  if (typeof ResizeObserver === 'function'){
    new ResizeObserver(postHeight).observe(document.documentElement);
  } else {
    var ticks = 0;
    var iv = setInterval(function(){ postHeight(); if (++ticks > 20) clearInterval(iv); }, 500);
  }
} catch(e){}
window.addEventListener('resize', postHeight);
window.addEventListener('load', postHeight);
/* the parent can ask at any time */
window.addEventListener('message', function(ev){
  try {
    var d = ev.data;
    if (d && d.efk === 'height?'){
      lastH = 0;
      postHeight();
    }
  } catch(e){}
});

/* ------------------------------------------------------------------ *
 * Self test: walks the whole funnel with no human. Read with --dump-dom.
 * ------------------------------------------------------------------ */
function selftest(){
  var log = [], fails = 0;
  function check(name, cond, extra){
    if (cond) log.push('PASS ' + name);
    else { log.push('FAIL ' + name + (extra ? ' :: ' + extra : '')); fails++; }
  }
  try {
    check('config ok', DX.ok, DX.errors.join(' | '));
    check('services present', CFG.services.length > 0);

    /* pick the first service */
    var svcBtn = root.querySelector('[data-act="svc"]');
    check('service picker rendered', !!svcBtn);
    if (svcBtn) svcBtn.click();
    check('service selected', answers.services.length > 0);

    var next = root.querySelector('[data-act="next"]');
    if (next && !next.disabled) next.click();

    /* answer every question screen */
    var guard = 0;
    while (guard++ < 40){
      var steps = currentSteps();
      var st = steps[stepIndex];
      if (!st || st.kind === 'result' || st.kind === 'contact') break;
      if (st.kind === 'question'){
        if (st.q.type === 'number'){
          var ni = root.querySelector('#numin');
          if (ni) ni.value = st.q.min;
          var nb = root.querySelector('[data-act="numnext"]');
          if (nb) nb.click(); else { stepIndex++; render(); }
        } else {
          var o = root.querySelector('[data-act="opt"]');
          if (o) { answers.q[st.q.key] = st.q.type === 'multi' ? [0] : 0; stepIndex++; render(); }
          else { stepIndex++; render(); }
        }
      } else { stepIndex++; render(); }
    }
    check('walked past the questions in under 40 steps', guard < 40);

    /* contact step if it comes first */
    var stepsNow = currentSteps();
    if (stepsNow[stepIndex] && stepsNow[stepIndex].kind === 'contact'){
      contact.email = 'selftest@example.com';
      var em = root.querySelector('#f-email');
      if (em) em.value = contact.email;
      LOADED_AT = Date.now() - 99999;
      var cb = root.querySelector('[data-act="contact"]');
      check('contact button present', !!cb);
      if (cb) cb.click();
    }

    /* force the result view */
    var s2 = currentSteps();
    stepIndex = s2.length - 1;
    render();

    var num = root.querySelector('.res-num');
    check('result screen shows a number', !!num && /\d/.test(num.textContent), num ? num.textContent : 'no .res-num');

    var est = EFK.estimate(CFG, answers);
    check('low is not above high', est.lo <= est.hi, est.lo + ' > ' + est.hi);
    check('numbers are real numbers', isFinite(est.lo) && isFinite(est.hi));

    var cta = root.querySelector('[data-act="cta"]');
    check('one booking button on the result', !!cta || !CFG.business.booking_url);
    if (cta) check('booking link is https', /^https:\/\//.test(cta.getAttribute('href')), cta.getAttribute('href'));

    var ctaCount = root.querySelectorAll('.btn[href]').length;
    check('exactly one outbound call to action', ctaCount <= 1, 'found ' + ctaCount);

    var payload = EFK.payload(CFG, answers, { name:'T', email:'t@example.com', phone:'' }, {});
    var wantKeys = ['name','email','phone','business_name','niche','services_text','estimate_low','estimate_high','estimate_unit','currency','timeline_text','answers_text','knobs_text','page_url','utm_source','utm_medium','utm_campaign','submitted_at','kit_version','summary_text','estimate_low_text','estimate_high_text','possibly_fake','fake_reasons','watch_match'];
    var got = Object.keys(payload).sort().join(',');
    check('webhook payload keys are the fixed set', got === wantKeys.slice().sort().join(','), got);

    check('no external requests in this file', document.querySelectorAll('link[href^="http"], script[src], img[src^="http:"]').length === 0);

    /* v1.1 honesty: with nowhere to send, no contact form and no "sent" anywhere */
    var saved = CFG.lead_capture;
    CFG.lead_capture = JSON.parse(JSON.stringify(saved));
    CFG.lead_capture.destination = 'none'; CFG.lead_capture.webhook_url = ''; CFG.lead_capture.email_key = '';
    sendState = ''; render();
    check('nowhere mode shows no contact form', !root.querySelector('[data-act="contact"]'));
    check('nowhere mode never says sent', !/\bsent\b/i.test(root.querySelector('.card').textContent), root.querySelector('.card').textContent.slice(0,200));
    check('nowhere mode says nothing is sent', /Nothing is sent anywhere/.test(root.textContent));
    CFG.lead_capture.destination = 'webhook'; CFG.lead_capture.webhook_url = 'https://hooks.selftest.co/in';
    render();
    check('webhook mode offers to send the estimate', !!root.querySelector('[data-act="contact"]'));
    sendState = 'failed'; render();
    check('a failed send is never called sent', !/Sent to/.test(root.textContent) && /could not send/i.test(root.textContent));
    sendState = 'sent'; render();
    check('a real send says sent', /Sent to/.test(root.textContent));
    CFG.lead_capture = saved; sendState = ''; render();
    check('the live footer shows only on a live link', RUNNER ? !!root.querySelector('.kitfoot') : !root.querySelector('.kitfoot'));
    if (RUNNER) check('the live footer has the report link', /Report this page/.test(root.textContent));
  } catch(err){
    log.push('FAIL selftest crashed :: ' + (err && err.message ? err.message : String(err)));
    fails++;
  }
  var box = document.getElementById('selftest');
  box.className = '';
  box.setAttribute('style','position:fixed;left:0;bottom:0;right:0;z-index:99999;background:#111827;color:#d1fae5;font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px;max-height:44vh;overflow:auto;clip:auto');
  /* built with text nodes, because a log line can carry text from the settings */
  box.textContent = '';
  var vb = document.createElement('b');
  vb.id = 'selftest-verdict';
  vb.textContent = fails === 0 ? 'SELFTEST RESULT: ALL PASS' : 'SELFTEST RESULT: ' + fails + ' FAIL';
  box.appendChild(vb);
  for (var li2=0; li2<log.length; li2++){ box.appendChild(document.createElement('br')); box.appendChild(document.createTextNode(log[li2])); }
}

/* go */
function start(){
  applyBrand();
  if (PREVIEW_RESULT){
    /* Jump straight to a finished result. Used for screenshots and for the
     * Studio's live preview, never by a real visitor. Nothing is marked as sent. */
    try {
      var samp = EFK.sampleLeads(CFG);
      answers = samp[1] ? samp[1].answers : answers;
      stepIndex = currentSteps().length - 1;
    } catch(e){}
  }
  render();
  if (SELFTEST) setTimeout(selftest, 60);
}

if (RUNNER){
  var frag = '';
  try { frag = location.hash || ''; } catch(e){}
  try { window.addEventListener('hashchange', function(){ location.reload(); }); } catch(e){}
  EFK.decodeLink(frag).then(function(r){
    if (!r || !r.ok){ broken(); return; }
    DX = { ok:true, errors:[], config:r.config };
    CFG = r.config;
    start();
  }, broken);
} else {
  DX = EFK.doctor(RAW);
  /* The untouched template has no settings, so a visitor gets the setup message.
   * Opened with ?selftest=1 it tests itself against a small built-in sample instead. */
  if (!DX.ok && SELFTEST && !/"services"/.test(RAW)) {
    DX = EFK.doctor({ business: { name: 'Selftest Plumbing', booking_url: 'https://cal.selftest-plumbing.co/book' },
      services: [{ key: 'fix', label: 'Fix a leak', lo: 150, hi: 450, example_data: false }, { key: 'heater', label: 'New water heater', lo: 1400, hi: 3200, example_data: false }],
      questions: [{ key: 'urgency', label: 'How soon do you need this?', role: 'urgency', options: [
        { label: 'Today', effect: { type: 'multiply', value: 1.25 } }, { label: 'This week', effect: { type: 'none', value: 0 } }, { label: 'Not sure', effect: { type: 'widen', value: 0.1 } }] }] });
  }
  CFG = DX.config;
  if (!DX.ok) { panic('This estimate page is not set up yet.', DX.errors); return; }
  start();
}

})();
